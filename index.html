hom the secretariat invited to draft the test, arrived yesterday.", "She is the teacher whom everyone believes will coordinate the English department.", "Whom do you think should be responsible for revising the rubric?"], "a": 1, "e": "• Explicação detalhada: 'Whom' é pronome relativo/interrogativo de **caso objetivo** (objeto direto ou objeto de preposição). Na B, o sujeito da oração relativa é 'the secretariat' e o verbo é 'invited' ('invited whom?' → the external examiners), logo 'whom' é objeto direto e está perfeitamente empregado!\n• Análise dos distratores: Em A ('who scored highest'), C ('who [everyone believes] will coordinate') e D ('Who [do you think] should be responsible'), o pronome exerce função de **sujeito** dos verbos 'scored', 'will coordinate' e 'should be', exigindo obrigatoriamente **who**!", "k": "Teste do 'he/him': se você puder substituir na oração relativa por 'him/them' ('invited them'), use WHOM. Se for 'he/they' ('they scored'), use WHO!"}, {"id": 191, "b": "sint", "p": null, "d": "hard", "s": "Analyze the sentence: 'Hardly had the proctor distributed the exam booklets when a power outage interrupted the session.' Which grammatical observation about this sentence is INCORRECT?", "o": ["The inversion 'had the proctor distributed' is triggered by the initial negative/restrictive adverb 'Hardly'.", "The action of distributing the booklets occurred prior to the power outage.", "The correlative conjunction paired with 'Hardly' in standard English is 'than', making 'when' a grammatical error.", "The clause 'when a power outage interrupted the session' is a dependent adverbial clause of time."], "a": 2, "e": "• Explicação detalhada: Atenção ao comando **INCORRECT**! Em inglês padrão, o par correlativo de *Hardly / Scarcely / Barely* + Past Perfect é **when** (ou *before*), enquanto **than** é o par exclusivo de **No sooner** (*No sooner had the proctor distributed... **than** a power outage interrupted...*). Portanto, afirmar que 'when' é erro e que 'Hardly' pede 'than' é a afirmação **INCORRETA** (gabarito).\n• Análise dos distratores: A, B e D fazem descrições sintáticas e temporais totalmente corretas da frase.", "k": "Pares correlativos com inversão: Hardly / Scarcely / Barely ... WHEN | No sooner ... THAN. Nunca misture!"}, {"id": 192, "b": "sint", "p": null, "d": "hard", "s": "In 'The principal's decision to postpone the workshop disappointed the staff', the infinitive phrase 'to postpone the workshop' functions as", "o": ["an adverbial modifier of purpose modifying 'disappointed'.", "a postmodifier (complement) of the noun 'decision'.", "the direct object of the verb 'disappointed'.", "a subject complement following a linking verb."], "a": 1, "e": "• Explicação detalhada: O sintagma infinitivo 'to postpone the workshop' integra o sujeito complexo ('The principal's decision to postpone the workshop') e funciona como **complemento/modificador pós-nominal** do substantivo abstrato 'decision' (a decisão de adiar a oficina).\n• Análise dos distratores: A erra porque não expressa finalidade da decepção; C erra porque 'the staff' é o objeto direto de 'disappointed'; D erra porque 'disappointed' é transitivo direto, não verbo de ligação.", "k": "Substantivos derivados de verbos (decision to V, refusal to V, ability to V, attempt to V) levam sintagma infinitivo como complemento nominal."}, {"id": 193, "b": "sint", "p": null, "d": "hard", "s": "Consider the sentence: 'She acted as though she were the head of the department.' The verb form 'were' is used because the clause expresses", "o": ["a habitual action in the past.", "a counterfactual / hypothetical comparison in the present.", "a real condition likely to be fulfilled.", "subject-verb agreement with a plural subject."], "a": 1, "e": "• Explicação detalhada: Após 'as if' ou 'as though' ('como se'), quando a comparação é contrária aos fatos atuais (ela agiu como se fosse a chefe do departamento, mas não é), utiliza-se o **past subjunctive ('were')** para todas as pessoas gramaticais (inclusive *I, he, she, it*).\n• Análise dos distratores: A confunde subjuntivo com passado habitual; C descreve a 1ª condicional; D ignora que 'she' é singular e que 'were' aqui é modo subjuntivo, não plural.", "k": "As if / As though + situação irreal = Past Subjunctive ('were' para todas as pessoas: He talks as if he were the boss)."}, {"id": 194, "b": "sint", "p": null, "d": "hard", "s": "In 'Whether the new policy will reduce dropout rates remains to be seen', the dependent clause 'Whether the new policy will reduce dropout rates' is a", "o": ["adverbial clause of condition.", "noun clause functioning as the subject of 'remains'.", "non-restrictive adjective clause.", "coordinate clause linked by an alternative conjunction."], "a": 1, "e": "• Explicação detalhada: Toda a oração iniciada por 'Whether' ('Se a nova política reduzirá as taxas de evasão') funciona como o **sujeito** singular do verbo 'remains' (Isso ainda está para ser visto). Note que, na posição de sujeito inicial da frase, usa-se obrigatoriamente **Whether** (e não *If*).\n• Análise dos distratores: A confunde 'whether' substantivo com 'if' condicional; C e D erram a natureza subordinada substantiva da oração.", "k": "Oração substantiva subjetiva inicial ('Se X acontecer...') exige WHETHER ('Whether he comes is uncertain'), nunca 'If' no início da frase!"}, {"id": 195, "b": "sint", "p": null, "d": "hard", "s": "Identify the syntactic function of the underlined clause in: 'My biggest concern is that students memorize rules without understanding their communicative function.'", "o": ["Direct object.", "Subject complement (predicative nominative).", "Adverbial clause of result.", "Appositive."], "a": 1, "e": "• Explicação detalhada: A oração 'that students memorize rules without understanding their communicative function' vem imediatamente após o verbo de ligação (**linking verb**) 'is' e identifica/define o sujeito 'My biggest concern'. Trata-se de uma **Noun Clause functioning as Subject Complement** (oração subordinada substantiva predicativa).\n• Análise dos distratores: A exigiria verbo transitivo direto (ex.: 'I fear that...'); C exigiria correlação de intensidade ('so... that'); D exigiria justaposição direta a um substantivo sem verbo de ligação.", "k": "Sujeito + verbo de ligação (be, seem, remain) + that-clause = Noun Clause functioning as Subject Complement (predicativa)."}, {"id": 196, "b": "sint", "p": null, "d": "hard", "s": "In 'The more exposure learners have to authentic texts, the faster their reading fluency develops', the syntactic structure exemplifies", "o": ["a proportional comparative construction with two interdependent clauses.", "a simple sentence with two superlative adverbs.", "a compound sentence joined by correlative coordinating conjunctions.", "a restrictive relative clause."], "a": 0, "e": "• Explicação detalhada: A construção paralela `The + comparativo..., the + comparativo...` ('Quanto mais..., mais rápido...') é uma estrutura comparativa proporcional (proportional comparative construction) formada por duas orações interdependentes (a primeira expressa a condição/causa gradual e a segunda, o resultado proporcional).\n• Análise dos distratores: B erra ao chamar de superlativo ('more' e 'faster' são comparativos precedidos do artigo adverbial 'the'); C e D erram a classificação sintática.", "k": "'The + comparativo..., the + comparativo...' = estrutura comparativa proporcional ('Quanto mais..., mais...'). Aqui 'the' não é artigo de superlativo!"}, {"id": 197, "b": "sint", "p": null, "d": "hard", "s": "Which sentence illustrates a zero relative (contact clause), i.e., the grammatically valid omission of the relative pronoun?", "o": ["The textbook adopted by the district lacks communicative tasks.", "The linguistics professor whose book we read will lecture in Fortaleza.", "The feedback the teacher provided helped students revise their drafts.", "The school, which was founded in 1950, received a national award."], "a": 2, "e": "• Explicação detalhada: Em inglês, o pronome relativo (*who, whom, which, that*) pode ser omitido (formando uma **contact clause** ou **zero relative**) quando cumpre duas condições simultâneas: (1) a oração relativa é **restritiva** (sem vírgulas) e (2) o pronome relativo exerce função de **objeto** (direto ou de preposição) dentro da oração relativa. Na C, 'the feedback [that/which] the teacher provided' tem sujeito próprio ('the teacher'), e o relativo omitido é objeto direto de 'provided'.\n• Análise dos distratores: A é uma oração reduzida de particípio ('reduced relative clause'), não 'zero relative'; B usa 'whose' (possessivo nunca se omite); D é oração explicativa com vírgula (nunca admite omissão nem 'that').", "k": "Omissão do pronome relativo (Contact Clause): só em oração RESTRITIVA (sem vírgula) e quando o relativo é OBJETO (há outro sujeito logo depois)."}, {"id": 198, "b": "sint", "p": null, "d": "hard", "s": "Analyze the sentence: 'Only after the final grades had been published did the students realize the weight of the oral presentation.' Why is the auxiliary 'did' placed before the subject 'the students'?", "o": ["Because the sentence is an indirect question.", "Because an initial adverbial clause introduced by 'Only after' requires inversion in the main clause.", "Because 'realize' is a stative verb that cannot take an object without 'did'.", "Because the passive voice in the first clause forces inversion in the second."], "a": 1, "e": "• Explicação detalhada: Quando expressões restritivas iniciadas por **Only** (*Only after, Only when, Only if, Only by, Not until*) abrem o período acompanhando uma oração ou adjunto adverbial, a inversão sujeito-auxiliar ocorre **na oração principal** ('did the students realize'), e não na oração subordinada adverbial ('had been published' mantém ordem direta).\n• Análise dos distratores: A, C e D inventam regras gramaticais inexistentes.", "k": "Pegadinha de prova: com 'Only after / Only when / Not until + oração subordinada', a inversão acontece na ORAÇÃO PRINCIPAL, nunca dentro da subordinada!"}, {"id": 199, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Segundo a jurisprudência consolidada do Supremo Tribunal Federal (Súmula 473) e a Lei nº 9.784/1999, acerca do princípio da autotutela administrativa, assinale a afirmação correta.", "o": ["A Administração pode revogar seus próprios atos eivados de vício de legalidade, produzindo efeitos ex nunc.", "A Administração pode anular seus próprios atos, quando eivados de vícios que os tornam ilegais, porque deles não se originam direitos; ou revogá-los, por motivo de conveniência ou oportunidade, respeitados os direitos adquiridos.", "O direito da Administração de anular os atos administrativos de que decorram efeitos favoráveis para os destinatários decai em dez anos, mesmo diante de comprovada má-fé.", "Tanto a anulação quanto a revogação de atos administrativos discricionários podem ser realizadas pelo Poder Judiciário no exercício do controle de mérito."], "a": 1, "e": "• Explicação detalhada: A alternativa B reproduz com exatidão o teor da **Súmula 473 do STF**, expressão máxima do princípio da autotutela:\n- **Anulação:** recai sobre ato **ilegal**, opera efeitos retroativos (**ex tunc**), pois de atos ilegais não se originam direitos (ressalvada a proteção à boa-fé de terceiros e a decadência).\n- **Revogação:** recai sobre ato **válido/legal**, por razões de **mérito** (conveniência e oportunidade), produzindo efeitos prospectivos (**ex nunc**) e respeitando os direitos adquiridos.\n• Análise dos distratores: A troca 'anular' por 'revogar' e 'ex tunc' por 'ex nunc'; C erra o prazo decadencial do art. 54 da Lei 9.784/99, que é de **5 anos** (e não se aplica se comprovada má-fé); D erra porque o Judiciário **não** pode revogar atos administrativos nem invadir o mérito administrativo (só controla a legalidade).", "k": "Súmula 473 STF: Anulação = ilegalidade + efeitos ex tunc (Administração ou Judiciário). Revogação = conveniência/oportunidade + efeitos ex nunc (só a Administração)."}, {"id": 200, "b": "p1", "p": null, "d": "hard", "s": "[Administração] No âmbito do processo administrativo federal (Lei nº 9.784/1999), a delegação de competência é instrumento do poder hierárquico. Conforme o art. 13 da referida lei, NÃO podem ser objeto de delegação:", "o": ["a edição de atos de caráter normativo, a decisão de recursos administrativos e as matérias de competência exclusiva do órgão ou autoridade.", "a prática de atos materiais de execução, a instrução de processos disciplinares e a expedição de certidões.", "as matérias de competência privativa, a homologação de licitações e a aplicação de advertências.", "apenas os atos que envolvam ordenação de despesas e a celebração de convênios interinstitucionais."], "a": 0, "e": "• Explicação detalhada: O art. 13 da Lei nº 9.784/1999 estabelece taxativamente as três hipóteses indelegáveis, memorizadas pelo mnemônico **CE-NO-RA**:\n1. **CE** — Matérias de **C**ompetência **E**xclusiva do órgão ou autoridade;\n2. **NO** — Edição de atos de caráter **NO**rmativo;\n3. **RA** — Decisão de **R**ecursos **A**dministrativos.\n• Análise dos distratores: B e D trazem atos perfeitamente delegáveis; C confunde competência **exclusiva** (indelegável) com competência **privativa** (em regra, delegável!).", "k": "Tríade indelegável (art. 13, Lei 9.784/99) = CE-NO-RA: Competência Exclusiva, atos NOrmativos, Recursos Administrativos. Atenção: competência PRIVATIVA pode ser delegada!"}, {"id": 201, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Sobre os atributos dos atos administrativos (presunção de legitimidade, imperatividade, autoexecutoriedade e tipicidade), julgue os itens a seguir:\nI. A presunção de legitimidade e veracidade possui natureza absoluta (jure et de jure), impedindo que o administrado produza prova em contrário na via administrativa.\nII. A imperatividade (ou poder extroverso) está presente em todos os atos administrativos, inclusive nos atos negociais (como licenças e autorizações) e nos atos enunciativos (como certidões e atestados).\nIII. A autoexecutoriedade permite que a Administração execute diretamente suas decisões sem necessidade de prévia autorização judicial, mas não está presente em todos os atos administrativos, como ocorre na cobrança judicial de multa não paga.\nEstá correto o que se afirma em", "o": ["I e II, apenas.", "II e III, apenas.", "III, apenas.", "I, II e III."], "a": 2, "e": "• Explicação detalhada:\n- **Item I (Falso):** A presunção de legitimidade e veracidade é **relativa (juris tantum)**, e não absoluta! Ela apenas inverte o ônus da prova, cabendo ao administrado provar a ilegalidade ou inveracidade do ato.\n- **Item II (Falso):** A imperatividade (imposição unilateral de obrigações a terceiros) **não** existe nos atos enunciativos (certidões, atestados, pareceres) nem nos atos negociais solicitados pelo particular (licença, autorização).\n- **Item III (Verdadeiro):** A autoexecutoriedade depende de previsão legal ou situação de urgência; por isso, nem todo ato a possui (ex.: a Administração pode aplicar uma multa autoexecutoriamente, mas, se o particular não pagar, não pode penhorar seus bens diretamente — precisa ajuizar execução fiscal).\n• Análise dos distratores: A, B e D incluem os itens I e/ou II, que contêm erros doutrinários clássicos.", "k": "Atributos (PATI): Presunção é RELATIVA (juris tantum); Autoexecutoriedade nem sempre existe (multa se cobra na Justiça); Imperatividade falta nos atos enunciativos e negociais."}, {"id": 202, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Determinado gestor público estadual exonera um servidor ocupante de cargo em comissão, motivando expressamente o ato na suposta prática de inassiduidade habitual. Posteriormente, comprova-se documentalmente que o servidor jamais faltou ao serviço sem justificativa. À luz da Teoria dos Motivos Determinantes, o ato de exoneração é", "o": ["válido, pois a exoneração de cargo em comissão é ato discricionário ad nutum, dispensando qualquer vinculação aos motivos declarados.", "nulo, pois, embora a exoneração ad nutum dispensasse motivação, uma vez declarados os motivos, o administrador vincula-se à sua veracidade e existência.", "revogável apenas por conveniência da autoridade superior, mantendo-se válido até nova nomeação.", "convalidável mediante simples retificação do motivo falso por outro motivo verdadeiro, com efeitos retroativos."], "a": 1, "e": "• Explicação detalhada: Pela **Teoria dos Motivos Determinantes**, a validade do ato administrativo vincula-se aos motivos indicados como seu fundamento. Ainda que o ato seja discricionário e dispensasse motivação (como a exoneração *ad nutum* de cargo em comissão), se o gestor opta por motivá-lo e o motivo declarado revela-se falso ou inexistente, o ato torna-se **ilegal e nulo**!\n• Análise dos distratores: A ignora que a motivação facultativa vincula o ato; C confunde vício de legalidade (anulação) com revogação; D erra porque motivo falso/inexistente constitui vício insanável de motivo (não admite convalidação).", "k": "Teoria dos Motivos Determinantes: motivou ato discricionário? Ficou preso ao motivo! Se o motivo declarado for falso ou inexistente, o ato é NULO."}, {"id": 203, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Quanto à organização administrativa brasileira, assinale a alternativa que distingue corretamente os fenômenos da desconcentração e da descentralização e as entidades da Administração Indireta.", "o": ["A desconcentração pressupõe a criação de nova pessoa jurídica de direito público ou privado, inexistindo vínculo hierárquico entre o ente criador e o ente criado.", "A descentralização por outorga (ou por serviços) ocorre quando o Estado cria, por meio de lei, uma entidade e lhe transfere a titularidade e a execução de determinado serviço público.", "As empresas públicas e as sociedades de economia mista possuem personalidade jurídica de direito público e são criadas diretamente por lei específica.", "Entre a Administração Direta e as autarquias existe subordinação hierárquica plena, permitindo a avocação irrestrita de competências."], "a": 1, "e": "• Explicação detalhada:\n- **Desconcentração** = distribuição interna de competências **dentro da mesma pessoa jurídica** (criação de **órgãos** públicos, sem personalidade jurídica própria, **com hierarquia**). Mnemônico: des**CO**ncentração = **C**ria **Ó**rgãos.\n- **Descentralização** = transferência de competências para **outra pessoa jurídica** (sem hierarquia; há apenas controle finalístico/tutela). Quando feita por lei, transferindo titularidade e execução, chama-se **descentralização por outorga (ou por serviços)**.\n• Análise dos distratores: A descreve a descentralização, não a desconcentração; C erra porque EP e SEM têm personalidade de **direito privado** e têm sua criação **autorizada** por lei (não criadas diretamente por lei); D erra porque não há hierarquia entre Administração Direta e autarquia, mas sim **tutela / supervisão ministerial**.", "k": "DesCOncentração = Cria Órgãos (mesma PJ, COM hierarquia). DesCEntralização = Cria Entidades (outra PJ, SEM hierarquia, COM tutela/controle finalístico)."}, {"id": 204, "b": "p1", "p": null, "d": "hard", "s": "[Administração] No tocante aos elementos (ou requisitos de validade) do ato administrativo — competência, finalidade, forma, motivo e objeto —, assinale a opção correta.", "o": ["A competência e a finalidade são elementos sempre vinculados, inclusive nos atos administrativos discricionários.", "O mérito administrativo reside na valoração da competência e da forma pelo agente público.", "A convalidação é possível quando o ato apresenta vício insanável de finalidade ou de objeto ilícito.", "O silêncio administrativo equivale sempre à anuência tácita da Administração Pública, independentemente de previsão legal."], "a": 0, "e": "• Explicação detalhada: Nos atos administrativos (mnemônico **CO-FI-FO-M-OB**):\n- **Sempre vinculados:** **Competência** (definida em lei), **Finalidade** (sempre o interesse público/resultado legal) e, em regra, a **Forma**.\n- **Podem ser discricionários:** **Motivo** e **Objeto** — é exatamente nesses dois elementos que reside o **mérito administrativo** (conveniência e oportunidade)!\n• Análise dos distratores: B desloca o mérito para competência e forma; C erra porque vícios de finalidade (desvio de poder), motivo e objeto são **insanáveis** (convalidam-se apenas vícios sanáveis de **FO**rma e **CO**mpetência não exclusiva — **FO-CO**); D erra porque o silêncio administrativo só produz efeitos se a lei expressamente os atribuir.", "k": "CO-FI-FO-M-OB: Competência e Finalidade = sempre vinculados. Motivo e Objeto = onde mora o mérito discricionário. Convalidação = só FO-CO (Forma não essencial e Competência não exclusiva)."}, {"id": 205, "b": "p1", "p": null, "d": "hard", "s": "[Administração] A evolução histórica da Administração Pública no Brasil passou pelos modelos patrimonialista, burocrático e gerencial. Sobre as características e disfunções desses modelos, marque V para verdadeiro e F para falso.\n( ) O modelo burocrático weberiano, introduzido sistematicamente no Brasil com a criação do DASP em 1936, buscou combater o nepotismo e a confusão entre o patrimônio público e o privado típicos do patrimonialismo.\n( ) Segundo Robert Merton, o apego exagerado aos regulamentos, o excesso de formalismo e a resistência a mudanças são disfunções da burocracia que transformam os meios (normas) em fins em si mesmos.\n( ) A reforma gerencial de 1995 (PDRAE) extinguiu os controles administrativos e substituiu integralmente a burocracia pelo modelo patrimonialista de confiança pessoal.\nA sequência correta, de cima para baixo, é", "o": ["V, V, F.", "V, F, V.", "F, V, F.", "V, V, V."], "a": 0, "e": "• Explicação detalhada: (V) O modelo burocrático (Max Weber; DASP em 1936 no governo Vargas) surgiu como antídoto ao patrimonialismo, instituindo impessoalidade, meritocracia, hierarquia e formalismo. (V) Robert Merton analisou as chamadas **disfunções da burocracia** (internalização das normas, formalismo excessivo, rigidez, despersonalização), nas quais o cumprimento do rito torna-se mais importante que o resultado. (F) O Plano Diretor da Reforma do Aparelho do Estado (PDRAE, 1995) **não** restaurou o patrimonialismo; ao contrário, manteve o núcleo estratégico burocrático profissionalizado e introduziu o controle *a posteriori* de resultados, foco no cidadão-cliente e eficiência.\n• Análise dos distratores: B, C e D incorrem em erro sobre Merton ou sobre o PDRAE/1995.", "k": "Patrimonialismo (confusão público/privado) → Burocracia/DASP 1936 (controle de procedimentos; disfunções de Merton) → Gerencial/PDRAE 1995 (controle de resultados e eficiência)."}, {"id": 206, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Na avaliação de políticas e programas públicos no âmbito da Administração Gerencial, distinguem-se os conceitos de eficiência, eficácia e efetividade. Assinale a alternativa que associa corretamente cada dimensão ao seu foco principal.", "o": ["Eficiência: impacto social transformador na realidade da população; Eficácia: racionalidade no uso dos recursos financeiros; Efetividade: cumprimento rigoroso do cronograma.", "Eficiência: relação entre os insumos/recursos utilizados e os produtos entregues (fazer certo com menor custo); Eficácia: grau de alcance das metas e objetivos previstos; Efetividade: impacto real e transformação social gerada na sociedade.", "Eficiência: alcance das metas independentemente dos custos; Eficácia: redução de gastos públicos; Efetividade: obediência formal às normas licitatórias.", "Eficiência, eficácia e efetividade são expressões sinônimas previstas expressamente no caput do art. 37 da Constituição Federal."], "a": 1, "e": "• Explicação detalhada: Os chamados **3 Es da Administração Pública** cobrados pela CEV/UECE:\n- **Eficiência:** foco nos **meios/processos/custos** (fazer mais com menos recursos, otimização).\n- **Eficácia:** foco nos **resultados/metas** (atingir o objetivo planejado, ex.: construir 50 escolas).\n- **Efetividade:** foco no **impacto social** duradouro (ex.: redução real da evasão escolar e melhoria da aprendizagem na comunidade).\n• Análise dos distratores: A inverte os conceitos; C troca eficiência por eficácia; D erra porque apenas a **eficiência** consta expressamente no art. 37, caput, da CF/88 (inserida pela EC 19/1998).", "k": "3 Es: Eficiência = MEIOS (custo/benefício) | Eficácia = METAS (alcance do objetivo) | Efetividade = IMPACTO SOCIAL (transformação real)."}, {"id": 207, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Acerca da responsabilidade civil do Estado prevista no art. 37, § 6º, da Constituição Federal de 1988, assinale a afirmação correta.", "o": ["As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos respondem objetivamente pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.", "A responsabilidade estatal exige que a vítima comprove a culpa ou o dolo do servidor público para obter indenização do Estado.", "A responsabilidade civil do Estado fundamenta-se na teoria do risco integral, não admitindo nenhuma causa excludente de nexo causal, como culpa exclusiva da vítima.", "O agente público responde objetivamente perante o Estado na ação regressiva, independentemente de ter agido com dolo ou culpa."], "a": 0, "e": "• Explicação detalhada: O art. 37, § 6º, da CF/88 consagra um sistema bifásico:\n1. **Estado (PJ de direito público ou PJ de direito privado prestadora de serviço público) → Vítima:** responsabilidade **OBJETIVA** (basta comprovar conduta, dano e nexo causal, dispensando culpa/dolo), baseada na **Teoria do Risco Administrativo** (admite excludentes: culpa exclusiva da vítima, força maior/caso fortuito e fato exclusivo de terceiro).\n2. **Estado → Agente Público (Ação Regressiva):** responsabilidade **SUBJETIVA** (exige comprovação de **dolo ou culpa** do agente).\n• Análise dos distratores: B confunde responsabilidade objetiva com subjetiva; C troca risco administrativo por risco integral; D transforma a responsabilidade regressiva do agente em objetiva.", "k": "Art. 37, § 6º CF/88: Estado responde OBJETIVAMENTE (Risco Administrativo — admite excludentes). Agente responde SUBJETIVAMENTE em regresso (dolo ou culpa)."}, {"id": 208, "b": "p1", "p": null, "d": "hard", "s": "[Administração] De acordo com o art. 37, inciso XVI, da Constituição Federal de 1988, a acumulação remunerada de cargos públicos é vedada, exceto quando houver compatibilidade de horários e observado o teto remuneratório constitucional, nos seguintes casos:", "o": ["a de dois cargos de professor; a de um cargo de professor com outro técnico ou científico; e a de dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas.", "a de três cargos de professor em redes distintas; e a de um cargo de professor com qualquer cargo administrativo de nível médio.", "a de dois cargos técnicos de nível médio; e a de um cargo de professor com um cargo de juiz ou promotor.", "a de dois cargos em comissão de livre nomeação e exoneração, desde que em esferas federativas diferentes."], "a": 0, "e": "• Explicação detalhada: Conforme o art. 37, XVI, da CF/88, havendo compatibilidade de horários e respeitado o teto constitucional (inciso XI), são acumuláveis:\n- **a)** dois cargos de professor;\n- **b)** um cargo de professor com outro **técnico ou científico** (atenção: cargo técnico/científico exige formação específica/habilitação legal, não abrangendo cargos meramente burocráticos/administrativos de nível médio sem especialização);\n- **c)** dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas.\n• Análise dos distratores: B erra ao permitir três cargos de professor e qualquer cargo administrativo de nível médio; C e D trazem hipóteses constitucionalmente vedadas.", "k": "Acumulação (art. 37, XVI CF): 2 Professor | 1 Professor + 1 Técnico/Científico | 2 Saúde. Sempre com compatibilidade de horários!"}, {"id": 209, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Sobre o poder de polícia administrativo e o poder disciplinar, assinale a alternativa correta.", "o": ["O poder de polícia incide exclusivamente sobre servidores públicos que infringem deveres funcionais previstos em estatuto.", "O poder disciplinar fundamenta-se na supremacia geral do Estado sobre todos os cidadãos, enquanto o poder de polícia decorre de vínculo jurídico específico.", "O poder de polícia consiste na atividade da Administração Pública que, limitando ou disciplinando direito, interesse ou liberdade, regula a prática de ato ou abstenção de fato, em razão de interesse público.", "A multa aplicada no exercício do poder disciplinar contra servidor público é idêntica à multa de trânsito aplicada no exercício do poder de polícia."], "a": 2, "e": "• Explicação detalhada: A alternativa C reproduz o conceito legal clássico de poder de polícia previsto no **art. 78 do Código Tributário Nacional (CTN)**: restringir/condicionar o exercício de direitos individuais (liberdade e propriedade) em benefício da coletividade, com base na **supremacia geral** do Estado.\n• Análise dos distratores: A e B invertem completamente os conceitos de poder disciplinar (vínculo específico: servidores e particulares contratados/delegatários) e poder de polícia (supremacia geral: particulares em geral); D confunde sanção disciplinar funcional com sanção de polícia.", "k": "Poder de Polícia = supremacia GERAL (atinge particulares em geral; art. 78 CTN). Poder Disciplinar = vínculo ESPECÍFICO (pune servidores e contratados)."}, {"id": 210, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Acerca das entidades da Administração Indireta, compare as autarquias, fundações públicas, empresas públicas e sociedades de economia mista e marque V para verdadeiro e F para falso.\n( ) As autarquias são pessoas jurídicas de direito público, criadas diretamente por lei específica, que desempenham atividades típicas de Estado e gozam de imunidade tributária recíproca sobre seu patrimônio, renda e serviços vinculados às suas finalidades essenciais.\n( ) As empresas públicas e as sociedades de economia mista têm personalidade jurídica de direito privado e são criadas diretamente pela publicação da lei específica, dispensando o registro de seus atos constitutivos.\n( ) Enquanto a empresa pública admite qualquer forma societária e possui capital integralmente público, a sociedade de economia mista deve revestir-se obrigatoriamente da forma de sociedade anônima (S.A.) e conjugar capital público e privado, com controle acionário do Estado.\nA sequência correta, de cima para baixo, é", "o": ["V, F, V.", "V, V, F.", "F, F, V.", "V, F, F."], "a": 0, "e": "• Explicação detalhada: (V) Autarquias têm regime de direito público, nascem com a vigência da lei específica que as cria (art. 37, XIX, CF/88) e gozam de imunidade tributária recíproca (art. 150, § 2º, CF/88). (F) Empresas públicas e sociedades de economia mista têm sua criação **autorizada** por lei específica, mas só adquirem personalidade jurídica com o **registro de seus atos constitutivos** no cartório/Junta Comercial! (V) Distinção clássica: EP = capital 100% público + qualquer forma societária; SEM = capital misto (controle público) + obrigatoriamente S.A.\n• Análise dos distratores: B, C e D erram a forma de constituição das estatais ou as regras das autarquias.", "k": "Autarquia = CRIADA por lei (nasce com a lei). EP e SEM = AUTORIZADAS por lei (nascem com o registro). SEM = só S.A. | EP = qualquer forma + capital 100% público."}, {"id": 211, "b": "p1", "p": null, "d": "hard", "s": "[Administração] O princípio da impessoalidade, previsto no caput do art. 37 da Constituição Federal, desdobra-se em diversas vertentes na doutrina administrativista. NÃO constitui manifestação do princípio da impessoalidade:", "o": ["a vedação de que constem nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores públicos na publicidade dos atos e obras públicas.", "a teoria da imputação volitiva (teoria do órgão), segundo a qual os atos praticados pelo agente público são imputados diretamente ao órgão ou entidade estatal.", "a exigência de concurso público de provas ou de provas e títulos para investidura em cargo ou emprego público efetivo, assegurando isonomia.", "a prerrogativa de a Administração Pública rever seus próprios atos ilegais ou inconvenientes sem necessidade de provocação judicial."], "a": 3, "e": "• Explicação detalhada: A prerrogativa de a Administração rever seus próprios atos ilegais (anulação) ou inconvenientes (revogação) decorre do **princípio da autotutela**, e não da impessoalidade!\n• Análise dos distratores: A (vedação à promoção pessoal — art. 37, § 1º CF/88), B (teoria da imputação volitiva de Otto Gierke: quem age é o Estado, não a pessoa física do agente) e C (isonomia/finalidade pública no concurso) são as três grandes acepções doutrinárias clássicas do princípio da impessoalidade.", "k": "Impessoalidade = Finalidade pública + Isonomia + Vedação à promoção pessoal (art. 37, § 1º) + Teoria da imputação volitiva. Rever atos = Autotutela!"}, {"id": 212, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Nos termos do art. 41 da Constituição Federal de 1988, são estáveis após três anos de efetivo exercício os servidores nomeados para cargo de provimento efetivo em virtude de concurso público, sendo condição obrigatória para a aquisição da estabilidade", "o": ["a aprovação em curso de formação ministrado por escola de governo, dispensada qualquer avaliação de desempenho.", "a avaliação especial de desempenho por comissão instituída para essa finalidade.", "a publicação de decreto discricionário do chefe do Poder Executivo homologando o estágio probatório.", "a inexistência de qualquer licença médica durante o triênio inicial."], "a": 1, "e": "• Explicação detalhada: O art. 41, § 4º, da CF/88 determina expressamente: *'Como condição para a aquisição da estabilidade, é obrigatória a avaliação especial de desempenho por comissão instituída para essa finalidade.'* Além disso, após adquirir estabilidade, o servidor só perde o cargo por: (I) sentença judicial transitada em julgado; (II) processo administrativo disciplinar (PAD) com ampla defesa; (III) avaliação periódica de desempenho na forma de lei complementar; ou (IV) excesso de despesa com pessoal (art. 169, § 4º).\n• Análise dos distratores: A, C e D criam requisitos inexistentes no texto constitucional.", "k": "Estabilidade (art. 41 CF): 3 anos de efetivo exercício + concurso público (cargo efetivo) + avaliação ESPECIAL de desempenho por comissão."}, {"id": 213, "b": "p1", "p": null, "d": "hard", "s": "[Administração] De acordo com a Lei nº 9.784/1999 (Processo Administrativo Federal), distingue-se o impedimento da suspeição da autoridade ou servidor atuante no processo. Constitui hipótese legal de SUSPEIÇÃO (e não de impedimento):", "o": ["ter o servidor interesse direto ou indireto na matéria.", "ter o servidor participado ou vir a participar como perito, testemunha ou representante.", "estar o servidor litigando judicial ou administrativamente com o interessado ou respectivo cônjuge ou companheiro.", "ter o servidor amizade íntima ou inimizade notória com algum dos interessados ou com os respectivos cônjuges, companheiros, parentes e afins até o terceiro grau."], "a": 3, "e": "• Explicação detalhada: A Lei nº 9.784/1999 separa rigorosamente:\n- **Impedimento (art. 18 — critério objetivo, dever de comunicar sob pena de falta grave):** ter interesse direto/indireto; ter participado como perito/testemunha/representante (ou cônjuge/parente até 3º grau); estar litigando judicial/administrativamente com o interessado.\n- **Suspeição (art. 20 — critério subjetivo/afetivo):** amizade íntima ou inimizade notória com algum dos interessados ou seus cônjuges, companheiros, parentes e afins até o terceiro grau.\n• Análise dos distratores: A, B e C são hipóteses objetivas de **impedimento** previstas nos incisos I, II e III do art. 18.", "k": "Lei 9.784/99: Impedimento (art. 18) = critérios OBJETIVOS (interesse, perito/testemunha, litígio). Suspeição (art. 20) = critério SUBJETIVO (amizade íntima ou inimizade notória)."}, {"id": 214, "b": "p1", "p": null, "d": "hard", "s": "[Administração] No estudo da Governança Pública (Decreto nº 9.203/2017) e da accountability na Administração Pública contemporânea, entende-se por accountability horizontal", "o": ["o controle exercido pelos cidadãos sobre os governantes por meio do voto periódico nas eleições.", "os mecanismos de freios e contrapesos (checks and balances) e fiscalização mútua entre poderes e órgãos estatais autônomos, como Tribunais de Contas, Ministério Público e Controladorias.", "a participação exclusiva de organizações não governamentais na elaboração do orçamento participativo.", "a subordinação hierárquica entre o Ministro de Estado e os chefes de divisão de sua pasta."], "a": 1, "e": "• Explicação detalhada: Na ciência política e administração pública (Guillermo O'Donnell), a *accountability* divide-se em três eixos:\n- **Vertical:** exercida pela sociedade sobre os representantes (eleições, plebiscitos).\n- **Horizontal:** fiscalização mútua entre agências e poderes estatais dotados de autonomia legal (Tribunais de Contas, MP, Judiciário, Legislativo, Controladorias — freios e contrapesos).\n- **Societal:** exercida continuamente por associações civis, conselhos gestores, mídia e movimentos sociais fora do momento eleitoral.\n• Análise dos distratores: A descreve *accountability* vertical; C descreve parcialmente *accountability* societal; D descreve controle hierárquico interno.", "k": "Accountability: Vertical = voto/eleições | Horizontal = entre órgãos/poderes do Estado (TCU, MP, Legislativo) | Societal = mídia, conselhos e sociedade civil."}, {"id": 215, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Sobre a extinção dos atos administrativos, relacione corretamente a forma de extinção ao seu fato gerador:\n1. Cassação\n2. Caducidade\n3. Contraposição (ou derrubada)\n4. Anulação\n( ) Ocorre quando sobrevém norma jurídica superior que torna inadmissível a situação antes permitida pelo ato administrativo.\n( ) Ocorre quando o destinatário do ato descumpre as condições que deveria manter para continuar usufruindo da situação jurídica.\n( ) Ocorre quando um novo ato administrativo, emitido com base em competência diversa, produz efeitos opostos ao ato anterior, extinguindo-o (ex.: exoneração em relação à nomeação).\n( ) Ocorre em razão de vício de ilegalidade originário ou superveniente.\nA sequência correta, de cima para baixo, é", "o": ["2, 1, 3, 4.", "1, 2, 4, 3.", "2, 3, 1, 4.", "3, 1, 2, 4."], "a": 0, "e": "• Explicação detalhada: Formas específicas de extinção dos atos administrativos (muito cobradas pela CEV/UECE):\n- **2. Caducidade:** lei/norma superveniente torna o ato incompatível com o novo ordenamento (ex.: revogação da lei que permitia certo uso de bem público).\n- **1. Cassação:** o particular beneficiário descumpre requisito legal de manutenção do ato (ex.: cassação de licença de funcionamento por desvio de finalidade do estabelecimento).\n- **3. Contraposição:** edição de ato posterior com efeitos contrários (exoneração derruba a nomeação).\n- **4. Anulação:** vício de ilegalidade.\n• Análise dos distratores: B, C e D trocam os conceitos de caducidade, cassação e contraposição.", "k": "Cassação = culpa do beneficiário (descumpriu condição). Caducidade = lei nova incompatível. Contraposição = ato novo oposto (exoneração vs. nomeação)."}, {"id": 216, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Acerca do regime constitucional dos bens públicos e das entidades da Administração Indireta, assinale a afirmação correta.", "o": ["Os bens públicos de uso comum do povo e os de uso especial são inalienáveis enquanto conservarem sua qualificação, na forma que a lei determinar, e não estão sujeitos a usucapião.", "Os bens dominicais são absolutamente inalienáveis, mesmo após desafetação e autorização legislativa.", "Todos os bens públicos podem ser adquiridos por usucapião extraordinário após quinze anos de posse mansa e pacífica.", "Os bens das autarquias são bens privados, submetendo-se integralmente à penhora comum."], "a": 0, "e": "• Explicação detalhada: Conforme os arts. 98 a 103 do Código Civil e o art. 183, § 3º, da CF/88:\n- Os bens públicos classificam-se em **uso comum do povo** (praças, ruas), **uso especial** (escolas públicas, hospitais, repartições) e **dominicais** (patrimônio disponível, sem destinação pública específica).\n- Os de uso comum e uso especial são **afetados** e, portanto, inalienáveis enquanto mantiverem tal qualificação; os dominicais são desafetados e podem ser alienados observadas as exigências legais. **Nenhum bem público está sujeito a usucapião!**\n• Análise dos distratores: B erra porque os dominicais são justamente os alienáveis; C erra porque bens públicos são imprescritíveis (sem usucapião); D erra porque autarquias são PJ de direito público e seus bens são públicos (impenhoráveis, sujeitos ao regime de precatórios).", "k": "Bens públicos: Uso comum e Uso especial = afetados (inalienáveis). Dominicais = desafetados (alienáveis na forma da lei). TODOS são imprescritíveis (zero usucapião) e impenhoráveis!"}, {"id": 217, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Em relação ao princípio da publicidade na Administração Pública (art. 37, caput, e art. 5º, XXXIII e LX, da CF/88), assinale a alternativa correta.", "o": ["A publicidade é requisito de existência e validade do ato administrativo, de modo que todo ato não publicado no Diário Oficial é juridicamente inexistente.", "A publicidade oficial constitui condição de eficácia dos atos administrativos que devam produzir efeitos externos, admitindo exceções constitucionais quando imprescindível à segurança da sociedade e do Estado ou à proteção da intimidade.", "O princípio da publicidade é absoluto e não admite restrição de acesso a informações sigilosas.", "A divulgação de obras públicas com o nome e a fotografia do gestor responsável reforça o princípio da publicidade."], "a": 1, "e": "• Explicação detalhada: Na teoria do ato administrativo, a publicação não é elemento de formação/validade, mas **condição de eficácia** (produção de efeitos externos e início da contagem de prazos). Além disso, o princípio da publicidade não é absoluto: a própria CF/88 (art. 5º, XXXIII e LX) ressalva as hipóteses de sigilo imprescindível à segurança da sociedade e do Estado e de defesa da intimidade.\n• Análise dos distratores: A confunde eficácia com existência/validade; C trata a publicidade como absoluta; D viola frontalmente o art. 37, § 1º (promoção pessoal).", "k": "Publicidade = condição de EFICÁCIA (não de validade!) e NÃO é absoluta (exceções: segurança do Estado/sociedade e intimidade)."}, {"id": 218, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Sobre o controle da Administração Pública, assinale a opção que diferencia corretamente o controle administrativo, o legislativo e o judicial.", "o": ["O controle administrativo abrange tanto aspectos de legalidade quanto de mérito (conveniência e oportunidade), podendo ser exercido de ofício ou mediante provocação.", "O Poder Judiciário, no exercício da função jurisdicional típica, pode revogar atos administrativos discricionários quando considerá-los inoportunos.", "O controle externo exercido pelo Poder Legislativo dispensa o auxílio técnico dos Tribunais de Contas.", "O recurso administrativo hierárquico próprio depende sempre de caução prévia em dinheiro para ser conhecido."], "a": 0, "e": "• Explicação detalhada: O **controle administrativo** (interno, decorrente da autotutela e da hierarquia) é amplo: fiscaliza tanto a **legalidade** (anulando atos ilegais) quanto o **mérito** (revogando atos inconvenientes/inoportunos), de ofício ou mediante provocação (petição/recurso).\n• Análise dos distratores: B erra porque o Judiciário controla apenas a **legalidade** dos atos administrativos de outros poderes, jamais o mérito (não revoga); C viola o art. 71 da CF/88 (controle externo do Legislativo com auxílio do Tribunal de Contas); D viola a **Súmula Vinculante 21 do STF** ('É inconstitucional a exigência de depósito ou arrolamento prévios de dinheiro ou bens para admissibilidade de recurso administrativo').", "k": "Controle Administrativo = Legalidade + Mérito. Controle Judicial = só Legalidade. Recurso administrativo = sem depósito prévio (Súmula Vinculante 21 STF)."}, {"id": 219, "b": "p1", "p": null, "d": "hard", "s": "[Administração] A respeito da Súmula Vinculante nº 13 do Supremo Tribunal Federal, que veda o nepotismo na Administração Pública, assinale a alternativa correta.", "o": ["A proibição do nepotismo exige a edição prévia de lei formal específica em cada ente federativo para ter eficácia.", "A vedação abrange cônjuge, companheiro ou parente em linha reta, colateral ou por afinidade, até o terceiro grau, inclusive, da autoridade nomeante ou de servidor da mesma pessoa jurídica investido em cargo de direção, chefia ou assessoramento, para o exercício de cargo em comissão ou de confiança.", "A vedação do nepotismo aplica-se igualmente aos cargos efetivos providos mediante concurso público de provas e títulos.", "O nepotismo cruzado (ajuste mediante designações recíprocas entre autoridades distintas) não é alcançado pela Súmula Vinculante 13."], "a": 1, "e": "• Explicação detalhada: A **Súmula Vinculante 13 do STF** extrai a vedação ao nepotismo diretamente dos princípios constitucionais da moralidade e impessoalidade (art. 37, caput, CF/88), dispensando lei específica. Alcança parentes até o **3º grau** (inclusive) para cargos em comissão/funções de confiança, bem como o **nepotismo cruzado** (designações recíprocas). Ressalva-se, segundo a jurisprudência do STF, os cargos de natureza **política** (Ministros, Secretários Estaduais/Municipais), salvo fraude ou manifesta falta de qualificação técnica.\n• Análise dos distratores: A é falsa (dispensa lei formal); C é falsa (cargos efetivos providos por concurso público não configuram nepotismo); D é falsa (o nepotismo cruzado é expressamente vedado pela SV 13).", "k": "Súmula Vinculante 13 (Nepotismo): parentes até 3º grau em cargo em comissão/confiança + nepotismo cruzado. Dispensa lei prévia! Exceção jurisprudencial: cargos políticos (sem fraude)."}, {"id": 220, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Segundo a Lei nº 9.784/1999, salvo disposição legal específica, qual é o prazo para interposição de recurso administrativo e qual o limite máximo de instâncias administrativas pelas quais o processo pode tramitar?", "o": ["5 dias, contados da publicação; máximo de 2 instâncias.", "10 dias, contados a partir da ciência ou divulgação oficial da decisão recorrida; máximo de 3 instâncias administrativas.", "15 dias úteis; máximo de 4 instâncias.", "30 dias corridos; sem limite de instâncias."], "a": 1, "e": "• Explicação detalhada: Conforme os arts. 57 e 59 da Lei nº 9.784/1999:\n- **Prazo para recorrer (art. 59):** **10 dias**, contados a partir da ciência ou divulgação oficial da decisão recorrida (e, quando a lei não fixar prazo diferente, o recurso deve ser decidido no prazo máximo de **30 dias**, prorrogável por igual período ante justificativa explícita).\n- **Limite de tramitação (art. 57):** o recurso administrativo tramitará no máximo por **3 instâncias administrativas**, salvo disposição legal diversa.\n• Análise dos distratores: A, C e D trocam os prazos e o limite de 3 instâncias previstos na lei.", "k": "Lei 9.784/99 (Prazos de Ouro): Recurso = 10 dias | Decisão do recurso = 30 dias (+30) | Máximo de instâncias = 3 | Decadência para anular ato favorável = 5 anos."}, {"id": 221, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Acerca do ciclo do poder de polícia (ordem de polícia, consentimento de polícia, fiscalização de polícia e sanção de polícia) e do entendimento do Supremo Tribunal Federal sobre sua delegação, assinale a afirmação correta.", "o": ["Nenhuma fase do ciclo de polícia pode ser delegada a pessoas jurídicas de direito privado integrantes da Administração Indireta.", "É constitucional a delegação do poder de polícia, por meio de lei, a pessoas jurídicas de direito privado integrantes da Administração Pública Indireta de capital social majoritariamente público que prestem exclusivamente serviço público de atuação própria do Estado e em regime não concorrencial, vedada apenas a delegação da fase de ordem de polícia (legislação).", "Todas as quatro fases do ciclo de polícia podem ser delegadas livremente a empresas privadas concessionárias com fins lucrativos.", "Apenas o consentimento e a fiscalização são delegáveis a estatais não concorrenciais, sendo inconstitucional a delegação da sanção de polícia."], "a": 1, "e": "• Explicação detalhada: No julgamento do **RE 633.782 (Tema 532 de Repercussão Geral)**, o STF fixou tese importantíssima: é constitucional a delegação do poder de polícia (inclusive **consentimento, fiscalização e sanção**!), por meio de lei, a pessoas jurídicas de direito privado integrantes da Administração Indireta de capital social majoritariamente público que prestem exclusivamente serviço público próprio do Estado em regime **não concorrencial**. Fica excluída apenas a fase de **ordem de polícia** (edição de normas/legislação).\n• Análise dos distratores: A e D reproduzem o entendimento superado de que a sanção não podia ser delegada a estatais; C erra ao estender a delegação a empresas privadas comuns fora da Administração Indireta.", "k": "Ciclo de Polícia (O-C-F-S): Ordem (indelegável) | Consentimento, Fiscalização e Sanção = delegáveis por lei a estatal não concorrencial de capital majoritariamente público (STF)."}, {"id": 222, "b": "p1", "p": null, "d": "hard", "s": "[Administração] No âmbito do planejamento e orçamento público brasileiro, a Constituição Federal de 1988 estabelece três instrumentos integrados: o Plano Plurianual (PPA), a Lei de Diretrizes Orçamentárias (LDO) e a Lei Orçamentária Anual (LOA). Assinale a alternativa correta sobre suas funções.", "o": ["O PPA estabelece, de forma regionalizada, as diretrizes, objetivos e metas da Administração Pública Federal para as despesas de capital e outras delas decorrentes e para as relativas aos programas de duração continuada.", "A LOA tem vigência de quatro anos e define as metas e prioridades da Administração para o exercício financeiro subsequente.", "A LDO compreende os orçamentos fiscal, da seguridade social e de investimento das estatais.", "A iniciativa das leis do PPA, da LDO e da LOA pertence concorrentemente ao Poder Executivo e a qualquer parlamentar."], "a": 0, "e": "• Explicação detalhada: O art. 165 da CF/88 estrutura o ciclo orçamentário:\n- **PPA (art. 165, § 1º — 4 anos, do 2º ano de um mandato ao 1º do seguinte):** diretrizes, objetivos e metas regionalizadas para despesas de capital e programas de duração continuada (**DOM**).\n- **LDO (art. 165, § 2º — anual):** metas e prioridades da Administração, orienta a elaboração da LOA e dispõe sobre alterações na legislação tributária.\n- **LOA (art. 165, § 5º — anual):** estima receitas e fixa despesas (orçamentos fiscal, da seguridade social e de investimento).\n• Análise dos distratores: B e C invertem LDO e LOA; D erra porque a iniciativa das leis orçamentárias é **privativa do Chefe do Poder Executivo** (art. 165, caput).", "k": "PPA = DOM (Diretrizes, Objetivos, Metas — 4 anos) | LDO = Metas e Prioridades + orienta a LOA | LOA = Receitas e Despesas (3 orçamentos). Iniciativa privativa do Executivo!"}, {"id": 223, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Considere os conceitos de poder vinculado e poder discricionário na Administração Pública e julgue as afirmativas:\nI. No ato vinculado, a lei estabelece todos os requisitos e condições de sua realização, não restando ao administrador margem de liberdade subjetiva.\nII. A discricionariedade administrativa confere ao gestor liberdade absoluta para agir fora dos limites da lei sempre que julgar conveniente.\nIII. Os princípios da razoabilidade e da proporcionalidade funcionam como parâmetros jurídicos para o controle judicial dos excessos da discricionariedade administrativa, sem que isso configure invasão do mérito.\nEstá correto o que se afirma em", "o": ["I e II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "a": 1, "e": "• Explicação detalhada:\n- **Item I (Verdadeiro):** No poder vinculado, preenchidos os requisitos legais (ex.: aposentadoria compulsória ou licença para construir atendidas as normas edilícias), o administrador **deve** praticar o ato exatamente como prescrito.\n- **Item II (Falso):** Discricionariedade **não** é arbitrariedade! É liberdade de escolha **dentro dos limites da lei** (conveniência e oportunidade nos parâmetros legais).\n- **Item III (Verdadeiro):** A razoabilidade e a proporcionalidade integram o bloco de legalidade/juridicidade; logo, quando o Judiciário anula um ato desproporcional, está exercendo controle de legalidade, e não substituindo o mérito administrativo.\n• Análise dos distratores: A, C e D consideram correto o item II, que confunde discricionariedade com arbitrariedade.", "k": "Discricionariedade ≠ Arbitrariedade! Discricionariedade é liberdade DENTRO da lei; razoabilidade e proporcionalidade permitem ao Judiciário controlar abusos sem invadir o mérito."}, {"id": 224, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Na gestão de pessoas no setor público, a avaliação de desempenho por competências busca alinhar o trabalho dos servidores aos objetivos institucionais. De acordo com a literatura clássica da área (CHA), os três pilares da competência profissional são", "o": ["Centralização, Hierarquia e Autoridade.", "Conhecimentos (saber), Habilidades (saber fazer) e Atitudes (querer fazer / saber ser).", "Controle, Homologação e Auditoria.", "Custos, Horários e Atribuições."], "a": 1, "e": "• Explicação detalhada: Na gestão por competências (Durand / Zarifian / Fleury), a competência individual articula o acrônimo **CHA**:\n- **C**onhecimentos: dimensão cognitiva/teórica (saber);\n- **H**abilidades: dimensão psicomotora/técnica aplicada (saber fazer);\n- **A**titudes: dimensão afetiva/comportamental e ética (querer fazer / saber ser).\n• Análise dos distratores: A, C e D são distratores inventados que não correspondem ao modelo CHA da gestão por competências.", "k": "Gestão por Competências = CHA: Conhecimento (saber) + Habilidade (saber fazer) + Atitude (querer fazer / postura)."}, {"id": 225, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Acerca das agências reguladoras e agências executivas no direito administrativo brasileiro, assinale a afirmação correta.", "o": ["As agências reguladoras são autarquias sob regime especial, dotadas de maior autonomia administrativa, financeira e técnica, além de mandato fixo e estabilidade de seus dirigentes durante o mandato.", "As agências executivas constituem uma nova espécie de pessoa jurídica privada fora da Administração Indireta.", "Os dirigentes das agências reguladoras são exoneráveis ad nutum a qualquer momento pelo Chefe do Poder Executivo.", "As agências reguladoras não possuem poder normativo técnico para regular os setores sob sua fiscalização."], "a": 0, "e": "• Explicação detalhada: As **agências reguladoras** (ex.: ANATEL, ANEEL, ANVISA) têm natureza jurídica de **autarquias sob regime especial** (pessoa jurídica de direito público da Administração Indireta), caracterizadas por autonomia reforçada, poder normativo técnico (nos limites da lei) e **mandato fixo** de seus dirigentes (que não podem ser exonerados *ad nutum*, perdendo o cargo apenas por renúncia, condenação judicial transitada em julgado ou processo administrativo disciplinar). Já a **agência executiva** é uma qualificação conferida a autarquia ou fundação pública que celebre contrato de gestão.\n• Análise dos distratores: B confunde qualificação de autarquia/fundação com PJ privada; C nega a estabilidade do mandato fixo dos dirigentes; D nega o poder normativo técnico das reguladoras.", "k": "Agência Reguladora = Autarquia sob regime especial + mandato fixo dos dirigentes (sem exoneração ad nutum). Agência Executiva = qualificação via contrato de gestão."}, {"id": 226, "b": "p1", "p": null, "d": "hard", "s": "[Administração] No que tange aos princípios expressos e implícitos da Administração Pública, associe corretamente cada princípio à sua definição:\n1. Continuidade do serviço público\n2. Segurança jurídica\n3. Motivação\n4. Moralidade administrativa\n( ) Veda a aplicação retroativa de nova interpretação da norma administrativa no âmbito dos processos administrativos.\n( ) Impõe que os serviços públicos essenciais não sejam interrompidos, fundamentando institutos como a suplência, a delegação e a encampação.\n( ) Exige que o agente público atue segundo padrões éticos de probidade, decoro e boa-fé objetiva, não bastando o cumprimento meramente formal da letra da lei.\n( ) Determina que a Administração indique os pressupostos de fato e de direito que fundamentam suas decisões, especialmente quando neguem, limitem ou afetem direitos ou interesses.\nA sequência correta, de cima para baixo, é", "o": ["2, 1, 4, 3.", "1, 2, 3, 4.", "2, 4, 1, 3.", "4, 1, 2, 3."], "a": 0, "e": "• Explicação detalhada:\n- **2. Segurança jurídica (art. 2º, parágrafo único, XIII, Lei 9.784/99):** protege a estabilidade das relações e proíbe aplicação retroativa de nova interpretação.\n- **1. Continuidade do serviço público:** impede a paralisação de atividades essenciais à coletividade.\n- **4. Moralidade administrativa:** exige probidade, lealdade institucional e boa-fé além da legalidade estrita.\n- **3. Motivação (art. 50, Lei 9.784/99):** exige exposição dos fundamentos de fato e de direito das decisões.\n• Análise dos distratores: B, C e D embaralham as definições legais e doutrinárias.", "k": "Lei 9.784/99: Segurança jurídica = veda retroatividade de nova interpretação (art. 2º, XIII). Motivação = pressupostos de fato e de direito (art. 50)."}, {"id": 227, "b": "p1", "p": null, "d": "hard", "s": "[Administração] Sobre os poderes normativo e regulamentar da Administração Pública, assinale a opção correta.", "o": ["O decreto regulamentar (ou de execução) expedido pelo Chefe do Poder Executivo pode inovar primariamente na ordem jurídica, criando direitos e obrigações não previstos em lei.", "O decreto autônomo é admitido pela Constituição Federal de 1988, em hipóteses taxativas (art. 84, VI), para dispor sobre organização e funcionamento da administração federal, quando não implicar aumento de despesa nem criação ou extinção de órgãos públicos, bem como extinção de funções ou cargos públicos, quando vagos.", "O poder regulamentar é delegável livremente pelo Presidente da República a qualquer servidor público efetivo.", "Se um decreto regulamentar extrapolar os limites da lei que regulamenta, o Congresso Nacional não possui competência para sustá-lo."], "a": 1, "e": "• Explicação detalhada: Em regra, os decretos são **regulamentares / de execução** (art. 84, IV, CF/88) e não podem criar direitos ou obrigações novas (princípio da legalidade). Contudo, o **art. 84, VI, da CF/88** (redação dada pela EC 32/2001) autoriza o **decreto autônomo** em duas hipóteses taxativas: (a) organização e funcionamento da administração federal, sem aumento de despesa nem criação/extinção de órgãos; e (b) extinção de funções ou cargos públicos, **quando vagos**.\n• Análise dos distratores: A atribui ao decreto regulamentar poder de inovação primária; C erra porque o art. 84, VI é delegável apenas a Ministros de Estado, PGR ou AGU (art. 84, parágrafo único); D contraria o art. 49, V, da CF/88 (o Congresso Nacional pode sustar atos normativos do Executivo que exorbitem do poder regulamentar).", "k": "Decreto Autônomo (art. 84, VI CF/88): 1) Organização/funcionamento (sem gasto e sem criar/extinguir órgão); 2) Extinguir cargo/função VAGO! Se exorbitar, Congresso susta (art. 49, V)."}, {"id": 228, "b": "p1", "p": null, "d": "hard", "s": "[Administração] No ciclo PDCA aplicado à gestão da qualidade e melhoria contínua na Administração Pública, as quatro etapas sequenciais correspondem a", "o": ["Plan (Planejar), Do (Executar), Check (Verificar/Controlar) e Act (Agir corretivamente / Padronizar).", "Predict (Prever), Delegate (Delegar), Centralize (Centralizar) e Audit (Auditar).", "Prepare (Preparar), Decide (Decidir), Communicate (Comunicar) e Archive (Arquivar).", "Program (Programar), Direct (Dirigir), Coordinate (Coordenar) e Assess (Avaliar)."], "a": 0, "e": "• Explicação detalhada: O ciclo **PDCA** (Shewhart / Deming) é ferramenta clássica da administração gerencial e gestão da qualidade:\n- **P (Plan):** definir metas e métodos;\n- **D (Do):** capacitar e executar o planejado;\n- **C (Check):** monitorar e comparar resultados com as metas;\n- **A (Act):** corrigir desvios (se não atingiu a meta) ou padronizar/aperfeiçoar (se atingiu).\n• Análise dos distratores: B, C e D inventam siglas falsas para o ciclo PDCA.", "k": "Ciclo PDCA: Plan (planejar) → Do (executar) → Check (verificar) → Act (agir corretivamente/padronizar)."}, {"id": 229, "b": "tempos", "p": null, "d": "hard", "s": "Choose the option that correctly completes the mixed conditional sentence:\n'If the State Secretariat ______ more teachers two years ago, schools ______ facing such severe staffing shortages now.'", "o": ["hired / wouldn't have been", "had hired / wouldn't be", "would have hired / weren't", "has hired / won't be"], "a": 1, "e": "• Explicação detalhada: Trata-se de uma **Mixed Conditional (3ª + 2ª condicional)**:\n- A condição refere-se a um **passado irreal** ('two years ago' → *If + Past Perfect* = **had hired**);\n- O resultado refere-se a uma **consequência irreal no presente** ('now' → *would + infinitivo* = **wouldn't be** facing).\n• Análise dos distratores: A inverte os tempos (passado simples na condição e 3ª condicional no resultado); C coloca 'would have' dentro da *if-clause* (erro grave); D mistura Present Perfect com futuro real.", "k": "Mixed Conditional (Passado → Presente): If + Past Perfect (had + particípio), would + verbo base (+ now)."}, {"id": 230, "b": "tempos", "p": null, "d": "hard", "s": "Select the grammatically accurate completion for the sentence:\n'It is high time the educational authorities ______ the assessment criteria to reflect communicative competence.'", "o": ["revise", "have revised", "revised", "will revise"], "a": 2, "e": "• Explicação detalhada: As expressões idiomáticas **It's time / It's high time / It's about time + sujeito** exigem o verbo no **Past Subjunctive (forma de Simple Past)** para indicar que algo já deveria ter sido feito no presente ('Já passou da hora de as autoridades revisarem...').\n• Análise dos distratores: A, B e D usam presente, Present Perfect e futuro, todos agramaticais após 'It is high time + sujeito'.", "k": "It's (high/about) time + sujeito + PAST SUBJUNCTIVE (forma de passado: revised, went, started) — sentido de urgência no presente!"}, {"id": 231, "b": "tempos", "p": null, "d": "hard", "s": "Compare the sentences:\nI. 'I'd rather you didn't disclose the preliminary results before the official release.'\nII. 'I'd rather not disclose the preliminary results before the official release.'\nRegarding standard English grammar, it is correct to say that", "o": ["only sentence I is grammatical, because 'would rather' always requires a past verb.", "only sentence II is grammatical, because 'would rather' cannot take a different subject.", "both sentences are grammatical: I uses the past subjunctive because the subject changes ('I' → 'you'), whereas II uses the bare infinitive because the subject remains the same.", "both sentences refer to regret about a completed action in the past."], "a": 2, "e": "• Explicação detalhada: A estrutura **would rather** possui duas construções distintas conforme a mudança ou manutenção do sujeito:\n- **Mesmo sujeito (`I'd rather + bare infinitive`):** *I'd rather not disclose...* (preferência do próprio falante).\n- **Sujeitos diferentes (`I'd rather + outro sujeito + Past Subjunctive`):** *I'd rather you didn't disclose...* (preferência presente/futura sobre a ação de outra pessoa).\n• Análise dos distratores: A e B rejeitam indevidamente uma das duas formas corretas; D confunde passado subjuntivo (preferência presente) com Past Perfect (*I'd rather you hadn't disclosed*, que seria arrependimento passado).", "k": "Would rather: mesmo sujeito → infinitivo sem to (I'd rather go). Outro sujeito → Past Subjunctive (I'd rather you went)."}, {"id": 232, "b": "tempos", "p": null, "d": "hard", "s": "By the time the new academic calendar comes into effect next month, the committee ______ on the curriculum revision for nearly eighteen months.", "o": ["will work", "is working", "will have been working", "has been working"], "a": 2, "e": "• Explicação detalhada: O marcador temporal 'By the time + presente com valor futuro (next month)' combinado com a duração acumulada 'for nearly eighteen months' exige o **Future Perfect Continuous** (`will have been + V-ing`), enfatizando uma ação em curso que completará determinada duração até um marco futuro.\n• Análise dos distratores: A e B não expressam anterioridade nem duração acumulada até um ponto futuro; D ('has been working') ancora a duração no presente ('até agora'), incompatível com 'By the time... next month'.", "k": "By the time + futuro + for + duração = Future Perfect Continuous (will have been + -ing)."}, {"id": 233, "b": "tempos", "p": null, "d": "hard", "s": "Which conditional sentence expresses a past unreal condition with a past unreal consequence, using formal inversion without 'if'?", "o": ["Should the candidates require special accommodations, they must notify the board in advance.", "Were the ministry to allocate additional funds, rural schools could modernize their labs.", "Had the teachers not intervened early, several at-risk students would have dropped out.", "Provided that students attend at least 75% of classes, they are eligible for final exams."], "a": 2, "e": "• Explicação detalhada: A alternativa C apresenta a **3ª condicional invertida** (`Had + sujeito + not + particípio, would have + particípio`), equivalente a *If the teachers had not intervened early...*, descrevendo uma condição passada contrária aos fatos e sua consequência também no passado.\n• Análise dos distratores: A é 1ª condicional invertida (condição futura); B é 2ª condicional invertida (hipótese presente/futura); D é condicional real com 'provided that'.", "k": "Had + sujeito + particípio = inversão da 3ª condicional (passado irreal: 'Se os professores não tivessem intervindo...')."}, {"id": 234, "b": "tempos", "p": null, "d": "hard", "s": "In 'When the external evaluators arrived at the school, the teachers had been discussing the interdisciplinary project for over two hours', the verb tense 'had been discussing' indicates", "o": ["an action that started after the evaluators arrived.", "a continuous action in progress up to a specific point in the past.", "a completed habit that still continues in the present.", "a passive action performed by the evaluators."], "a": 1, "e": "• Explicação detalhada: O **Past Perfect Continuous** (`had been + V-ing`) expressa a duração contínua de uma ação ('for over two hours') que vinha ocorrendo no passado até o momento em que outra ação passada ocorreu ('When the external evaluators arrived').\n• Análise dos distratores: A inverte a cronologia; C descreve o Present Perfect Continuous; D confunde voz ativa contínua com voz passiva.", "k": "Past Perfect Continuous (had been + -ing): duração contínua no passado até um marco passado."}, {"id": 235, "b": "passiva", "p": null, "d": "hard", "s": "Transform the active sentence 'Researchers widely believe that bilingual education enhances cognitive flexibility' into the personal passive construction.", "o": ["Bilingual education is widely believed to enhance cognitive flexibility.", "Bilingual education widely believes to enhance cognitive flexibility.", "Bilingual education is widely believed enhancing cognitive flexibility.", "It is widely believed bilingual education to enhance cognitive flexibility."], "a": 0, "e": "• Explicação detalhada: Com verbos de relato/opinião (*believe, say, claim, allege, estimate, consider*), existem duas estruturas passivas formais:\n1. **Passiva impessoal:** *It is widely believed that bilingual education enhances...*\n2. **Passiva pessoal (sujeito alçado):** O sujeito da oração subordinada ('Bilingual education') sobe para sujeito da principal passiva + `be + particípio + to-infinitive`: *Bilingual education **is widely believed to enhance** cognitive flexibility.*\n• Análise dos distratores: B omite o auxiliar 'is' (deixando o verbo na ativa); C usa gerúndio após 'believed' (agramatical); D mistura a estrutura impessoal ('It is believed') com infinitivo.", "k": "Passiva com verbos de opinião (believe/say/claim): Sujeito + be + particípio + TO + infinitivo (se simultâneo) ou TO HAVE + particípio (se anterior)."}, {"id": 236, "b": "passiva", "p": null, "d": "hard", "s": "Compare the two sentences:\nI. 'You needn't have printed all fifty copies; the test was postponed.'\nII. 'You didn't need to print all fifty copies, so you saved a lot of paper.'\nThe semantic distinction between 'needn't have printed' and 'didn't need to print' is that", "o": ["in I, the action was performed despite being unnecessary; in II, the action was not performed because it was known to be unnecessary.", "in I, the action was prohibited by law; in II, the action was mandatory.", "in I, the action was not performed; in II, the action was performed unnecessarily.", "both structures are interchangeable and mean the action never took place."], "a": 0, "e": "• Explicação detalhada: Distinção clássica de modais no passado cobrada em provas de nível superior de Inglês:\n- **needn't have + particípio** (frase I): a pessoa **fez** a ação (imprimiu as 50 cópias), mas depois descobriu-se que era desnecessário ('Não precisava ter imprimido, mas imprimiu').\n- **didn't need to + infinitivo** (frase II): sabia-se previamente que não era necessário, e por isso a pessoa **não fez** a ação (economizou papel).\n• Análise dos distratores: B confunde ausência de necessidade com proibição/obrigação; C e D invertem o significado das duas estruturas.", "k": "Needn't have done = FEZ à toa (era desnecessário). Didn't need to do = NÃO FEZ (sabia que não precisava)."}, {"id": 237, "b": "passiva", "p": null, "d": "hard", "s": "Choose the correct causative passive structure to complete the sentence:\n'Before the accreditation visit, the school principal ______ all the science laboratories ______.'", "o": ["had / renovate", "got / renovating", "had / renovated", "made / renovated"], "a": 2, "e": "• Explicação detalhada: A **Causative Passive** (`have / get + objeto + particípio passado`) expressa que o sujeito providenciou/encomendou que terceiros realizassem um serviço sobre algo ('mandou reformar os laboratórios'): *had all the science laboratories **renovated***.\n• Análise dos distratores: A usa infinitivo sem 'to' (que exigiria agente ativo: *had the workers renovate*); B usa '-ing'; D usa 'make', que não forma causativa passiva com particípio dessa maneira.", "k": "Causative Passive: have / get + COISA (objeto) + PARTICÍPIO PASSADO ('had the labs renovated' = mandou reformar os laboratórios)."}, {"id": 238, "b": "passiva", "p": null, "d": "hard", "s": "Select the correct reported speech transformation for:\n'I didn't leak the exam questions,' the clerk said. → 'The clerk denied ______ the exam questions.'", "o": ["to leak", "having leaked", "that he leaks", "to have been leaking"], "a": 1, "e": "• Explicação detalhada: Verbos introdutórios de discurso indireto (*reporting verbs*) possuem regências específicas: o verbo **deny** (negar) exige **gerúndio** (`doing` ou `having done` para enfatizar anterioridade): *denied **having leaked*** (ou *denied leaking*).\n• Análise dos distratores: A usa infinitivo (agramatical após 'deny'); C usa presente do indicativo sem recuo; D usa infinitivo perfeito contínuo.", "k": "Reporting verbs + Gerúndio (-ing / having + pp): deny, admit, regret, suggest, recommend, accuse someone of, apologize for."}, {"id": 239, "b": "passiva", "p": null, "d": "hard", "s": "In 'The classrooms were empty and the lights were off; the evening classes must have ended early', the modal construction 'must have ended' expresses", "o": ["an unfulfilled obligation in the past.", "a strong logical deduction about a past event based on present evidence.", "a past prohibition that was violated.", "a remote possibility in the future."], "a": 1, "e": "• Explicação detalhada: A estrutura `must have + particípio passado` nunca expressa obrigação no passado (obrigação passada é *had to*); ela expressa **dedução lógica / quase certeza sobre um fato passado** apoiada em evidências visíveis ('as salas estavam vazias e as luzes apagadas → as aulas devem ter terminado cedo').\n• Análise dos distratores: A confunde com *should have ended* (obrigação/expectativa não cumprida); C e D atribuem valores inexistentes a 'must have + pp'.", "k": "Modais Perfeitos (Modal + have + particípio): must have done = dedução sobre o passado | should have done = crítica/arrependimento | can't have done = impossibilidade no passado."}, {"id": 240, "b": "passiva", "p": null, "d": "hard", "s": "Which sentence maintains the original tense correctly in indirect speech because it expresses a universal scientific truth?", "o": ["The physics teacher explained that water boiled at 100 degrees Celsius at sea level.", "The physics teacher explained that water boils at 100 degrees Celsius at sea level.", "The physics teacher explained that water would boil at 100 degrees Celsius at sea level.", "The physics teacher explained that water had boiled at 100 degrees Celsius at sea level."], "a": 1, "e": "• Explicação detalhada: Embora o verbo introdutório ('explained') esteja no Simple Past, o recuo temporal (*backshift*) é dispensado em inglês padrão quando a oração relatada expressa uma **verdade científica universal ou fato permanente** (*water boils at 100 °C*).\n• Análise dos distratores: A, C e D aplicam recuos temporais que transformariam uma lei física permanente em algo restrito ao passado ou hipotético.", "k": "Exceção ao Backshift no Discurso Indireto: verdades universais, leis científicas e fatos ainda válidos no momento da fala permanecem no Simple Present!"}, {"id": 241, "b": "pron", "p": null, "d": "hard", "s": "Choose the connector that accurately completes the sentence:\n'The pilot project yielded promising literacy gains, ______ its implementation required substantial teacher training.'", "o": ["albeit", "insofar as", "thereby", "lest"], "a": 0, "e": "• Explicação detalhada: 'Albeit' (= 'although / even though', 'embora / ainda que') introduz uma concessão/ressalva ao resultado positivo mencionado antes: o projeto piloto gerou ganhos promissores, embora sua implementação tenha exigido formação docente substancial.\n• Análise dos distratores: B ('insofar as') significa 'na medida em que'; C ('thereby') significa 'desse modo / com isso' (consequência); D ('lest') significa 'para que não'.", "k": "Conectores avançados de contraste/concessão: albeit, notwithstanding, whereas, nonetheless, conversely."}, {"id": 242, "b": "pron", "p": null, "d": "hard", "s": "Which option displays the correct preposition collocations in standard academic English?", "o": ["The study focuses on the extent to which digital literacy correlates with academic achievement.", "The study focuses in the extent at which digital literacy correlates to academic achievement.", "The study focuses at the extent on which digital literacy correlates with academic achievement.", "The study focuses on the extent in which digital literacy correlates at academic achievement."], "a": 0, "e": "• Explicação detalhada: Três colocações preposicionais fixas do inglês acadêmico cobradas pela CEV/UECE:\n1. **focus on** (focar em);\n2. **to the extent (to which)** (na medida em que);\n3. **correlate with** (correlacionar-se com).\n• Análise dos distratores: B, C e D trocam as preposições fixas (*focus on, to the extent, correlate with*) por interferência do português ('focar em' → *focus in*).", "k": "Regências acadêmicas fixas: focus ON | to the extent TO which | correlate WITH | result IN | consist OF."}, {"id": 243, "b": "pron", "p": null, "d": "hard", "s": "Select the option that correctly completes the sentence:\n'Scarcely ______ the new digital platform launched ______ teachers began reporting technical glitches.'", "o": ["was / than", "had / when", "had / than", "did / as"], "a": 1, "e": "• Explicação detalhada: 'Scarcely' (= 'Hardly' / 'Barely') no início da oração exige inversão com Past Perfect (`Scarcely had + sujeito + particípio`) e estabelece correlação obrigatória com a conjunção temporal **when**.\n• Análise dos distratores: A usa voz passiva mal formada com 'than'; C mistura 'Scarcely' com 'than' (que pertence a 'No sooner'); D usa 'did' com particípio 'launched' e 'as'.", "k": "Scarcely / Hardly + had + S + particípio ... WHEN (Mal tinha sido lançada a plataforma quando...)."}, {"id": 244, "b": "pron", "p": null, "d": "hard", "s": "In 'Two pedagogical approaches were compared: task-based learning and audiolingualism; while the former fosters communicative autonomy, the latter relies on habit formation', the expressions 'the former' and 'the latter' refer, respectively, to", "o": ["audiolingualism and task-based learning.", "task-based learning and audiolingualism.", "habit formation and communicative autonomy.", "communicative autonomy and habit formation."], "a": 1, "e": "• Explicação detalhada: Em textos acadêmicos em inglês, quando dois elementos foram citados anteriormente (1º: *task-based learning*; 2º: *audiolingualism*), **the former** retoma o **primeiro** mencionado (*task-based learning*) e **the latter** retoma o **segundo / último** mencionado (*audiolingualism*).\n• Análise dos distratores: A inverte a ordem; C e D confundem os referentes com os predicados das orações seguintes.", "k": "The former = o PRIMEIRO citado. The latter = o ÚLTIMO (segundo) citado. (Dica: Latter começa com L de Last!)"}, {"id": 245, "b": "ensino", "p": null, "d": "hard", "s": "No campo da avaliação educacional em Língua Inglesa, o fenômeno pelo qual o formato e o conteúdo de exames externos (como vestibulares e avaliações em larga escala) influenciam diretamente o que e como professores ensinam e alunos estudam em sala de aula denomina-se", "o": ["scaffolding (andaimento).", "washback effect (efeito retroativo).", "fossilization (fossilização).", "code-switching (alternância de código)."], "a": 1, "e": "• Explicação detalhada: Na literatura de avaliação linguística (Alderson & Wall; Bachman & Palmer), **washback** (ou *backwash* — efeito retroativo) é o impacto que um exame exerce sobre o ensino e a aprendizagem, podendo ser positivo (quando incentiva práticas comunicativas autênticas) ou negativo (quando reduz as aulas a treino mecânico de questões).\n• Análise dos distratores: A é o suporte mediado na ZDP (Bruner/Vygotsky); C é a estabilização permanente de formas interlinguísticas não padrão (Selinker); D é a alternância entre línguas no discurso.", "k": "Washback effect = efeito retroativo das provas/avaliações sobre o currículo e a prá
