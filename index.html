ook! The children ______ in the yard.\"", "o": ["play", "are playing", "played", "have play"], "a": 1, "e": "• Explicação detalhada: \"Look!\" indica ação acontecendo agora: Present Continuous (am/is/are + -ing).\n• Por que a alternativa B está correta: \"are playing\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"play\"; C) \"played\"; D) \"have play\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "Marcadores do Present Continuous: now, at the moment, look!, listen!. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 124, "b": "tempos", "p": null, "s": "I ______ her since we were children.", "o": ["know", "knew", "have known", "am knowing"], "a": 2, "e": "• Explicação detalhada: Since + passado indica situação que começou lá atrás e continua: Present Perfect. Know é stative, por isso have known e não \"have been knowing\" ou \"am knowing\".\n• Por que a alternativa C está correta: \"have known\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"know\"; B) \"knew\"; D) \"am knowing\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "since + oração no passado → present perfect na outra oração. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 125, "b": "tempos", "p": null, "s": "When I got home, my mother ______ already prepared dinner.", "o": ["had", "has", "was", "did"], "a": 0, "e": "• Explicação detalhada: Preparar o jantar aconteceu antes de eu chegar. Past Perfect: had + particípio.\n• Por que a alternativa A está correta: \"had\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"has\"; C) \"was\"; D) \"did\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "already + particípio depois de ação passada: pense em had. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 126, "b": "tempos", "p": null, "s": "Next June, I ______ teaching for ten years.", "o": ["have been", "will be", "am", "will have been"], "a": 3, "e": "• Explicação detalhada: A ideia é duração até um ponto futuro (next June): Future Perfect Continuous, will have been + -ing.\n• Por que a alternativa D está correta: \"will have been\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"have been\"; B) \"will be\"; C) \"am\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "Future perfect continuous = will have been + -ing: duração acumulada até certa data. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 127, "b": "tempos", "p": null, "s": "Choose the correct sentence.", "o": ["I have seen him yesterday.", "I saw him yesterday.", "I am seeing him yesterday.", "I have been seeing him yesterday."], "a": 1, "e": "• Explicação detalhada: Yesterday é tempo terminado e específico: Simple Past (saw).\n• Por que a alternativa B está correta: \"I saw him yesterday.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"I have seen him yesterday.\"; C) \"I am seeing him yesterday.\"; D) \"I have been seeing him yesterday.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "yesterday, last week, in 2010, ago → Simple Past, nunca present perfect. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 128, "b": "passiva", "p": null, "s": "Choose the passive form of \"Students must finish the homework.\"", "o": ["The homework must finish by students.", "The homework must be finished by students.", "The homework must been finished.", "The homework is must finish."], "a": 1, "e": "• Explicação detalhada: Passiva com modal: modal + be + particípio (must be finished).\n• Por que a alternativa B está correta: \"The homework must be finished by students.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"The homework must finish by students.\"; C) \"The homework must been finished.\"; D) \"The homework is must finish.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "Modal na passiva: nunca flexione o modal; use be + particípio. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 129, "b": "passiva", "p": null, "s": "Report: He said, \"I will call you tomorrow.\" → He said that he ______ call me the next day.", "o": ["will", "can", "would", "had"], "a": 2, "e": "• Explicação detalhada: No discurso indireto, will recua para would e tomorrow vira the next day.\n• Por que a alternativa C está correta: \"would\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"will\"; B) \"can\"; D) \"had\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "will → would; can → could; may → might; tomorrow → the next day. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 130, "b": "passiva", "p": null, "s": "Report: She asked, \"Do you like pizza?\" → She asked me ______ I liked pizza.", "o": ["if", "that", "what", "did"], "a": 0, "e": "• Explicação detalhada: Pergunta de sim ou não vira oração com if ou whether, em ordem afirmativa, com recuo do tempo (like → liked).\n• Por que a alternativa A está correta: \"if\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"that\"; C) \"what\"; D) \"did\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "Yes/no question no indireto: if / whether. Sem do/did. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 131, "b": "passiva", "p": null, "s": "\"She has been working all night. She ______ be exhausted.\"", "o": ["mustn't", "needn't", "may not", "must"], "a": 3, "e": "• Explicação detalhada: Há evidência forte (trabalhou a noite toda): must expressa dedução, quase certeza.\n• Por que a alternativa D está correta: \"must\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"mustn't\"; B) \"needn't\"; C) \"may not\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "must = dedução forte; may/might = possibilidade; can't = impossibilidade. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 132, "b": "passiva", "p": null, "s": "\"You look terrible. You ______ see a doctor.\"", "o": ["should", "can't", "mustn't", "won't"], "a": 0, "e": "• Explicação detalhada: Conselho ou recomendação: should. Mustn't seria proibição; can't, impossibilidade.\n• Por que a alternativa A está correta: \"should\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"can't\"; C) \"mustn't\"; D) \"won't\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "should = conselho (ought to). must = obrigação forte. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 133, "b": "pron", "p": null, "s": "That house is ______. They built it themselves.", "o": ["their", "theirs", "them", "they's"], "a": 1, "e": "• Explicação detalhada: Sem substantivo depois, usa-se o pronome possessivo: theirs. Their exige substantivo (their house).\n• Por que a alternativa B está correta: \"theirs\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"their\"; C) \"them\"; D) \"they's\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "Pronomes possessivos: mine, yours, his, hers, ours, theirs (its quase não é usado). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 134, "b": "pron", "p": null, "s": "She is ______ student in the class.", "o": ["the more intelligent", "more intelligent", "the most intelligent", "most intelligent than"], "a": 2, "e": "• Explicação detalhada: Superlativo de adjetivo longo: the most + adjetivo. Há comparação com o grupo todo (in the class).\n• Por que a alternativa C está correta: \"the most intelligent\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"the more intelligent\"; B) \"more intelligent\"; D) \"most intelligent than\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "Superlativo: the + -est / the most. Comparativo: -er / more + than. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 135, "b": "pron", "p": null, "s": "He runs ______ than his brother.", "o": ["fast", "fastest", "more fast", "faster"], "a": 3, "e": "• Explicação detalhada: Fast tem uma sílaba: comparativo faster. O than pede comparativo, não superlativo.\n• Por que a alternativa D está correta: \"faster\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"fast\"; B) \"fastest\"; C) \"more fast\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "than → comparativo. the... in/of → superlativo. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 136, "b": "pron", "p": null, "s": "My notebook is ______ expensive as yours.", "o": ["as", "more", "than", "the"], "a": 0, "e": "• Explicação detalhada: Comparação de igualdade: as + adjetivo + as.\n• Por que a alternativa A está correta: \"as\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"more\"; C) \"than\"; D) \"the\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "as ... as = igualdade; not as ... as = inferioridade. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 137, "b": "pron", "p": null, "s": "I am interested ______ learning Spanish.", "o": ["on", "at", "in", "for"], "a": 2, "e": "• Explicação detalhada: A regência de interested é in. Outras comuns: good at, afraid of, depend on, listen to.\n• Por que a alternativa C está correta: \"in\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"on\"; B) \"at\"; D) \"for\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "adjetivo + preposição: interested in, good at, afraid of, proud of, tired of. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 138, "b": "pron", "p": null, "s": "Choose the sentence that uses the possessive correctly.", "o": ["The childrens' toys are here.", "The children's toys are here.", "The childrens toys are here.", "The children toys' are here."], "a": 1, "e": "• Explicação detalhada: Children já é plural, então o possessivo recebe 's (children's).\n• Por que a alternativa B está correta: \"The children's toys are here.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"The childrens' toys are here.\"; C) \"The childrens toys are here.\"; D) \"The children toys' are here.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "Plural irregular (children, men, women, people) + 's. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 139, "b": "sint", "p": null, "s": "In \"Whoever finishes first will win\", the clause \"Whoever finishes first\" is a", "o": ["adverb clause.", "adjective clause.", "noun clause.", "coordinate clause."], "a": 2, "e": "• Explicação detalhada: A oração funciona como sujeito de will win (quem vai ganhar? Whoever finishes first). Sujeito e objeto são funções de substantivo: noun clause.\n• Por que a alternativa C está correta: \"noun clause.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"adverb clause.\"; B) \"adjective clause.\"; D) \"coordinate clause.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "Noun clause: that, whether, if, wh-words e whoever/whatever, em função de sujeito ou objeto. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 140, "b": "sint", "p": null, "s": "In \"I will call you when I arrive\", the clause \"when I arrive\" expresses", "o": ["place.", "cause.", "concession.", "time."], "a": 3, "e": "• Explicação detalhada: When introduz adverb clause de tempo. Note também o present depois de when em referência ao futuro.\n• Por que a alternativa D está correta: \"time.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"place.\"; B) \"cause.\"; C) \"concession.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "Em adverb clauses de tempo, use presente com sentido de futuro: when I arrive, as soon as she calls. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 141, "b": "sint", "p": null, "s": "\"Because it was raining, we stayed at home.\" This sentence is", "o": ["simple.", "compound.", "complex.", "compound-complex."], "a": 2, "e": "• Explicação detalhada: Uma oração dependente (Because it was raining) e uma independente (we stayed at home): complex.\n• Por que a alternativa C está correta: \"complex.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"simple.\"; B) \"compound.\"; D) \"compound-complex.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "complex = 1 independente + dependente. Basta uma conjunção subordinativa. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 142, "b": "ensino", "p": null, "s": "Which activity best develops skimming?", "o": ["Reading to locate a phone number.", "Translating each word of a text.", "Glancing over title, images and first lines to get the general idea.", "Memorizing a list of words."], "a": 2, "e": "• Explicação detalhada: Skimming é a leitura rápida para captar a ideia geral. Procurar um número é scanning.\n• Por que a alternativa C está correta: \"Glancing over title, images and first lines to get the general idea.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Reading to locate a phone number.\"; B) \"Translating each word of a text.\"; D) \"Memorizing a list of words.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "skimming = geral; scanning = específico. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 143, "b": "ensino", "p": null, "s": "Official documents for English teaching in Ensino Médio suggest that classes should", "o": ["focus only on lists of grammar rules.", "avoid digital technologies.", "rely mainly on word-by-word translation.", "promote language practices in real contexts, with the student as protagonist."], "a": 3, "e": "• Explicação detalhada: A BNCC e o DCRC propõem práticas de linguagem situadas e protagonismo do estudante, e não o ensino centrado em regras isoladas.\n• Por que a alternativa D está correta: \"promote language practices in real contexts, with the student as protagonist.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"focus only on lists of grammar rules.\"; B) \"avoid digital technologies.\"; C) \"rely mainly on word-by-word translation.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Palavras-chave do discurso oficial: práticas de linguagem, contexto, protagonismo, multiletramentos. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 144, "b": "ensino", "p": null, "s": "Formative assessment in English classes is characterized by", "o": ["following the learning process and giving feedback to adjust teaching.", "happening only at the end of the school year.", "ranking students against each other.", "punishing mistakes."], "a": 0, "e": "• Explicação detalhada: A avaliação formativa acompanha o processo, oferece feedback e orienta o ajuste do ensino e da aprendizagem.\n• Por que a alternativa A está correta: \"following the learning process and giving feedback to adjust teaching.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"happening only at the end of the school year.\"; C) \"ranking students against each other.\"; D) \"punishing mistakes.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Diagnóstica (início), formativa (durante), somativa (fim). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 145, "b": "ensino", "p": null, "s": "Feedback on a first draft should focus mainly on", "o": ["handwriting.", "the number of words.", "ideas, organization and clarity, leaving surface errors for later.", "every comma."], "a": 2, "e": "• Explicação detalhada: Em escrita como processo, a primeira versão recebe retorno sobre conteúdo e organização (revising). A correção de forma (editing) vem depois.\n• Por que a alternativa C está correta: \"ideas, organization and clarity, leaving surface errors for later.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"handwriting.\"; B) \"the number of words.\"; D) \"every comma.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Draft → revising (ideias). Versão quase final → editing (forma). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 146, "b": "ensino", "p": null, "s": "Pre-listening activities aim to", "o": ["grade the students.", "correct pronunciation.", "test vocabulary only.", "activate prior knowledge and prepare students for what they will hear."], "a": 3, "e": "• Explicação detalhada: Antes de ouvir, ativa-se o conhecimento prévio, levantam-se hipóteses e preparam-se o vocabulário e o contexto.\n• Por que a alternativa D está correta: \"activate prior knowledge and prepare students for what they will hear.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"grade the students.\"; B) \"correct pronunciation.\"; C) \"test vocabulary only.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Pre – while – post: antecipar, compreender, aplicar/discutir. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 147, "b": "ensino", "p": null, "s": "In oral fluency activities, correcting every error immediately tends to", "o": ["always increase confidence.", "interrupt communication and inhibit participation.", "replace feedback.", "improve spelling."], "a": 1, "e": "• Explicação detalhada: Em atividades de fluência, o foco é a mensagem. Correção constante interrompe a comunicação; o feedback pode vir ao final.\n• Por que a alternativa B está correta: \"interrupt communication and inhibit participation.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"always increase confidence.\"; C) \"replace feedback.\"; D) \"improve spelling.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Fluência: corrigir depois. Precisão: corrigir durante. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 148, "b": "ensino", "p": null, "s": "A project in which students research beach pollution in Fortaleza for Science and produce bilingual posters in English illustrates", "o": ["isolated memorization.", "the deductive approach.", "interdisciplinarity and multisemiotic production.", "only summative assessment."], "a": 2, "e": "• Explicação detalhada: O projeto liga Ciências e Inglês (interdisciplinaridade) e resulta em cartazes com texto e imagem (multissemiose).\n• Por que a alternativa C está correta: \"interdisciplinarity and multisemiotic production.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"isolated memorization.\"; B) \"the deductive approach.\"; D) \"only summative assessment.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Projeto + tema real + produto = marca de aprendizagem interdisciplinar. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 149, "b": "ensino", "p": null, "s": "Looking at the title and pictures before reading to form hypotheses about the text is", "o": ["scanning.", "predicting.", "summarizing.", "editing."], "a": 1, "e": "• Explicação detalhada: Predicting é antecipar o conteúdo a partir de pistas como título, imagens e conhecimento prévio.\n• Por que a alternativa B está correta: \"predicting.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"scanning.\"; C) \"summarizing.\"; D) \"editing.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "predicting = antecipar, antes de ler. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 150, "b": "p1", "p": null, "s": "[Educação] A LDB prevê que os sistemas de ensino definirão normas da gestão democrática conforme o princípio de", "o": ["participação dos profissionais na elaboração do projeto pedagógico e das comunidades escolar e local em conselhos escolares ou equivalentes.", "nomeação direta de diretores sem consulta.", "exclusão das famílias das decisões.", "decisão exclusiva da secretaria de educação."], "a": 0, "e": "• Explicação detalhada: O art. 14 da LDB estabelece esses dois princípios: participação dos profissionais na elaboração do PPP e participação das comunidades escolar e local em conselhos escolares.\n• Por que a alternativa A está correta: \"participação dos profissionais na elaboração do projeto pedagógico e das comunidades escolar e local em conselhos escolares ou equivalentes.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"nomeação direta de diretores sem consulta.\"; C) \"exclusão das famílias das decisões.\"; D) \"decisão exclusiva da secretaria de educação.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Gestão democrática: PPP participativo + conselhos escolares (LDB, art. 14). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 151, "b": "p1", "p": null, "s": "[Educação] Segundo a LDB, a avaliação do rendimento escolar deve ser", "o": ["feita somente por prova final.", "exclusivamente quantitativa.", "contínua e cumulativa, com prevalência dos aspectos qualitativos sobre os quantitativos.", "classificatória, sem retorno ao aluno."], "a": 2, "e": "• Explicação detalhada: O art. 24 estabelece avaliação contínua e cumulativa, com prevalência dos aspectos qualitativos e dos resultados ao longo do período sobre eventuais provas finais.\n• Por que a alternativa C está correta: \"contínua e cumulativa, com prevalência dos aspectos qualitativos sobre os quantitativos.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"feita somente por prova final.\"; B) \"exclusivamente quantitativa.\"; D) \"classificatória, sem retorno ao aluno.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Avaliação na LDB: contínua, cumulativa, qualitativo > quantitativo. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 152, "b": "p1", "p": null, "s": "[Educação] A LDB define a educação especial como modalidade de educação escolar oferecida", "o": ["exclusivamente em escolas especiais.", "apenas na educação de jovens e adultos.", "somente fora da escola.", "preferencialmente na rede regular de ensino."], "a": 3, "e": "• Explicação detalhada: O art. 58 diz que a educação especial é oferecida preferencialmente na rede regular de ensino, para educandos com deficiência, transtornos globais do desenvolvimento e altas habilidades ou superdotação.\n• Por que a alternativa D está correta: \"preferencialmente na rede regular de ensino.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"exclusivamente em escolas especiais.\"; B) \"apenas na educação de jovens e adultos.\"; C) \"somente fora da escola.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Educação especial: preferencialmente na rede regular. Atenção a \"exclusivamente\". (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 153, "b": "p1", "p": null, "s": "[Educação] O condicionamento operante de Skinner enfatiza", "o": ["o reforço das respostas desejadas, que aumenta a probabilidade de o comportamento se repetir.", "a zona de desenvolvimento proximal.", "os estágios do desenvolvimento cognitivo.", "a aprendizagem significativa por subsunçores."], "a": 0, "e": "• Explicação detalhada: Skinner é behaviorista: o comportamento é modelado por suas consequências. ZDP é Vygotsky; estágios, Piaget; subsunçores, Ausubel.\n• Por que a alternativa A está correta: \"o reforço das respostas desejadas, que aumenta a probabilidade de o comportamento se repetir.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"a zona de desenvolvimento proximal.\"; C) \"os estágios do desenvolvimento cognitivo.\"; D) \"a aprendizagem significativa por subsunçores.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Skinner = reforço/comportamento. Pegadinha: não confundir com Piaget e Vygotsky. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 154, "b": "p1", "p": null, "s": "[Educação] Para Piaget, o raciocínio lógico sobre objetos concretos, como conservação e classificação, caracteriza o estágio", "o": ["sensório-motor.", "operatório concreto.", "pré-operatório.", "operatório formal."], "a": 1, "e": "• Explicação detalhada: No estágio operatório concreto a criança realiza operações mentais lógicas, mas ainda apoiadas em objetos e situações concretas. No formal, ela raciocina sobre hipóteses abstratas.\n• Por que a alternativa B está correta: \"operatório concreto.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"sensório-motor.\"; C) \"pré-operatório.\"; D) \"operatório formal.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Ordem de Piaget: sensório-motor → pré-operatório → operatório concreto → operatório formal. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 155, "b": "p1", "p": null, "s": "[Administração] A entidade da Administração indireta com personalidade jurídica de direito público, criada por lei para executar atividade típica de Estado, é a", "o": ["órgão público.", "empresa pública.", "sociedade de economia mista.", "autarquia."], "a": 3, "e": "• Explicação detalhada: Autarquia é pessoa jurídica de direito público da Administração indireta. Empresas públicas e sociedades de economia mista têm personalidade de direito privado. Órgão não tem personalidade jurídica própria.\n• Por que a alternativa D está correta: \"autarquia.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"órgão público.\"; B) \"empresa pública.\"; C) \"sociedade de economia mista.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Autarquia e fundação pública: direito público. Empresa pública e SEM: direito privado. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 156, "b": "p1", "p": null, "s": "[Administração] A faculdade de dar ordens, fiscalizar e rever atos de subordinados é manifestação do poder", "o": ["de polícia.", "normativo.", "hierárquico.", "vinculado."], "a": 2, "e": "• Explicação detalhada: O poder hierárquico organiza a Administração em escalões, com ordens, fiscalização, avocação e revisão. Disciplinar é a punição.\n• Por que a alternativa C está correta: \"hierárquico.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"de polícia.\"; B) \"normativo.\"; D) \"vinculado.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "hierárquico = ordens e fiscalização; disciplinar = punir; polícia = limitar direitos de particulares. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 157, "b": "p1", "p": null, "s": "[Português] Assinale a frase em que a regência verbal está de acordo com a norma-padrão.", "o": ["Assisti o filme ontem.", "Prefiro cinema do que teatro.", "Aspiro ao cargo de professora.", "Obedeço os regulamentos da escola."], "a": 2, "e": "• Explicação detalhada: Aspirar no sentido de desejar pede a (aspiro ao cargo). Assistir no sentido de ver pede a; preferir X a Y (sem do que); obedecer a.\n• Por que a alternativa C está correta: \"Aspiro ao cargo de professora.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Assisti o filme ontem.\"; B) \"Prefiro cinema do que teatro.\"; D) \"Obedeço os regulamentos da escola.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "assistir a; obedecer a; preferir a; aspirar a (desejar). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 158, "b": "p1", "p": null, "s": "[Dados] Uma escola obteve nota padronizada de proficiência N = 6,0 e indicador de rendimento P = 0,90. Seu Ideb é", "o": ["5,4.", "6,9.", "6,0.", "0,54."], "a": 0, "e": "• Explicação detalhada: Ideb = N × P = 6,0 × 0,90 = 5,4.\n• Por que a alternativa A está correta: \"5,4.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"6,9.\"; C) \"6,0.\"; D) \"0,54.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Ideb = proficiência × rendimento (fluxo). Multiplique, não some. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 159, "b": "leitura", "p": "T5", "d": "hard", "s": "According to Text V, the 'false dichotomy' mentioned in sentence [3] refers to the assumption that", "o": ["large classes inevitably prevent teachers from preparing students for university exams.", "explicit attention to grammatical form is incompatible with the development of communicative competence.", "curricular guidelines should be replaced entirely by mechanical grammar drills.", "focus on forms is identical in pedagogical purpose to task-based focus on form."], "a": 1, "e": "• Explicação detalhada: Na frase [3], o autor afirma que tratar a instrução focada na forma ('form-focused instruction') e a competência comunicativa ('communicative competence') como mutuamente excludentes constitui uma falsa dicotomia. A frase [4] confirma que ambas se desenvolvem juntas quando a atenção à forma ocorre em contextos significativos.\n• Análise dos distratores: A mistura restrições estruturais da frase [2] com a dicotomia da frase [3]; C extrapola ao sugerir substituição do currículo; D contradiz diretamente a frase [4], que opõe 'focus on form' a 'focus on forms'.", "k": "'Mutually exclusive' = mutuamente excludentes. Falsa dicotomia na linguística aplicada (Long/Ellis): forma e comunicação não se anulam, se integram."}, {"id": 160, "b": "leitura", "p": "T5", "d": "hard", "s": "In sentence [1], the connector 'Notwithstanding' can be replaced, without altering the meaning or grammaticality of the sentence, by", "o": ["Inasmuch as.", "In spite of.", "Albeit.", "Thereby."], "a": 1, "e": "• Explicação detalhada: 'Notwithstanding' funciona aqui como preposição concessiva seguida de sintagma nominal ('the widespread enthusiasm...'), significando 'apesar de'. 'In spite of' também é locução prepositiva concessiva e exige sintagma nominal, mantendo sentido e gramaticalidade intactos.\n• Análise dos distratores: A ('Inasmuch as') indica causa/explicação ('visto que') e exige oração; C ('Albeit') é conjunção concessiva ('embora'), não preposição antes de sintagma nominal longo desse tipo; D ('Thereby') é advérbio de consequência/meio ('desse modo').", "k": "Preposições concessivas (+ substantivo/-ing): despite, in spite of, notwithstanding. Conjunções concessivas (+ oração): although, though, even though, whereas."}, {"id": 161, "b": "leitura", "p": "T5", "d": "hard", "s": "Regarding the syntactic and semantic structure of sentence [5] ('Were teacher-education programs to bridge..., practitioners might be less inclined...'), mark V for true and F for false.\n( ) The initial clause exhibits subject-auxiliary inversion that replaces the conditional conjunction 'if'.\n( ) The structure expresses a hypothetical condition in the present/future viewed as unlikely or contrary to current reality.\n( ) Replacing 'Were' with 'Had' would keep the verb phrase 'to bridge' grammatically intact.\nThe correct sequence, from top to bottom, is", "o": ["V, V, F.", "V, F, V.", "F, V, F.", "V, V, V."], "a": 0, "e": "• Explicação detalhada: (V) 'Were + sujeito + to + infinitivo' equivale a 'If teacher-education programs were to bridge...', um recurso formal de inversão condicional típico de textos acadêmicos cobrados pela CEV/UECE. (V) Essa estrutura (2ª condicional com 'were to') indica hipótese improvável ou contrária à realidade atual. (F) Se trocássemos 'Were' por 'Had', teríamos a 3ª condicional (passado irreal), que exigiria particípio passado ('Had programs bridged...'), tornando 'to bridge' agramatical.\n• Análise dos distratores: B erra o valor hipotético da 2ª condicional; C nega a inversão sintática evidente; D ignora a incompatibilidade entre 'Had' (inversão de Past Perfect) e o infinitivo 'to bridge'.", "k": "Inversões condicionais formais: Should + S + V (1ª cond.) | Were + S + to V (2ª cond.) | Had + S + V-ed/particípio (3ª cond.)."}, {"id": 162, "b": "leitura", "p": "T5", "d": "hard", "s": "In sentence [4], the noun phrase 'a procedure' functions syntactically as", "o": ["the direct object of the verb 'drawn'.", "an appositive explaining the preceding clause.", "the subject of the passive verb 'termed'.", "an adverbial adjunct of manner."], "a": 1, "e": "• Explicação detalhada: Isolada entre travessões ('—a procedure termed focus on form rather than isolated focus on forms—'), a expressão nominal 'a procedure...' funciona como aposto (appositive) que resume, renomeia e explica o procedimento descrito na oração anterior ('When learners' attention is briefly drawn to linguistic features...').\n• Análise dos distratores: A é falsa porque 'drawn' está na voz passiva e já tem sujeito ('learners' attention'); C é falsa porque 'termed' é particípio reduzido de oração adjetiva ('which is termed'); D é falsa porque 'a procedure' é sintagma nominal explicativo, não adjunto adverbial.", "k": "Sintagma nominal entre travessões ou vírgulas que renomeia ou resume um termo/oração anterior = aposto (appositive)."}, {"id": 163, "b": "leitura", "p": "T5", "d": "hard", "s": "In sentence [2], the verb 'compel' is closest in meaning to", "o": ["dissuade.", "force.", "exempt.", "enable."], "a": 1, "e": "• Explicação detalhada: No contexto ('structural constraints that compel them to prioritize explicit grammar drills'), 'compel' significa obrigar, forçar ou impelir alguém a fazer algo por força de circunstâncias externas. Seu sinônimo direto é 'force' (ou 'oblige').\n• Análise dos distratores: A ('dissuade') significa dissuadir/desencorajar (sentido oposto); C ('exempt') significa isentar; D ('enable') significa capacitar/possibilitar (sentido positivo, sem ideia de coerção).", "k": "Vocabulário acadêmico CEV/UECE: compel = force/oblige; preclude = prevent; entail = involve/require; mitigate = alleviate."}, {"id": 164, "b": "leitura", "p": "T6", "d": "hard", "s": "According to Text VI, the tension surrounding English as a Lingua Franca (ELF) in public education stems from the need to", "o": ["eradicate local varieties of English so that students can pass international exams.", "balance the legitimation of learners' multilingual identities with access to standardized prestige norms.", "replace standardized written English with informal spoken ELF in all academic contexts.", "prevent teachers from correcting phonological deviations even when communication breaks down."], "a": 1, "e": "• Explicação detalhada: As frases [4] e [5] sintetizam a tensão central do texto: adotar o ELF sem senso crítico pode privar alunos da escola pública dos registros de prestígio exigidos em instâncias acadêmicas e profissionais ('gatekeeping domains'); por isso, a pedagogia crítica deve equilibrar a afirmação das identidades linguísticas dos alunos com o domínio das convenções padronizadas quando necessário.\n• Análise dos distratores: A contradiz o ELF (que não busca erradicar variedades locais); C extrapola ao propor substituição total da norma escrita; D contradiz a frase [3] ('provided that they do not impede mutual comprehension').", "k": "Em textos argumentativos da CEV/UECE, palavras como 'Critics, however, warn...' introduzem a antítese, e a frase final traz a síntese/tese do autor."}, {"id": 165, "b": "leitura", "p": "T6", "d": "hard", "s": "In sentence [3], the subordinating conjunction 'provided that' introduces an adverbial clause of", "o": ["concession.", "purpose.", "condition.", "proportion."], "a": 2, "e": "• Explicação detalhada: 'Provided that' (assim como 'providing that', 'as long as' e 'on condition that') significa 'contanto que' ou 'desde que', introduzindo uma oração subordinada adverbial condicional (adverbial clause of condition): traços divergentes não são patologizados como erros, contanto que não impeçam a compreensão mútua.\n• Análise dos distratores: A seria 'although / even though'; B seria 'so that / in order that'; D seria 'as / the more... the more'.", "k": "'Provided (that)' e 'as long as' = contanto que / desde que → oração adverbial de condição (condition)."}, {"id": 166, "b": "leitura", "p": "T6", "d": "hard", "s": "In sentence [2], the conjunction 'Whereas' is used to establish a relationship of", "o": ["cause and effect between EFL and ELF.", "direct contrast between two pedagogical paradigms.", "chronological sequence in language acquisition.", "exemplification of intercultural encounters."], "a": 1, "e": "• Explicação detalhada: 'Whereas' ('ao passo que' / 'enquanto que') inicia uma oração subordinada adverbial de contraste/oposição direta entre dois paradigmas: o modelo tradicional de EFL (focado no falante nativo idealizado) e a pesquisa em ELF (focada na inteligibilidade co-construída por falantes multilíngues).\n• Análise dos distratores: A, C e D atribuem relações lógicas inexistentes (causalidade, tempo ou exemplificação) ao conector 'whereas'.", "k": "'Whereas' e 'while' (no início de período comparando duas realidades) = contraste direto ('ao passo que')."}, {"id": 167, "b": "leitura", "p": "T6", "d": "hard", "s": "In sentence [3], the pronoun 'they' in 'provided that they do not impede mutual comprehension' refers anaphorically to", "o": ["standard British or American varieties.", "multilingual speakers.", "phonological or lexicogrammatical features that diverge from standard varieties.", "traditional assumptions regarding linguistic ownership."], "a": 2, "e": "• Explicação detalhada: O sujeito da oração principal na frase [3] é o sintagma plural 'phonological or lexicogrammatical features that diverge from standard British or American varieties'. Na oração condicional seguinte, 'they' retoma exatamente esses traços divergentes, que não são tratados como erros desde que não impeçam a compreensão mútua.\n• Análise dos distratores: A é o termo de comparação dentro da oração relativa; B está na frase [2]; D está na frase [1].", "k": "Em questões de referência pronominal ('refers to'), teste substituir o pronome pelo núcleo do sujeito da oração principal para checar concordância e coerência."}, {"id": 168, "b": "leitura", "p": "T6", "d": "hard", "s": "In sentence [5], the word 'so' in 'whenever sociopolitical stakes so dictate' functions as a", "o": ["coordinating conjunction introducing a result.", "pro-form substituting the previously mentioned action.", "intensifying adverb modifying an adjective.", "correlative conjunction paired with 'whenever'."], "a": 1, "e": "• Explicação detalhada: Na construção formal 'whenever sociopolitical stakes so dictate' ('sempre que os interesses sociopolíticos assim o ditarem'), 'so' atua como pró-forma adverbial/pronominal (pro-form) que retoma toda a ação verbal anterior ('command standardized conventions'), evitando repetição.\n• Análise dos distratores: A é falsa porque 'so' não liga orações coordenadas aqui; C é falsa porque não modifica adjetivo; D é falsa porque 'whenever' não forma par correlativo com 'so'.", "k": "Em registros formais do inglês ('as the law so provides', 'if circumstances so require'), 'so' antes do verbo funciona como pró-forma ('assim / desse modo')."}, {"id": 169, "b": "sint", "p": null, "d": "hard", "s": "Compare the two sentences below:\nI. 'The rumor that the principal resigned surprised the entire faculty.'\nII. 'The rumor that the principal spread surprised the entire faculty.'\nRegarding the subordinate clauses introduced by 'that', it is correct to state that", "o": ["both clauses are restrictive adjective clauses, and 'that' functions as a relative pronoun in both.", "in I, 'that the principal resigned' is an appositive noun clause; in II, 'that the principal spread' is a restrictive adjective clause.", "in I, 'that' functions as a relative pronoun; in II, 'that' functions as a subordinating conjunction.", "both clauses are non-restrictive adjective clauses that can be omitted without changing the subject."], "a": 1, "e": "• Explicação detalhada: Esta é uma distinção clássica de sintaxe avançada cobrada pela CEV/UECE:\n- Na frase I ('The rumor that the principal resigned...'), a oração explica O CONTEÚDO do substantivo abstrato 'rumor' (o rumor = o diretor pediu demissão). O verbo 'resigned' é intransitivo e não tem lacuna para 'that' preencher: logo, 'that' é conjunção integrante (subordinating conjunction) e a oração é uma **Noun Clause (Appositive)** (equivalente à oração subordinada substantiva apositiva do português).\n- Na frase II ('The rumor that the principal spread...'), o verbo 'spread' (espalhou) é transitivo direto e exige objeto ('spread what? → the rumor'). Logo, 'that' é pronome relativo (pode ser trocado por 'which') e a oração é uma **Restrictive Adjective Clause**.\n• Análise dos distratores: A e C confundem conjunção integrante com pronome relativo; D classifica incorretamente orações sem vírgula como não restritivas.", "k": "Teste infalível: troque 'that' por 'which'. Se funcionar ('the rumor which he spread'), é Adjective Clause. Se não funcionar ('*the rumor which he resigned'), é Appositive Noun Clause!"}, {"id": 170, "b": "sint", "p": null, "d": "hard", "s": "Analyze the sentence: 'The committee proposed a new assessment rubric, which irritated several veteran teachers.' In this context, the relative pronoun 'which' introduces a", "o": ["restrictive adjective clause modifying the noun 'rubric'.", "sentential relative clause whose antecedent is the entire preceding main clause.", "noun clause functioning as the direct object of 'proposed'.", "adverbial clause of result."], "a": 1, "e": "• Explicação detalhada: Quando 'which' vem precedido de vírgula e retoma não apenas um substantivo isolado, mas todo o fato expresso na oração anterior (o fato de o comitê ter proposto uma nova rubrica irritou os professores), denomina-se **sentential relative clause** (oração relativa de sentença inteira, sempre não restritiva).\n• Análise dos distratores: A falha porque o que irritou os professores foi a proposta da nova rubrica como um todo, e a presença da vírgula impede a leitura restritiva; C e D confundem a classe da oração relativa.", "k": "Vírgula + 'which' retomando toda a ideia da oração anterior = Sentential Relative Clause (nunca pode ser trocado por 'that' ou 'what')."}, {"id": 171, "b": "sint", "p": null, "d": "hard", "s": "Consider the sentence: 'Students in public schools deserve resources; however, budgetary constraints often delay infrastructural reforms.' Structurally, this sentence is classified as", "o": ["simple, because it contains only one independent clause.", "complex, because 'however' is a subordinating conjunction.", "compound, because two independent clauses are joined by a semicolon and a conjunctive adverb.", "compound-complex, because 'however' introduces a dependent concessive clause."], "a": 2, "e": "• Explicação detalhada: Pegadinha sintática recorrente! Palavras como 'however', 'nevertheless', 'therefore', 'consequently', 'moreover' e 'furthermore' são **advérbios conjuntivos (conjunctive adverbs)**, e NÃO conjunções subordinativas. Quando ligam duas orações independentes com ponto e vírgula (`; however,`), o período permanece **compound** (composto por coordenação).\n• Análise dos distratores: A ignora que há duas orações finitas ('deserve' e 'delay'); B e D cometem o erro clássico de classificar 'however' como conjunção subordinativa (como 'although').", "k": "Although = conjunção subordinativa → período COMPLEX. However / Therefore / Moreover = advérbios conjuntivos → período COMPOUND."}, {"id": 172, "b": "sint", "p": null, "d": "hard", "s": "Identify the sentence that contains a dangling modifier (a syntactically misrelated participial clause).", "o": ["Having graded all the essays, the teacher finally went home.", "Written in clear academic prose, the article was immediately accepted for publication.", "Walking down the school corridor, the new bulletin board caught my attention.", "Exhausted by the long staff meeting, the coordinators postponed the vote."], "a": 2, "e": "• Explicação detalhada: Em orações reduzidas de particípio/gerúndio no início da frase (reduced adverbial clauses), o sujeito implícito da oração reduzida deve ser obrigatoriamente o mesmo sujeito da oração principal. Na alternativa C, o sujeito da oração principal é 'the new bulletin board' (o novo quadro de avisos) — o que cria o absurdo sintático de o quadro de avisos estar caminhando pelo corredor ('Walking down the school corridor')! Isso é um **dangling modifier**.\n• Análise dos distratores: Em A ('the teacher' corrigiu as redações), B ('the article' foi escrito) e D ('the coordinators' estavam exaustos), o sujeito da principal coincide perfeitamente com o agente/paciente da reduzida.", "k": "Dangling modifier: o sujeito da oração principal precisa realizar (com -ing) ou sofrer (com -ed) a ação da oração reduzida inicial."}, {"id": 173, "b": "sint", "p": null, "d": "hard", "s": "In 'That she refused to compromise her pedagogical principles earned her the respect of her peers', the clause 'That she refused to compromise her pedagogical principles' functions as", "o": ["an appositive noun clause.", "a noun clause functioning as the subject of the sentence.", "a restrictive relative clause modifying 'principles'.", "an adverbial clause of cause."], "a": 1, "e": "• Explicação detalhada: Toda a oração introduzida pela conjunção integrante 'That' ('O fato de ela ter se recusado a abrir mão de seus princípios pedagógicos') ocupa a posição pré-verbal e funciona como **sujeito** do verbo 'earned' (earned her the respect...). Podemos substituí-la pelo pronome 'It' ('It earned her the respect...').\n• Análise dos distratores: A exigiria um substantivo antecedente (ex.: 'The fact that...'); C confundiria 'That' conjunção com pronome relativo; D atribuiria valor causal inexistente.", "k": "Oração iniciada por 'That' antes do verbo principal e substituível por 'It' = Noun Clause functioning as Subject (subjetiva)."}, {"id": 174, "b": "sint", "p": null, "d": "hard", "s": "Choose the sentence in which the mandative subjunctive is employed according to formal standard English.", "o": ["The state secretariat insisted that every school submits its annual pedagogical plan on time.", "It is imperative that the candidate be present thirty minutes before the examination starts.", "The principal suggested that the coordinator was reviewing the syllabus immediately.", "The board demanded that the laboratory equipment is replaced before the semester begins."], "a": 1, "e": "• Explicação detalhada: Após verbos e expressões de exigência, recomendação, necessidade ou urgência (*insist, demand, recommend, suggest, imperative, essential, vital* + *that*), o inglês formal utiliza o **mandative subjunctive**, que consiste na forma base do verbo (infinitivo sem *to*), sem flexão de 3ª pessoa (`-s`) e sem alteração para o passado: *that the candidate **be** present*.\n• Análise dos distratores: A usa indicativo com `-s` ('submits'); C usa passado do indicativo ('was reviewing'); D usa presente do indicativo ('is replaced').", "k": "Mandative Subjunctive: verbos/adjetivos de ordem ou necessidade + that + sujeito + FORMA BASE DO VERBO (be, submit, go — sem -s e sem is/was)."}, {"id": 175, "b": "sint", "p": null, "d": "hard", "s": "Analyze the sentence: 'The researchers examined the data carefully, tabulated the results, and published their findings in an indexed journal.' Structurally, this sentence is", "o": ["compound, because it contains three finite verbs joined by 'and'.", "complex, because the actions occurred in chronological sequence.", "simple, because it consists of a single independent clause with a compound predicate.", "compound-complex, because it has multiple objects and a prepositional phrase."], "a": 2, "e": "• Explicação detalhada: Atenção à pegadinha clássica da sintaxe inglesa! Ter vários verbos não torna o período composto ('compound') se todos compartilham o **mesmo único sujeito** ('The researchers') sem formar novas orações com sujeitos próprios. Há apenas **uma oração independente** com sujeito simples ('The researchers') e predicado composto ('examined..., tabulated..., and published...'). Logo, é uma **Simple Sentence**!\n• Análise dos distratores: A confunde predicado composto com orações coordenadas; B e D inventam subordinação onde não há nenhuma oração dependente.", "k": "1 sujeito + 3 verbos = Simple Sentence (predicado composto). Para ser Compound, precisa haver 2+ orações independentes completas (cada uma com seu sujeito/verbo)."}, {"id": 176, "b": "sint", "p": null, "d": "hard", "s": "In 'The key to effective language learning lies in how learners process authentic input', the clause 'how learners process authentic input' is a", "o": ["noun clause functioning as the object of the preposition 'in'.", "adverbial clause of manner modifying 'lies'.", "adjective clause modifying 'learning'.", "independent clause introduced by a conjunctive adverb."], "a": 0, "e": "• Explicação detalhada: A preposição 'in' (regida pelo verbo 'lies in' = reside em) exige um complemento nominal (object of a preposition). Quem ocupa esse lugar é a oração substantiva interrogativa indireta 'how learners process authentic input' (substituível por 'this / that process').\n• Análise dos distratores: B confunde 'how' introduzindo objeto de preposição com adjunto adverbial de modo; C é falsa porque não modifica substantivo; D é falsa porque 'how' subordina a oração.", "k": "Preposição + wh-clause ('in how...', 'about what...', 'on whether...') = Noun Clause functioning as Object of a Preposition."}, {"id": 177, "b": "sint", "p": null, "d": "hard", "s": "Mark V for true and F for false regarding the sentence: 'Not only did the new curriculum foster critical thinking, but it also promoted digital literacy.'\n( ) Placing 'Not only' at the beginning of the clause triggers subject-auxiliary inversion ('did the new curriculum foster').\n( ) The sentence is classified as compound because the correlative conjunction 'not only... but also' links two independent clauses.\n( ) Removing 'did' and changing 'foster' to 'fostered' while keeping 'Not only' in initial position would remain grammatically standard.\nThe correct sequence, from top to bottom, is", "o": ["V, V, F.", "V, F, V.", "F, V, F.", "V, V, V."], "a": 0, "e": "• Explicação detalhada: (V) Expressões negativas ou restritivas no início da oração (*Not only, Never, Seldom, Rarely, Under no circumstances*) exigem inversão sujeito-auxiliar obrigatória ('did + sujeito + verbo base'). (V) 'Not only... but (also)' é conjunção coordenativa correlativa ligando duas orações independentes ('did the new curriculum foster...' e 'it also promoted...'), formando um período **compound**. (F) Sem o auxiliar 'did', a inversão desapareceria, tornando a frase agramatical em inglês padrão.\n• Análise dos distratores: B nega que 'not only... but also' coordena orações independentes; C e D erram as regras de inversão negativa.", "k": "Advérbio negativo/restritivo no início da frase = inversão obrigatória (auxiliar + sujeito + verbo principal)."}, {"id": 178, "b": "sint", "p": null, "d": "hard", "s": "In 'The methodology by means of which the data were triangulated was praised by the reviewers', the relative clause 'by means of which the data were triangulated' is", "o": ["non-restrictive, because it contains a compound preposition.", "restrictive, with 'which' functioning as the object of the prepositional phrase 'by means of'.", "a noun clause functioning as the subject complement.", "an adverbial clause of instrument."], "a": 1, "e": "• Explicação detalhada: A oração restringe e especifica qual metodologia foi elogiada (não há vírgulas isolando-a, logo é **restrictive adjective clause**). Em registro formal, a preposição ('by means of') precede o pronome relativo ('which'), o qual atua como objeto da preposição ('the data were triangulated by means of the methodology').\n• Análise dos distratores: A erra ao associar preposição à classificação não restritiva (o critério é semântico e marcado por vírgulas); C e D confundem a natureza adjetiva da relativa.", "k": "Preposição + 'which'/'whom' (pied-piping) é marca típica de prosa acadêmica formal; sem vírgulas = oração adjetiva restritiva."}, {"id": 179, "b": "sint", "p": null, "d": "hard", "s": "Which of the following sentences is a compound-complex sentence?", "o": ["Although the exam was rigorous, most candidates completed it within the allotted time.", "The candidates studied the syllabus thoroughly, and they practiced with past papers every weekend.", "When the bell rang, the proctor collected the answer sheets, and the candidates left the room quietly.", "Despite facing severe budgetary limitations, the school renovated its library and expanded its computer lab."], "a": 2, "e": "• Explicação detalhada: Um período **compound-complex** exige **pelo menos 2 orações independentes** e **pelo menos 1 oração dependente**:\n- Na C: 'When the bell rang' (dependent adverbial clause of time) + 'the proctor collected the answer sheets' (independent clause 1) + ', and the candidates left the room quietly' (independent clause 2) → **Compound-complex**!\n• Análise dos distratores: A tem 1 dependente + 1 independente = **Complex**; B tem 2 independentes + 0 dependente = **Compound**; D tem apenas um sintagma preposicional ('Despite facing...') e 1 oração independente com predicado composto ('renovated... and expanded...') = **Simple**!", "k": "Receita CEV/UECE: 2+ independentes (ligadas por FANBOYS ou ';') + 1+ dependente (subordinada) = Compound-Complex."}, {"id": 180, "b": "sint", "p": null, "d": "hard", "s": "In 'Lest the students misunderstand the instructions, the teacher wrote the steps on the board', the subordinating conjunction 'Lest' introduces an adverbial clause of", "o": ["concession, meaning 'even though'.", "negative purpose / precaution, meaning 'for fear that / so that... not'.", "manner, meaning 'as if'.", "time, meaning 'until'."], "a": 1, "e": "• Explicação detalhada: 'Lest' é uma conjunção subordinativa formal que expressa **finalidade negativa / precaução** ('para que não' / 'com receio de que') e frequentemente seleciona o modo subjuntivo no verbo da oração subordinada ('Lest the students **misunderstand**...').\n• Análise dos distratores: A, C e D atribuem valores semânticos errados a 'lest'.", "k": "'Lest' = para que não / por receio de que (negative purpose) + verbo no subjuntivo (forma base)."}, {"id": 181, "b": "sint", "p": null, "d": "hard", "s": "Compare the infinitive and gerund complements in the pairs below and mark V for true and F for false.\n( ) 'She stopped smoking' means she quit the habit of smoking, whereas 'She stopped to smoke' means she paused another activity in order to smoke.\n( ) 'I regret informing you that your application was rejected' is the standard formal phrasing for delivering bad news.\n( ) 'He remembered locking the door' refers to a memory of a past action already completed.\nThe correct sequence, from top to bottom, is", "o": ["V, F, V.", "V, V, F.", "F, V, V.", "V, F, F."], "a": 0, "e": "• Explicação detalhada: (V) 'Stop + -ing' indica cessar a própria ação; 'stop + to-infinitive' indica parar algo com a finalidade de fazer outra coisa. (F) Para dar más notícias formalmente, o padrão é 'I regret **to inform** you...' (infinitivo); 'regret + -ing' significa arrepender-se de algo já feito no passado. (V) 'Remember + -ing' remete à lembrança de um ato passado (já trancou a porta), enquanto 'remember + to-infinitive' significa lembrar-se de cumprir uma obrigação futura.\n• Análise dos distratores: B e C erram o uso padrão de 'regret to inform'; D erra 'remember + -ing'.", "k": "Verbos com mudança de sentido (-ing vs. to-V): -ing olha para trás/ação em si (remember doing, regret doing, stop doing); to-V olha para frente/finalidade (remember to do, regret to inform, stop to do)."}, {"id": 182, "b": "sint", "p": null, "d": "hard", "s": "In 'The essays graded by the external committee showed remarkable coherence', the phrase 'graded by the external committee' is syntactically a", "o": ["reduced passive adjective clause modifying 'The essays'.", "finite main verb phrase in the Simple Past.", "reduced active adverbial clause of time.", "noun phrase functioning as an appositive."], "a": 0, "e": "• Explicação detalhada: A estrutura 'graded by the external committee' equivale à oração relativa plena na voz passiva '[which were] graded by the external committee'. Trata-se de uma **reduced relative (adjective) clause** com particípio passado ('graded'), modificando restritivamente o sujeito 'The essays' (cujo verbo principal é 'showed').\n• Análise dos distratores: B confunde particípio passivo com verbo finito principal (o verbo finito da oração é 'showed'); C erra a voz (é passiva, não ativa) e a função (é adjetiva, não adverbial); D confunde particípio com sintagma nominal.", "k": "Substantivo + particípio passado (-ed/-en) + 'by...' = Reduced Passive Adjective Clause (omissão de who/which/that + be)."}, {"id": 183, "b": "sint", "p": null, "d": "hard", "s": "Choose the sentence that demonstrates correct subject-verb agreement according to standard written English.", "o": ["The number of candidates applying for the English teaching post have increased substantially.", "Neither the principal nor the pedagogical coordinators was aware of the schedule change.", "A number of methodological workshops has been scheduled for the upcoming semester.", "The professor, along with her graduate research assistants, is presenting the paper today."], "a": 3, "e": "• Explicação detalhada: Expressões parentéticas ou aditivas introduzidas por *along with, as well as, together with, in addition to* não alteram o número do sujeito gramatical: como o núcleo do sujeito é singular ('The professor'), o verbo fica no singular ('is presenting').\n• Análise dos distratores: A erra porque 'The number of + plural' exige verbo no **singular** ('has increased'); B erra porque com 'Neither... nor', o verbo concorda com o núcleo mais próximo ('coordinators' → plural 'were aware'); C erra porque 'A number of + plural' (= muitos/vários) exige verbo no **plural** ('have been scheduled').", "k": "The number of = SINGULAR (o número). A number of = PLURAL (vários). Expressões com 'along with / as well as' não alteram a concordância do núcleo!"}, {"id": 184, "b": "sint", "p": null, "d": "hard", "s": "In 'What distinguishes proficient readers is their ability to infer implicit meanings', the clause 'What distinguishes proficient readers' is a", "o": ["free (nominal) relative clause functioning as the subject of the sentence.", "restrictive adjective clause modifying 'ability'.", "adverbial clause of degree.", "non-restrictive relative clause with an omitted antecedent."], "a": 0, "e": "• Explicação detalhada: Em inglês, 'what' (= 'that which' / 'the thing that') funde o antecedente e o pronome relativo em uma única palavra, formando uma **free relative clause** (ou nominal relative clause / noun clause), que aqui ocupa a posição inteira de **sujeito** do verbo 'is' (formando uma pseudo-cleft / wh-cleft sentence).\n• Análise dos distratores: B e D classificam-na erradamente como adjetiva (orações adjetivas modificam um substantivo expresso na oração principal; 'what' nunca tem antecedente expresso); C é semântica e sintaticamente falsa.", "k": "'What' = 'the thing that' (relativo sem antecedente expresso) → introduz sempre uma Noun Clause (Free Relative Clause), jamais uma Adjective Clause!"}, {"id": 185, "b": "sint", "p": null, "d": "hard", "s": "In 'It was through collaborative peer feedback that the students refined their argumentative essays', the syntactic construction 'It was... that...' is known as a(n)", "o": ["extraposed subject clause.", "it-cleft sentence used for constituent focus.", "existential clause.", "passive causative construction."], "a": 1, "e": "• Explicação detalhada: A estrutura `It + be + elemento focalizado + that/who...` denomina-se **it-cleft sentence** (oração clivada). Ela divide uma oração simples ('The students refined their essays through collaborative peer feedback') em duas partes para dar destaque informativo ao constituinte focalizado ('through collaborative peer feedback').\n• Análise dos distratores: A ocorre quando uma oração substantiva vai para o fim da frase (ex.: 'It is obvious that she studied'); C usa 'There + be'; D usa 'have/get + objeto + particípio'.", "k": "It-cleft ('It was X that Y'): serve para focalizar X. Diferente de extraposição ('It is true that Y'), onde 'that Y' é o sujeito real deslocado."}, {"id": 186, "b": "sint", "p": null, "d": "hard", "s": "Analyze the sentence: 'Much as I admire her dedication, I cannot endorse her assessment methods.' The clause 'Much as I admire her dedication' is an adverbial clause of", "o": ["comparison.", "cause.", "concession.", "result."], "a": 2, "e": "• Explicação detalhada: A estrutura `Much as + sujeito + verbo` (ou `Adjetivo/Advérbio + as/though + sujeito + verbo`, ex.: *Tired though she was...*) é uma construção formal e idiomática que expressa **concessão** (= 'Although I admire her dedication very much...').\n• Análise dos distratores: A confunde 'as' com comparativo de igualdade; B confunde 'as' concessivo invertido com 'as' causal ('since/because'); D não tem relação semântica.", "k": "'Much as + S + V' e 'Adj + as/though + S + V' ('Hard as he tried...') = oração adverbial de CONCESSÃO (= although)."}, {"id": 187, "b": "sint", "p": null, "d": "hard", "s": "In 'She spoke quietly so that nobody in the adjacent room would overhear the conversation', the subordinate clause is an adverbial clause of", "o": ["result, because it contains a modal verb.", "purpose, indicated by 'so that' followed by a modal auxiliary.", "manner, modifying the adverb 'quietly'.", "concession, contrasting two actions."], "a": 1, "e": "• Explicação detalhada: 'So that' seguido de verbos modais como *can, could, will, would, may, might* introduz uma **adverbial clause of purpose** (finalidade: 'a fim de que / para que ninguém ouvisse').\n• Análise dos distratores: A confunde finalidade ('so that + modal') com consequência/resultado ('so + adjetivo/advérbio + that', ex.: *She spoke so quietly that nobody heard her*); C e D erram a classificação circunstancial.", "k": "Diferença vital na sintaxe: 'so that + modal' = FINALIDADE (purpose). 'so + adj/adv + that' = RESULTADO/CONSEQUÊNCIA (result)."}, {"id": 188, "b": "sint", "p": null, "d": "hard", "s": "Which option corrects the faulty parallelism in the sentence: 'Effective teachers are expected to design engaging tasks, providing timely feedback, and that they evaluate students fairly'?", "o": ["Effective teachers are expected to design engaging tasks, provide timely feedback, and evaluate students fairly.", "Effective teachers are expected designing engaging tasks, providing timely feedback, and evaluating students fairly.", "Effective teachers are expected to design engaging tasks, to provide timely feedback, and evaluating students fairly.", "Effective teachers are expected that they design engaging tasks, providing timely feedback, and to evaluate students fairly."], "a": 0, "e": "• Explicação detalhada: O paralelismo sintático exige que elementos coordenados em uma série compartilhem a mesma forma gramatical. Como 'are expected' seleciona infinitivo ('to design'), os demais itens coordenados devem manter o infinitivo paralelo: '(to) design..., (to) provide..., and (to) evaluate...'.\n• Análise dos distratores: B usa gerúndio após 'expected' (agramatical); C mistura dois infinitivos com um gerúndio ('evaluating'); D mistura oração com 'that', gerúndio e infinitivo.", "k": "Paralelismo sintático: itens ligados por 'and / or / but' devem pertencer à mesma categoria gramatical (infinitivo + infinitivo + infinitivo)."}, {"id": 189, "b": "sint", "p": null, "d": "hard", "s": "In 'The assumption that bilingualism confuses young children has been thoroughly debunked by neurolinguistics', the underlined noun clause 'that bilingualism confuses young children' functions as", "o": ["direct object of 'debunked'.", "subject complement.", "appositive to the noun 'assumption'.", "object of a preposition."], "a": 2, "e": "• Explicação detalhada: A oração 'that bilingualism confuses young children' especifica o conteúdo do substantivo abstrato 'The assumption' (a suposição de que o bilinguismo confunde crianças pequenas). Como não há lacuna sintática dentro da oração subordinada ('bilingualism' = sujeito, 'confuses' = VTD, 'young children' = OD), 'that' é conjunção integrante e a oração é **appositive noun clause**.\n• Análise dos distratores: A é falsa porque 'debunked' é o verbo da oração principal na voz passiva; B exigiria verbo de ligação ('The assumption is that...'); D exigiria preposição.", "k": "Substantivo abstrato (fact, idea, assumption, belief, claim, rumor) + that + oração completa = Appositive Noun Clause."}, {"id": 190, "b": "sint", "p": null, "d": "hard", "s": "Choose the sentence in which 'whom' is used correctly according to formal prescriptive syntax.", "o": ["The candidate whom scored highest on the written test will be appointed first.", "The external examiners, w
