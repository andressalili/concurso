<script>
const PD={"T1": ["[1] Many adult learners believe that progress requires long hours of study. [2] However, research on habit formation suggests that ten focused minutes a day might be more effective than a weekly marathon. [3] Short sessions reduce fatigue and make it easier to return to the material the next morning. [4] Moreover, learners who review vocabulary shortly before sleeping tend to remember more words than those who study earlier in the day. [5] Teachers can encourage this routine by assigning brief tasks, such as recording a one-minute voice message, instead of lengthy worksheets. [6] Still, small steps are not magic: without feedback, learners may repeat their mistakes for months."], "T2": ["[1] Since smartphones became common, people have been reading more short texts than ever. [2] Some researchers claim that this habit has changed the way readers pay attention, while others argue that long reading has simply moved to new formats, such as audiobooks. [3] A recent school survey, which was carried out in 2024, showed that students who read paper books at least twice a week scored higher in comprehension tests. [4] Had these students been asked about their preferences, many would probably have said they enjoy both formats. [5] The study's authors warn that the results should not be generalized, because the sample was small. [6] Whatever the format, readers need to infer the author's intention and not only locate facts."], "T3": ["[1] At Escola Maria Lima, in Sobral, students have created a vegetable garden that supplies part of the school lunch. [2] The project, which began as a science activity, now involves Portuguese, Math and English classes. [3] In English, learners write short recipes and label plants, so that vocabulary is learned through real tasks. [4] Last year, the garden produced nearly 300 kilos of vegetables, and visitors from nearby schools have asked to copy the idea. [5] Although the work is demanding, the students say they would not give it up. [6] The principal believes that the project shows how learning improves when subjects are connected."], "T4": ["[1] Digital tools have changed the way teenagers study English. [2] Apps, videos and online games offer immediate feedback, which keeps many learners motivated. [3] Nevertheless, teachers who rely only on technology may overlook the social side of language learning. [4] Speaking with classmates, for instance, requires negotiating meaning, something a program can hardly reproduce. [5] That is why a balanced plan should combine digital resources with real interaction. [6] If schools invest in training, teachers will be able to choose tools that serve their goals instead of the other way around."], "T5": ["[1] Notwithstanding the widespread enthusiasm surrounding communicative language teaching, classroom observations across public secondary schools reveal a persistent gap between curricular rhetoric and actual pedagogical practice.", "[2] Teachers frequently invoke large class sizes, scarce instructional time, and high-stakes university entrance examinations as structural constraints that compel them to prioritize explicit grammar drills over sustained oral interaction.", "[3] Yet applied linguists contend that treating form-focused instruction and communicative competence as mutually exclusive constitutes a false dichotomy.", "[4] When learners' attention is briefly drawn to linguistic features within meaningful, task-based contexts—a procedure termed 'focus on form' rather than isolated 'focus on forms'—grammatical accuracy develops alongside pragmatic fluency.", "[5] Were teacher-education programs to bridge theory and local classroom realities more effectively, practitioners might be less inclined to revert to mechanical memorization whenever institutional pressures mount."], "T6": ["[1] The notion of English as a Lingua Franca (ELF) has fundamentally unsettled traditional assumptions regarding linguistic ownership and pedagogical norms.", "[2] Whereas conventional EFL (English as a Foreign Language) paradigms measure learners' proficiency against an idealized native-speaker benchmark, ELF research foregrounds how multilingual speakers co-construct intelligibility in fluid, intercultural encounters.", "[3] Consequently, phonological or lexicogrammatical features that diverge from standard British or American varieties are no longer automatically pathologized as 'errors', provided that they do not impede mutual comprehension.", "[4] Critics, however, warn that an uncritical adoption of ELF principles could inadvertently deprive underserved public-school students of access to prestige registers required in academic and professional gatekeeping domains.", "[5] Navigating this tension demands a critical pedagogy that equips learners both to assert their own linguistic identities and to command standardized conventions whenever sociopolitical stakes so dictate."]};
const QUESTIONS=[{"id": 1, "b": "leitura", "p": "T1", "s": "The main idea of Text I is that", "o": ["long study hours are the only path to fluency.", "brief, regular practice combined with feedback can be effective.", "vocabulary must be studied exclusively before sleeping.", "worksheets are better than voice messages."], "a": 1, "e": "• Explicação detalhada: O texto contrasta a crença em longas horas de estudo com sessões curtas e diárias, e fecha dizendo que sem feedback há repetição de erros. A é a crença que o texto questiona; C exagera (\"exclusively\"); D inverte a sugestão da frase 5.\n• Por que a alternativa B está correta: \"brief, regular practice combined with feedback can be effective.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"long study hours are the only path to fluency.\"; C) \"vocabulary must be studied exclusively before sleeping.\"; D) \"worksheets are better than voice messages.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "a ideia central une o começo e o fim do texto; alternativa com only, exclusively ou always costuma estar errada. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 2, "b": "leitura", "p": "T1", "s": "In sentence [2], the modal \"might\" conveys the idea of", "o": ["certainty.", "possibility.", "obligation.", "permission."], "a": 1, "e": "• Explicação detalhada: Might expressa possibilidade fraca: dez minutos por dia \"podem ser\" mais eficazes. Certeza seria will ou must; obrigação, must/have to; permissão, may/can.\n• Por que a alternativa B está correta: \"possibility.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"certainty.\"; C) \"obligation.\"; D) \"permission.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "might ≈ may, só que mais incerto; é o modal que a prova de 2018 já cobrou em contexto. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 3, "b": "leitura", "p": "T1", "s": "The connector \"However\" (sentence [2]) introduces an idea of", "o": ["addition.", "contrast.", "consequence.", "example."], "a": 1, "e": "• Explicação detalhada: However opõe a frase 2 à crença da frase 1 (muitas horas versus dez minutos). Addition seria moreover; consequence, therefore; example, for instance.\n• Por que a alternativa B está correta: \"contrast.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"addition.\"; C) \"consequence.\"; D) \"example.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "decore os grupos: contraste (however, although, whereas, despite), adição (moreover, besides), consequência (therefore, thus). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 4, "b": "leitura", "p": "T1", "s": "Read the statements about Text I.\nI. Reviewing vocabulary shortly before sleeping may help retention.\nII. The author states that feedback is unnecessary when learners practice daily.\nIII. Teachers are advised to replace lengthy worksheets with brief tasks.\nIt is correct to say that", "o": ["I and II only are true.", "I and III only are true.", "II and III only are true.", "I, II and III are true."], "a": 1, "e": "• Explicação detalhada: I está na frase 4 e III na frase 5. II é falsa: a frase 6 diz o contrário, que sem feedback os erros se repetem.\n• Por que a alternativa B está correta: \"I and III only are true.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"I and II only are true.\"; C) \"II and III only are true.\"; D) \"I, II and III are true.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "em questões I, II, III, julgue cada afirmativa sozinha e depois elimine alternativas; uma afirmativa falsa certa já derruba duas opções. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 5, "b": "leitura", "p": "T1", "s": "Mark V for true and F for false about the comparative and superlative forms in Text I.\n( ) Sentence [2] contains a comparative of adjective.\n( ) Sentence [3] contains a comparative of adjective.\n( ) Sentence [5] contains a superlative of adjective.\nThe correct sequence, from top to bottom, is", "o": ["V, V, F.", "V, F, V.", "F, V, V.", "F, F, V."], "a": 0, "e": "• Explicação detalhada: [2] tem \"more effective than\" e [3] tem \"easier\" (easy + -er). [5] não tem superlativo: \"brief\" e \"lengthy\" são adjetivos simples.\n• Por que a alternativa A está correta: \"V, V, F.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"V, F, V.\"; C) \"F, V, V.\"; D) \"F, F, V.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "comparativo = -er/more + than ou adjetivo comparativo isolado (easier); superlativo precisa de the + -est/most. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 6, "b": "leitura", "p": "T2", "s": "In \"people have been reading\" (sentence [1]), the verb tense is", "o": ["Present Perfect.", "Present Perfect Continuous.", "Present Continuous.", "Past Perfect Continuous."], "a": 1, "e": "• Explicação detalhada: A forma have been + V-ing é Present Perfect Continuous: ação que começou no passado (since smartphones became common) e continua.\n• Por que a alternativa B está correta: \"Present Perfect Continuous.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Present Perfect.\"; C) \"Present Continuous.\"; D) \"Past Perfect Continuous.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "since + ponto de partida pede Present Perfect (ou Perfect Continuous), nunca Simple Past na oração principal. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 7, "b": "leitura", "p": "T2", "s": "The clause \"which was carried out in 2024\" (sentence [3]) is", "o": ["a noun clause.", "a non-restrictive adjective clause.", "an adverb clause of time.", "an independent clause."], "a": 1, "e": "• Explicação detalhada: Ela modifica survey, vem entre vírgulas e só acrescenta informação: oração adjetiva explicativa (não restritiva). Também está na voz passiva (was carried out).\n• Por que a alternativa B está correta: \"a non-restrictive adjective clause.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"a noun clause.\"; C) \"an adverb clause of time.\"; D) \"an independent clause.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "vírgula + which = explicativa; sem vírgula e com that possível = restritiva. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 8, "b": "leitura", "p": "T2", "s": "The structure \"Had these students been asked..., many would probably have said...\" (sentence [4]) expresses", "o": ["a real possibility in the future.", "an unreal, hypothetical situation in the past.", "a habit in the past.", "a general truth."], "a": 1, "e": "• Explicação detalhada: É o terceiro condicional, com inversão (Had + sujeito + particípio = If they had been asked). Fala de algo que não aconteceu: os alunos não foram consultados.\n• Por que a alternativa B está correta: \"an unreal, hypothetical situation in the past.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"a real possibility in the future.\"; C) \"a habit in the past.\"; D) \"a general truth.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "if + past perfect, would have + particípio = passado irreal; a inversão com had substitui o if. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 9, "b": "leitura", "p": "T2", "s": "According to Text II, it can be inferred that", "o": ["paper books are always superior to audiobooks.", "the survey results may not apply to every group of students.", "audiobooks reduce reading comprehension.", "the sample of the survey was large."], "a": 1, "e": "• Explicação detalhada: A frase 5 avisa que os resultados não devem ser generalizados porque a amostra era pequena. A usa always, C não aparece no texto e D contradiz a frase 5.\n• Por que a alternativa B está correta: \"the survey results may not apply to every group of students.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"paper books are always superior to audiobooks.\"; C) \"audiobooks reduce reading comprehension.\"; D) \"the sample of the survey was large.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "\"can be inferred\" aceita o que decorre do texto, nunca o que o texto contradiz ou o que ele não menciona. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 10, "b": "leitura", "p": "T2", "s": "To find quickly the year in which the survey was carried out, the best reading strategy is", "o": ["skimming.", "scanning.", "predicting.", "summarizing."], "a": 1, "e": "• Explicação detalhada: Scanning é a busca de um dado específico (ano, nome, número). Skimming serve para a ideia geral; predicting antecipa conteúdo; summarizing condensa.\n• Por que a alternativa B está correta: \"scanning.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"skimming.\"; C) \"predicting.\"; D) \"summarizing.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "dado pontual = scanning; ideia geral = skimming. São as cinco estratégias do edital. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 11, "b": "tempos", "p": null, "s": "By the time the teacher arrived, the students ______ the exercise.", "o": ["finished", "have finished", "had finished", "were finishing"], "a": 2, "e": "• Explicação detalhada: By the time + Simple Past na oração principal pede Past Perfect na outra: o exercício foi terminado antes da chegada.\n• Por que a alternativa C está correta: \"had finished\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"finished\"; B) \"have finished\"; D) \"were finishing\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "duas ações no passado, a anterior vai no had + particípio. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 12, "b": "tempos", "p": null, "s": "She ______ in Fortaleza since 2019.", "o": ["has lived", "lived", "is living", "had lived"], "a": 0, "e": "• Explicação detalhada: Since + ano marca o início de uma situação que continua: Present Perfect. Lived exigiria um período já encerrado e um marcador como in 2019.\n• Por que a alternativa A está correta: \"has lived\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"lived\"; C) \"is living\"; D) \"had lived\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "since = ponto de partida; for = duração; ambos com Present Perfect. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 13, "b": "tempos", "p": null, "s": "While I ______ the report, the power went out.", "o": ["wrote", "have written", "write", "was writing"], "a": 3, "e": "• Explicação detalhada: Ação em curso (Past Continuous) interrompida por outra, curta, no Simple Past (went out). While acompanha a ação longa.\n• Por que a alternativa D está correta: \"was writing\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"wrote\"; B) \"have written\"; C) \"write\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "longa = was/were + -ing; curta que interrompe = Simple Past. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 14, "b": "tempos", "p": null, "s": "Look at those clouds! It ______ rain.", "o": ["will", "rains", "is going to", "is raining to"], "a": 2, "e": "• Explicação detalhada: Há evidência presente (as nuvens): be going to. Will seria previsão sem evidência ou decisão na hora. B e D não formam o futuro.\n• Por que a alternativa C está correta: \"is going to\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"will\"; B) \"rains\"; D) \"is raining to\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "evidência visível ou plano já decidido = going to; decisão espontânea, promessa = will. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 15, "b": "tempos", "p": null, "s": "If it ______ tomorrow, we will cancel the trip.", "o": ["rains", "will rain", "rained", "is going to rain"], "a": 0, "e": "• Explicação detalhada: Em oração condicional (if) que fala do futuro, usa-se o Simple Present. Will fica na oração principal.\n• Por que a alternativa A está correta: \"rains\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"will rain\"; C) \"rained\"; D) \"is going to rain\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "depois de if, when, as soon as, before, until, nunca will. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 16, "b": "tempos", "p": null, "s": "By next July, she ______ English for ten years.", "o": ["will teach", "will be teaching", "is teaching", "will have been teaching"], "a": 3, "e": "• Explicação detalhada: By next July + for ten years indicam duração acumulada até um ponto no futuro: Future Perfect Continuous (will have been + -ing).\n• Por que a alternativa D está correta: \"will have been teaching\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"will teach\"; B) \"will be teaching\"; C) \"is teaching\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "by + data futura + for + período = will have been -ing. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 17, "b": "tempos", "p": null, "s": "Mark V for correct and F for incorrect.\n( ) She has gone there last year.\n( ) They have been waiting since 8 a.m.\n( ) I am knowing the answer.\nThe correct sequence, from top to bottom, is", "o": ["V, V, F.", "F, V, V.", "F, V, F.", "V, F, F."], "a": 2, "e": "• Explicação detalhada: A primeira é errada: last year é data passada específica e pede Simple Past (went). A segunda está correta. A terceira é errada: know é verbo de estado e não vai ao continuous.\n• Por que a alternativa C está correta: \"F, V, F.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"V, V, F.\"; B) \"F, V, V.\"; D) \"V, F, F.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "Present Perfect não convive com data específica no passado (yesterday, last year, in 1999). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 18, "b": "tempos", "p": null, "s": "This time tomorrow, I ______ to Recife.", "o": ["will be flying", "have flown", "was flying", "flew"], "a": 0, "e": "• Explicação detalhada: This time tomorrow descreve uma ação em andamento num momento futuro: Future Continuous (will be + -ing).\n• Por que a alternativa A está correta: \"will be flying\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"have flown\"; C) \"was flying\"; D) \"flew\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "momento futuro específico com ação em curso = will be -ing. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 19, "b": "passiva", "p": null, "s": "The passive form of \"The committee will announce the results next week\" is", "o": ["The results will announced next week by the committee.", "The results are announced next week by the committee.", "The results would be announced next week by the committee.", "The results will be announced next week by the committee."], "a": 3, "e": "• Explicação detalhada: Passiva = be no tempo da ativa + particípio. Futuro: will be announced. A omite o be; B muda para o presente; C muda para would.\n• Por que a alternativa D está correta: \"The results will be announced next week by the committee.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"The results will announced next week by the committee.\"; B) \"The results are announced next week by the committee.\"; C) \"The results would be announced next week by the committee.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "o tempo da passiva é o mesmo da ativa; só o auxiliar be muda de forma. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 20, "b": "passiva", "p": null, "s": "The bridge ______ in 1990.", "o": ["built", "is built", "was built", "has been built"], "a": 2, "e": "• Explicação detalhada: Ação concluída com data (in 1990): Simple Past passivo (was built). Has been built não aceita data específica.\n• Por que a alternativa C está correta: \"was built\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"built\"; B) \"is built\"; D) \"has been built\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "data específica no passado = Simple Past, também na passiva. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 21, "b": "passiva", "p": null, "s": "The indirect speech of \"I am tired,\" she said, is", "o": ["She said that I am tired.", "She said that she was tired.", "She said that she has been tired.", "She said that she would be tired."], "a": 1, "e": "• Explicação detalhada: Com verbo de relato no passado, o Present Simple recua para Past Simple e o pronome muda (I vira she). C usa Present Perfect, que não é o recuo; D usa would, que seria de will.\n• Por que a alternativa B está correta: \"She said that she was tired.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"She said that I am tired.\"; C) \"She said that she has been tired.\"; D) \"She said that she would be tired.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "recuo básico: present → past, past → past perfect, will → would, can → could. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 22, "b": "passiva", "p": null, "s": "\"Where do you live?\" he asked me. The correct indirect form is", "o": ["He asked me where did I live.", "He asked me where I do live.", "He asked me where I will live.", "He asked me where I lived."], "a": 3, "e": "• Explicação detalhada: Pergunta indireta tem ordem afirmativa, sem do/did e sem interrogação, com recuo do tempo (live → lived).\n• Por que a alternativa D está correta: \"He asked me where I lived.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"He asked me where did I live.\"; B) \"He asked me where I do live.\"; C) \"He asked me where I will live.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "em pergunta indireta, volte à ordem sujeito + verbo e dispense o auxiliar. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 23, "b": "passiva", "p": null, "s": "You ______ wear a seat belt; it is the law.", "o": ["must", "might", "can", "may"], "a": 0, "e": "• Explicação detalhada: Must expressa obrigação forte, aqui imposta por lei. Might e may são possibilidade; can é capacidade ou permissão.\n• Por que a alternativa A está correta: \"must\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"might\"; C) \"can\"; D) \"may\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "obrigação = must/have to; possibilidade = may/might. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 24, "b": "passiva", "p": null, "s": "You ______ bring your own pen; the school provides them.", "o": ["must not", "can't", "don't have to", "shouldn't"], "a": 2, "e": "• Explicação detalhada: Don't have to indica ausência de necessidade: não é preciso, mas é permitido. Must not seria proibição, que não combina com a escola fornecer as canetas.\n• Por que a alternativa C está correta: \"don't have to\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"must not\"; B) \"can't\"; D) \"shouldn't\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "mustn't = proibido; don't have to = não precisa. A banca troca os dois de propósito. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 25, "b": "passiva", "p": null, "s": "Mark V for correct and F for incorrect.\n( ) \"You mustn't park here\" expresses prohibition.\n( ) \"She might be at home\" expresses stronger certainty than \"She must be at home\".\n( ) \"Could you help me?\" is a polite request.\nThe correct sequence, from top to bottom, is", "o": ["V, F, V.", "F, V, F.", "V, V, F.", "F, F, V."], "a": 0, "e": "• Explicação detalhada: A primeira e a terceira estão certas. A segunda inverte: must (dedução) é mais forte que might (possibilidade fraca).\n• Por que a alternativa A está correta: \"V, F, V.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"F, V, F.\"; C) \"V, V, F.\"; D) \"F, F, V.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "escala de certeza: must (quase certo) > may > might/could (incerto). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 26, "b": "passiva", "p": null, "s": "The correct negative imperative is", "o": ["Not run in the corridor.", "Don't run in the corridor.", "Doesn't run in the corridor.", "You don't running in the corridor."], "a": 1, "e": "• Explicação detalhada: O imperativo negativo usa don't + verbo na forma base, sem sujeito. C usa a terceira pessoa; D mistura sujeito e -ing.\n• Por que a alternativa B está correta: \"Don't run in the corridor.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Not run in the corridor.\"; C) \"Doesn't run in the corridor.\"; D) \"You don't running in the corridor.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "imperativo = verbo base; negativo = don't + base; sugestão coletiva = let's + base. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 27, "b": "pron", "p": null, "s": "That bag isn't mine; it's ______.", "o": ["her", "she's", "herself", "hers"], "a": 3, "e": "• Explicação detalhada: O pronome possessivo hers substitui o substantivo (her bag). Her é adjetivo possessivo e precisa de substantivo depois; she's é she is; herself é reflexivo.\n• Por que a alternativa D está correta: \"hers\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"her\"; B) \"she's\"; C) \"herself\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "adjetivo possessivo + substantivo (my book); pronome possessivo sozinho (mine, hers, ours, theirs). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 28, "b": "pron", "p": null, "s": "Between you and ______, the test was easy.", "o": ["I", "my", "me", "mine"], "a": 2, "e": "• Explicação detalhada: Depois de preposição (between) usa-se pronome objeto: me. A forma between you and I é erro clássico.\n• Por que a alternativa C está correta: \"me\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"I\"; B) \"my\"; D) \"mine\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "preposição + pronome objeto (me, him, her, us, them). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 29, "b": "pron", "p": null, "s": "This exercise is ______ than the previous one.", "o": ["easier", "more easy", "the easiest", "easyer"], "a": 0, "e": "• Explicação detalhada: Adjetivo de duas sílabas terminado em -y troca o y por i e recebe -er: easier. More easy não existe e the easiest é superlativo.\n• Por que a alternativa A está correta: \"easier\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"more easy\"; C) \"the easiest\"; D) \"easyer\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "-y vira -ier/-iest (happy, happier); adjetivo longo usa more/most. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 30, "b": "pron", "p": null, "s": "She is the ______ student in the class.", "o": ["more intelligent", "intelligentest", "intelligenter", "most intelligent"], "a": 3, "e": "• Explicação detalhada: Com the e in the class, pede-se superlativo. Intelligent é longo, então forma the most intelligent.\n• Por que a alternativa D está correta: \"most intelligent\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"more intelligent\"; B) \"intelligentest\"; C) \"intelligenter\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "superlativo = the + -est / the most; more sozinho é comparativo. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 31, "b": "pron", "p": null, "s": "The exam starts ______ 8 a.m. ______ Monday.", "o": ["in / in", "on / at", "at / on", "at / in"], "a": 2, "e": "• Explicação detalhada: At para horas (at 8 a.m.); on para dias da semana e datas (on Monday). In serve a meses, anos e períodos.\n• Por que a alternativa C está correta: \"at / on\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"in / in\"; B) \"on / at\"; D) \"at / in\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "at = hora; on = dia/data; in = mês, ano, parte do dia. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 32, "b": "pron", "p": null, "s": "______ it was raining, we went to the beach.", "o": ["Although", "Despite", "Because", "Unless"], "a": 0, "e": "• Explicação detalhada: A ideia é de contraste e vem uma oração completa (it was raining): although. Despite exigiria substantivo ou -ing; because é causa; unless é condição negativa.\n• Por que a alternativa A está correta: \"Although\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"Despite\"; C) \"Because\"; D) \"Unless\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "although/though/even though + oração; despite/in spite of + substantivo ou -ing. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 33, "b": "pron", "p": null, "s": "The books of the students are on the table. Using the genitive case, the correct form is", "o": ["The student's books are on the table.", "The students's books are on the table.", "The studentses books are on the table.", "The students' books are on the table."], "a": 3, "e": "• Explicação detalhada: Plural regular recebe apenas o apóstrofo depois do s: students'. A usaria o singular; B e C são formas inexistentes.\n• Por que a alternativa D está correta: \"The students' books are on the table.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"The student's books are on the table.\"; B) \"The students's books are on the table.\"; C) \"The studentses books are on the table.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "singular 's (the teacher's); plural regular s' (the teachers'); plural irregular 's (children's). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 34, "b": "pron", "p": null, "s": "Mark V for correct and F for incorrect.\n( ) Despite the rain, we played football.\n( ) Despite it rained, we played football.\n( ) Unless you study, you will fail.\nThe correct sequence, from top to bottom, is", "o": ["V, V, F.", "F, V, V.", "V, F, V.", "F, F, V."], "a": 2, "e": "• Explicação detalhada: A primeira está correta (despite + substantivo). A segunda é errada (despite + oração). A terceira está correta e equivale a if you don't study.\n• Por que a alternativa C está correta: \"V, F, V.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"V, V, F.\"; B) \"F, V, V.\"; D) \"F, F, V.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "unless já carrega a negação; não use unless ... not. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 35, "b": "sint", "p": null, "s": "The sentence \"She studies hard, but her brother prefers to play\" is classified as", "o": ["compound.", "simple.", "complex.", "compound-complex."], "a": 0, "e": "• Explicação detalhada: São duas orações independentes ligadas por but, sem oração dependente: período composto (compound).\n• Por que a alternativa A está correta: \"compound.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"simple.\"; C) \"complex.\"; D) \"compound-complex.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "conte as independentes e procure conectivos subordinativos; sem subordinativo e com duas independentes = compound. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 36, "b": "sint", "p": null, "s": "\"Although she was tired, she finished the report.\" is a", "o": ["simple sentence.", "compound sentence.", "complex sentence.", "compound-complex sentence."], "a": 2, "e": "• Explicação detalhada: Há uma independente (she finished the report) e uma dependente adverbial concessiva (although she was tired): período complexo.\n• Por que a alternativa C está correta: \"complex sentence.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"simple sentence.\"; B) \"compound sentence.\"; D) \"compound-complex sentence.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "1 independente + 1 ou mais dependentes = complex. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 37, "b": "sint", "p": null, "s": "\"I know that he left because he was angry, but I didn't ask.\" is a", "o": ["simple sentence.", "compound sentence.", "complex sentence.", "compound-complex sentence."], "a": 3, "e": "• Explicação detalhada: Duas independentes (I know... e I didn't ask, ligadas por but) e duas dependentes (that he left, noun clause; because he was angry, adverb clause): compound-complex.\n• Por que a alternativa D está correta: \"compound-complex sentence.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"simple sentence.\"; B) \"compound sentence.\"; C) \"complex sentence.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "2 ou mais independentes + 1 ou mais dependentes = compound-complex. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 38, "b": "sint", "p": null, "s": "In \"What she said surprised everyone\", the clause \"What she said\" is", "o": ["an adjective clause.", "a noun clause functioning as subject.", "an adverb clause of manner.", "an adverb clause of reason."], "a": 1, "e": "• Explicação detalhada: A oração pode ser trocada por it/something e é o sujeito de surprised: substantiva subjetiva (noun clause). Não modifica substantivo nem dá circunstância.\n• Por que a alternativa B está correta: \"a noun clause functioning as subject.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"an adjective clause.\"; C) \"an adverb clause of manner.\"; D) \"an adverb clause of reason.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "teste de troca: se vira it/something, é noun clause. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 39, "b": "sint", "p": null, "s": "In \"I'll call you when I arrive\", the clause \"when I arrive\" is an adverb clause of", "o": ["place.", "reason.", "time.", "concession."], "a": 2, "e": "• Explicação detalhada: When introduz circunstância de tempo. Note também o Simple Present (arrive) com sentido de futuro.\n• Por que a alternativa C está correta: \"time.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"place.\"; B) \"reason.\"; D) \"concession.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "conectivos de tempo: when, while, before, after, until, as soon as. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 40, "b": "sint", "p": null, "s": "In \"The student who studied passed\", the clause \"who studied\" is", "o": ["a restrictive adjective clause.", "a non-restrictive adjective clause.", "a noun clause.", "an adverb clause."], "a": 0, "e": "• Explicação detalhada: Ela identifica qual aluno passou (sem vírgulas): oração adjetiva restritiva. Who poderia ser trocado por that.\n• Por que a alternativa A está correta: \"a restrictive adjective clause.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"a non-restrictive adjective clause.\"; C) \"a noun clause.\"; D) \"an adverb clause.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "sem vírgulas e identifica o substantivo = restritiva; entre vírgulas e acrescenta dado = explicativa. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 41, "b": "sint", "p": null, "s": "Consider the sentence \"My sister, who lives in Fortaleza, is a nurse\" and the statements.\nI. The clause \"who lives in Fortaleza\" is non-restrictive.\nII. \"That\" can replace \"who\" in this sentence.\nIII. The clause adds extra information about \"my sister\".\nIt is correct to say that", "o": ["I only is true.", "II only is true.", "I and II only are true.", "I and III only are true."], "a": 3, "e": "• Explicação detalhada: A oração é explicativa e traz informação extra. II é falsa: oração explicativa não aceita that.\n• Por que a alternativa D está correta: \"I and III only are true.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"I only is true.\"; B) \"II only is true.\"; C) \"I and II only are true.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "that só em adjetiva restritiva; em explicativa, use who/which. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 42, "b": "sint", "p": null, "s": "She asked ______ he had finished the project.", "o": ["while", "whether", "during", "although"], "a": 1, "e": "• Explicação detalhada: Pergunta sim/não em discurso indireto é introduzida por whether ou if e forma uma oração substantiva objetiva.\n• Por que a alternativa B está correta: \"whether\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"while\"; C) \"during\"; D) \"although\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "whether/if = \"se\"; while, although são conectivos adverbiais e during é preposição. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 43, "b": "ensino", "p": null, "s": "Na concepção de escrita como processo no ensino de Língua Inglesa, a sequência das etapas é", "o": ["drafting, outlining, editing, revising, rewriting.", "outlining, revising, drafting, editing, rewriting.", "outlining, drafting, revising, editing, rewriting.", "editing, outlining, drafting, revising, rewriting."], "a": 2, "e": "• Explicação detalhada: Planeja-se (outlining), escreve-se a primeira versão (drafting), melhora-se conteúdo e organização (revising), corrige-se a forma (editing) e reescreve-se (rewriting).\n• Por que a alternativa C está correta: \"outlining, drafting, revising, editing, rewriting.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"drafting, outlining, editing, revising, rewriting.\"; B) \"outlining, revising, drafting, editing, rewriting.\"; D) \"editing, outlining, drafting, revising, rewriting.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "revising cuida de ideias e organização; editing cuida de gramática, ortografia e pontuação. A ordem do edital é a ordem certa. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 44, "b": "ensino", "p": null, "s": "Entre as atividades abaixo, a que melhor corresponde à abordagem de escrita como processo é", "o": ["os estudantes escrevem uma primeira versão, recebem comentários dos colegas e do professor e reescrevem o texto.", "o professor propõe um tema e corrige a única versão entregue.", "os estudantes copiam um texto-modelo para fixar a estrutura.", "os estudantes memorizam uma redação para reproduzi-la na prova."], "a": 0, "e": "• Explicação detalhada: O processo prevê várias versões e feedback durante a escrita. B, C e D tratam o texto como produto final ou cópia.\n• Por que a alternativa A está correta: \"os estudantes escrevem uma primeira versão, recebem comentários dos colegas e do professor e reescrevem o texto.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"o professor propõe um tema e corrige a única versão entregue.\"; C) \"os estudantes copiam um texto-modelo para fixar a estrutura.\"; D) \"os estudantes memorizam uma redação para reproduzi-la na prova.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "processo = versões + feedback; produto = só o texto final. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 45, "b": "ensino", "p": null, "s": "Na perspectiva interativa e contextual da produção oral, a proposta mais adequada é", "o": ["repetir frases isoladas até a pronúncia ficar perfeita.", "memorizar diálogos palavra por palavra.", "corrigir todo erro no momento em que ocorre.", "realizar um role-play com finalidade comunicativa e interlocutor real."], "a": 3, "e": "• Explicação detalhada: A oralidade é construção de sentido entre interlocutores em um contexto. Repetição, memorização e correção constante interrompem a interação.\n• Por que a alternativa D está correta: \"realizar um role-play com finalidade comunicativa e interlocutor real.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"repetir frases isoladas até a pronúncia ficar perfeita.\"; B) \"memorizar diálogos palavra por palavra.\"; C) \"corrigir todo erro no momento em que ocorre.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "fala = interação com propósito e contexto, com foco em inteligibilidade e fluência. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 46, "b": "ensino", "p": null, "s": "Segundo a BNCC, tratar o inglês como língua franca implica, no ensino,", "o": ["tomar o sotaque do falante nativo como meta única.", "valorizar a inteligibilidade e a diversidade de usos, usuários e variedades da língua.", "ensinar somente a variedade britânica.", "evitar temas culturais para não desviar do conteúdo gramatical."], "a": 1, "e": "• Explicação detalhada: Língua franca desloca o modelo ideal do falante nativo e prioriza a comunicação inteligível entre falantes de origens diversas, com atenção à cultura e à identidade.\n• Por que a alternativa B está correta: \"valorizar a inteligibilidade e a diversidade de usos, usuários e variedades da língua.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"tomar o sotaque do falante nativo como meta única.\"; C) \"ensinar somente a variedade britânica.\"; D) \"evitar temas culturais para não desviar do conteúdo gramatical.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "língua franca = inteligibilidade + pluralidade de variedades; não existe \"inglês melhor\". (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 47, "b": "ensino", "p": null, "s": "O instrumento mais adequado para avaliar a habilidade de reading (receptive skill) é", "o": ["uma apresentação oral.", "uma redação em inglês.", "questões de compreensão sobre um texto, como certo/errado e associação de ideias.", "um role-play."], "a": 2, "e": "• Explicação detalhada: Habilidades receptivas (reading, listening) se avaliam pela compreensão. A, B e D exigem produção e, portanto, avaliariam speaking e writing.\n• Por que a alternativa C está correta: \"questões de compreensão sobre um texto, como certo/errado e associação de ideias.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"uma apresentação oral.\"; B) \"uma redação em inglês.\"; D) \"um role-play.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "receptivas = compreensão; produtivas = produção. Avalie o que você quer medir (validade). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 48, "b": "ensino", "p": null, "s": "Para avaliar a produção oral (speaking), o procedimento mais coerente é", "o": ["uma tarefa oral com rubrica analítica de fluência, interação, inteligibilidade, vocabulário e gramática.", "um teste de múltipla escolha sobre regras gramaticais.", "um ditado.", "a tradução de frases isoladas."], "a": 0, "e": "• Explicação detalhada: Habilidades produtivas pedem tarefas de produção e critérios claros, conhecidos pelo aluno. B, C e D não observam a fala.\n• Por que a alternativa A está correta: \"uma tarefa oral com rubrica analítica de fluência, interação, inteligibilidade, vocabulário e gramática.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"um teste de múltipla escolha sobre regras gramaticais.\"; C) \"um ditado.\"; D) \"a tradução de frases isoladas.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "produção = tarefa + rubrica; a rubrica analítica dá nota por critério. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 49, "b": "ensino", "p": null, "s": "Leia as afirmativas sobre a abordagem indutiva no ensino de Língua Inglesa.\nI. O aluno observa exemplos contextualizados antes de a regra ser formulada.\nII. O professor apresenta a regra primeiro e o aluno apenas a aplica em exercícios.\nIII. A abordagem favorece a reflexão sobre a língua em uso.\nEstá correto o que se afirma em", "o": ["I apenas.", "II apenas.", "II e III apenas.", "I e III apenas."], "a": 3, "e": "• Explicação detalhada: I e III descrevem a indução: observar, notar regularidades, formular a regra e sistematizar. II descreve a abordagem dedutiva.\n• Por que a alternativa D está correta: \"I e III apenas.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"I apenas.\"; B) \"II apenas.\"; C) \"II e III apenas.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "indutiva = do exemplo para a regra; dedutiva = da regra para o exemplo. Releia o capítulo de Inglês do DCRC para o vocabulário exato. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 50, "b": "ensino", "p": null, "s": "Um exemplo de trabalho interdisciplinar em Língua Inglesa no Ensino Médio é", "o": ["repetir em inglês o conteúdo de Matemática sem planejamento conjunto.", "estudar uma lista isolada de vocabulário.", "um projeto em que os estudantes leem textos em inglês sobre mudanças climáticas, com Geografia e Biologia, e produzem um painel multissemiótico.", "aplicar uma prova de gramática no fim do bimestre."], "a": 2, "e": "• Explicação detalhada: Há integração de componentes, propósito comunicativo e produção de texto. A é repetição sem integração; B e D são atividades isoladas.\n• Por que a alternativa C está correta: \"um projeto em que os estudantes leem textos em inglês sobre mudanças climáticas, com Geografia e Biologia, e produzem um painel multissemiótico.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"repetir em inglês o conteúdo de Matemática sem planejamento conjunto.\"; B) \"estudar uma lista isolada de vocabulário.\"; D) \"aplicar uma prova de gramática no fim do bimestre.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "interdisciplinaridade = planejamento conjunto, tema comum e produto compartilhado. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 51, "b": "ensino", "p": null, "s": "Entre os textos abaixo, o que é multissemiótico é", "o": ["uma lista corrida de verbos irregulares.", "um infográfico que combina imagens, dados e texto verbal.", "uma regra gramatical impressa sem ilustração.", "um trecho de texto em um único bloco, sem elementos visuais."], "a": 1, "e": "• Explicação detalhada: Texto multissemiótico combina mais de uma linguagem (verbal, visual, sonora, gestual, digital). O infográfico une imagem, dado e escrita.\n• Por que a alternativa B está correta: \"um infográfico que combina imagens, dados e texto verbal.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"uma lista corrida de verbos irregulares.\"; C) \"uma regra gramatical impressa sem ilustração.\"; D) \"um trecho de texto em um único bloco, sem elementos visuais.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "exemplos: charge, meme, infográfico, vídeo, post, podcast, gráfico. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 52, "b": "ensino", "p": null, "s": "A habilidade EM13LGG403 da BNCC do Ensino Médio propõe", "o": ["fazer uso do inglês como língua de comunicação global, considerando a multiplicidade e a variedade de usos, usuários e funções da língua.", "memorizar tabelas de verbos e vocabulário.", "traduzir exclusivamente textos literários.", "trabalhar apenas a leitura de textos acadêmicos."], "a": 0, "e": "• Explicação detalhada: É a habilidade que nomeia o inglês como língua de comunicação global, ligada à ideia de língua franca.\n• Por que a alternativa A está correta: \"fazer uso do inglês como língua de comunicação global, considerando a multiplicidade e a variedade de usos, usuários e funções da língua.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"memorizar tabelas de verbos e vocabulário.\"; C) \"traduzir exclusivamente textos literários.\"; D) \"trabalhar apenas a leitura de textos acadêmicos.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "palavra-chave: comunicação global + multiplicidade de usos, usuários e funções. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 53, "b": "ensino", "p": null, "s": "A competência específica 4 de Linguagens e suas Tecnologias da BNCC (Ensino Médio) afirma que as línguas são", "o": ["sistemas fixos e uniformes.", "válidas somente na variedade padrão.", "fenômenos cujos erros devem ser eliminados.", "fenômenos (geo)políticos, históricos, sociais e culturais, variáveis, heterogêneos e sensíveis aos contextos de uso."], "a": 3, "e": "• Explicação detalhada: A competência 4 trata as línguas como fenômeno variável e heterogêneo, e pede o respeito às variedades linguísticas.\n• Por que a alternativa D está correta: \"fenômenos (geo)políticos, históricos, sociais e culturais, variáveis, heterogêneos e sensíveis aos contextos de uso.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"sistemas fixos e uniformes.\"; B) \"válidas somente na variedade padrão.\"; C) \"fenômenos cujos erros devem ser eliminados.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "competência 4 = línguas como fenômeno (geo)político, histórico, social e cultural; respeito às variedades. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 54, "b": "ensino", "p": null, "s": "Uma professora mostra o título e uma imagem de um texto e pede aos alunos que digam o que acham que será abordado. A estratégia de leitura trabalhada é", "o": ["scanning.", "summarizing.", "predicting.", "skimming."], "a": 2, "e": "• Explicação detalhada: Antecipar o conteúdo a partir de título, imagem e conhecimento prévio é predicting. Skimming seria passar os olhos pelo texto para a ideia geral; scanning, procurar um dado.\n• Por que a alternativa C está correta: \"predicting.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"scanning.\"; B) \"summarizing.\"; D) \"skimming.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "predicting acontece antes da leitura; summarizing depois. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 55, "b": "p1", "p": null, "s": "De acordo com a LDB, a participação das comunidades escolar e local em conselhos escolares ou equivalentes é instrumento de", "o": ["gestão democrática do ensino público.", "tendência pedagógica tecnicista.", "avaliação somativa.", "centralização curricular."], "a": 0, "e": "• Explicação detalhada: O art. 14 da LDB prevê, para a gestão democrática, a participação dos profissionais na elaboração do projeto pedagógico e das comunidades escolar e local nos conselhos.\n• Por que a alternativa A está correta: \"gestão democrática do ensino público.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"tendência pedagógica tecnicista.\"; C) \"avaliação somativa.\"; D) \"centralização curricular.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "gestão democrática = PPP coletivo + conselhos escolares. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 56, "b": "p1", "p": null, "s": "O conceito de zona de desenvolvimento proximal está associado a", "o": ["Skinner.", "Piaget.", "Ausubel.", "Vygotsky."], "a": 3, "e": "• Explicação detalhada: A ZDP é a distância entre o que o aluno faz sozinho e o que faz com ajuda de alguém mais experiente (mediação). Skinner é o reforço, Piaget é a equilibração e Ausubel é a aprendizagem significativa.\n• Por que a alternativa D está correta: \"Vygotsky.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Skinner.\"; B) \"Piaget.\"; C) \"Ausubel.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Vygotsky = mediação, linguagem e ZDP. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 57, "b": "p1", "p": null, "s": "O poder que permite à Administração aplicar sanções a servidores que cometem infração funcional é o poder", "o": ["hierárquico.", "disciplinar.", "de polícia.", "normativo."], "a": 1, "e": "• Explicação detalhada: O poder disciplinar apura e pune infrações de servidores e de quem tem vínculo com a Administração. O hierárquico organiza e controla; o de polícia limita direitos em prol da coletividade; o normativo edita atos gerais.\n• Por que a alternativa B está correta: \"disciplinar.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"hierárquico.\"; C) \"de polícia.\"; D) \"normativo.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "disciplinar = punir quem tem vínculo; polícia = limitar o particular. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 58, "b": "p1", "p": null, "s": "Assinale a alternativa em que o sinal de crase está empregado corretamente.", "o": ["Estamos dispostos à colaborar.", "Falei à ela ontem.", "Comprou o carro à prazo.", "Voltamos à escola depois da prova."], "a": 3, "e": "• Explicação detalhada: Voltar pede a e escola admite artigo: a + a = à. Não há crase antes de verbo (A), pronome pessoal (B) nem em a prazo (C).\n• Por que a alternativa D está correta: \"Voltamos à escola depois da prova.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Estamos dispostos à colaborar.\"; B) \"Falei à ela ontem.\"; C) \"Comprou o carro à prazo.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pe
