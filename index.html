gadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "teste: \"volto da escola\" confirma a crase. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 59, "b": "p1", "p": null, "s": "Assinale a frase correta quanto à concordância.", "o": ["Faz dez anos que ela leciona aqui.", "Fazem dez anos que ela leciona aqui.", "Haviam dez alunos na sala.", "Houveram problemas na prova."], "a": 0, "e": "• Explicação detalhada: Fazer indicando tempo e haver no sentido de existir são impessoais: ficam no singular. Logo, faz, havia e houve.\n• Por que a alternativa A está correta: \"Faz dez anos que ela leciona aqui.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"Fazem dez anos que ela leciona aqui.\"; C) \"Haviam dez alunos na sala.\"; D) \"Houveram problemas na prova.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "haver (existir) e fazer (tempo) = sempre singular. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 60, "b": "p1", "p": null, "s": "O Ideb é um indicador que", "o": ["mede apenas o desempenho dos estudantes.", "é calculado apenas pelas taxas de aprovação.", "combina o desempenho no Saeb e as taxas de aprovação.", "é anual e aplicado pela OCDE."], "a": 2, "e": "• Explicação detalhada: Ideb = N × P: média de desempenho padronizada (Saeb) multiplicada pelo indicador de rendimento (aprovação). É calculado a cada dois anos pelo Inep.\n• Por que a alternativa C está correta: \"combina o desempenho no Saeb e as taxas de aprovação.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"mede apenas o desempenho dos estudantes.\"; B) \"é calculado apenas pelas taxas de aprovação.\"; D) \"é anual e aplicado pela OCDE.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Ideb une aprendizagem e fluxo; reprovação alta derruba o índice. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 61, "b": "leitura", "p": "T3", "s": "The text suggests that the school garden project is an example of", "o": ["isolated memorization.", "interdisciplinary work.", "standardized testing.", "distance learning."], "a": 1, "e": "• Explicação detalhada: A frase [2] diz que o projeto envolve Portuguese, Math e English, e a frase [6] fecha dizendo que o aprendizado melhora quando as matérias são conectadas. Isso é interdisciplinaridade.\n• Por que a alternativa B está correta: \"interdisciplinary work.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"isolated memorization.\"; C) \"standardized testing.\"; D) \"distance learning.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "Na leitura, a última frase costuma resumir a tese do texto; confirme a ideia central nela. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 62, "b": "leitura", "p": "T3", "s": "In sentence [3], \"so that\" introduces an idea of", "o": ["cause.", "contrast.", "purpose.", "condition."], "a": 2, "e": "• Explicação detalhada: \"So that\" liga a ação (escrever receitas e rotular plantas) à finalidade (aprender vocabulário por tarefas reais). Cause seria because; contrast, but/although; condition, if/unless.\n• Por que a alternativa C está correta: \"purpose.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"cause.\"; B) \"contrast.\"; D) \"condition.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "so that / in order to = finalidade (para que). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 63, "b": "leitura", "p": "T3", "s": "In sentence [4], the word \"nearly\" is closest in meaning to", "o": ["exactly.", "hardly.", "more than.", "almost."], "a": 3, "e": "• Explicação detalhada: \"Nearly 300 kilos\" = quase 300 quilos. Hardly significa dificilmente/quase nada, outro sentido que engana quem confunde com \"quase\".\n• Por que a alternativa D está correta: \"almost.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"exactly.\"; B) \"hardly.\"; C) \"more than.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "nearly = almost; hardly = quase não. Pegadinha clássica de vocabulário. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 64, "b": "leitura", "p": "T3", "s": "In sentence [5], \"Although\" expresses an idea of", "o": ["concession.", "addition.", "result.", "time."], "a": 0, "e": "• Explicação detalhada: \"Although the work is demanding, the students would not give it up\": o trabalho é difícil, mas eles não desistem. Concessão é um tipo de contraste.\n• Por que a alternativa A está correta: \"concession.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"addition.\"; C) \"result.\"; D) \"time.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "although, though, even though = concessão (embora). Não leva but na mesma frase. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 65, "b": "tempos", "p": null, "s": "By the time we arrived at the cinema, the film ______.", "o": ["has started.", "started.", "had already started.", "was start."], "a": 2, "e": "• Explicação detalhada: A ação de começar é anterior a outra ação passada (we arrived). Isso pede Past Perfect: had + particípio. Has started é presente; was start não existe.\n• Por que a alternativa C está correta: \"had already started.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"has started.\"; B) \"started.\"; D) \"was start.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "by the time + simple past na outra oração → past perfect (had + particípio). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 66, "b": "tempos", "p": null, "s": "She ______ English for ten years and still takes classes every week.", "o": ["studies", "has been studying", "is studying", "studied"], "a": 1, "e": "• Explicação detalhada: A ação começou no passado, dura até agora e é indicada com for + duração. Present Perfect Continuous (has been + -ing) enfatiza a continuidade.\n• Por que a alternativa B está correta: \"has been studying\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"studies\"; C) \"is studying\"; D) \"studied\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "for + duração / since + ponto no tempo → present perfect (simple ou continuous). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 67, "b": "tempos", "p": null, "s": "This time tomorrow, we ______ on the beach.", "o": ["will be lying", "will lie", "are lying", "lay"], "a": 0, "e": "• Explicação detalhada: \"This time tomorrow\" marca uma ação em andamento num momento futuro: Future Continuous (will be + -ing). Will lie indicaria simples fato futuro, sem a ideia de ação em curso.\n• Por que a alternativa A está correta: \"will be lying\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"will lie\"; C) \"are lying\"; D) \"lay\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "Future Continuous = will be + -ing: o que estará acontecendo em certo momento futuro. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 68, "b": "tempos", "p": null, "s": "I ______ dinner when the phone rang.", "o": ["cooked", "cook", "have cooked", "was cooking"], "a": 3, "e": "• Explicação detalhada: Ação longa em andamento (Past Continuous) interrompida por ação curta (Simple Past: rang). A estrutura típica é was/were + -ing ... when + simple past.\n• Por que a alternativa D está correta: \"was cooking\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"cooked\"; B) \"cook\"; C) \"have cooked\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "Past Continuous = ação em andamento no passado; Simple Past interrompe. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 69, "b": "tempos", "p": null, "s": "If it rains tomorrow, we ______ at home.", "o": ["would stay", "stayed", "will stay", "had stayed"], "a": 2, "e": "• Explicação detalhada: Primeira condicional: if + presente, will + verbo. Fala de situação real e possível no futuro. Would stay seria a segunda condicional (hipótese).\n• Por que a alternativa C está correta: \"will stay\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"would stay\"; B) \"stayed\"; D) \"had stayed\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "1ª condicional: if + present, will. 2ª: if + past, would. 3ª: if + past perfect, would have. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 70, "b": "tempos", "p": null, "s": "Mark V for correct and F for incorrect.\n( ) He didn't went to school yesterday.\n( ) She has lived here since 2020.\n( ) Water boils at 100 °C is a general truth expressed in the Simple Present.\nThe correct sequence, from top to bottom, is", "o": ["V, V, F.", "F, F, V.", "F, V, V.", "V, F, F."], "a": 2, "e": "• Explicação detalhada: 1) F: depois de didn't o verbo volta ao infinitivo (go). 2) V: since + ponto no tempo com present perfect. 3) V: verdades gerais usam Simple Present.\n• Por que a alternativa C está correta: \"F, V, V.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"V, V, F.\"; B) \"F, F, V.\"; D) \"V, F, F.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "did/didn't/does/doesn't + verbo no infinitivo sem to: o auxiliar já carrega o tempo. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 71, "b": "tempos", "p": null, "s": "\"Why are your hands so dirty?\" \"I ______ in the garden.\"", "o": ["was work", "will work", "have been working", "am worked"], "a": 2, "e": "• Explicação detalhada: A ação recente, que acabou de terminar ou ainda deixa efeito visível (mãos sujas), pede Present Perfect Continuous. As demais formas estão mal construídas.\n• Por que a alternativa C está correta: \"have been working\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"was work\"; B) \"will work\"; D) \"am worked\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A banca CEV/UECE cobra o valor aspectual e temporal dos verbos em contexto (relação entre anterioridade, simultaneidade, duração até o presente/futuro e restrições de uso com marcadores temporais específicos).", "k": "present perfect continuous também explica a causa de um resultado presente. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 72, "b": "passiva", "p": null, "s": "Choose the passive form of \"The students wrote the report.\"", "o": ["The report is written by the students.", "The report was written by the students.", "The report has written by the students.", "The report were written by the students."], "a": 1, "e": "• Explicação detalhada: A ativa está no Simple Past, então a passiva usa was/were + particípio. Como report é singular: was written.\n• Por que a alternativa B está correta: \"The report was written by the students.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"The report is written by the students.\"; C) \"The report has written by the students.\"; D) \"The report were written by the students.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "Passiva: o verbo to be fica no mesmo tempo da ativa + particípio do verbo principal. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 73, "b": "passiva", "p": null, "s": "Choose the passive form of \"They have built a new school.\"", "o": ["A new school has been built.", "A new school have been built.", "A new school is built.", "A new school had built."], "a": 0, "e": "• Explicação detalhada: Present Perfect ativo (have built) vira has/have been + particípio. Com sujeito singular: has been built.\n• Por que a alternativa A está correta: \"A new school has been built.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"A new school have been built.\"; C) \"A new school is built.\"; D) \"A new school had built.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "Present perfect passivo = has/have been + particípio. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 74, "b": "passiva", "p": null, "s": "Report the sentence: He said, \"I am tired.\"", "o": ["He said that I am tired.", "He said that he will be tired.", "He said that he has been tired.", "He said that he was tired."], "a": 3, "e": "• Explicação detalhada: No discurso indireto com verbo de relato no passado, o presente recua para o passado (am → was) e o pronome muda (I → he).\n• Por que a alternativa D está correta: \"He said that he was tired.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"He said that I am tired.\"; B) \"He said that he will be tired.\"; C) \"He said that he has been tired.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "Backshift: present → past; past → past perfect; will → would; can → could; may → might. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 75, "b": "passiva", "p": null, "s": "Report the sentence: She asked me, \"Where do you live?\"", "o": ["She asked me where did I live.", "She asked me where do I live.", "She asked me where I lived.", "She asked me where had I lived."], "a": 2, "e": "• Explicação detalhada: Pergunta indireta mantém ordem afirmativa (sem do/did e sem inversão) e faz o recuo do tempo: live → lived.\n• Por que a alternativa C está correta: \"She asked me where I lived.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"She asked me where did I live.\"; B) \"She asked me where do I live.\"; D) \"She asked me where had I lived.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "Pergunta indireta: sem auxiliar, sem ponto de interrogação. Yes/no question usa if ou whether. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 76, "b": "passiva", "p": null, "s": "Visitors ______ take photos inside the museum. It is forbidden.", "o": ["mustn't", "don't have to", "needn't", "might not"], "a": 0, "e": "• Explicação detalhada: Mustn't expressa proibição. Don't have to e needn't indicam ausência de obrigação (é permitido, mas não necessário).\n• Por que a alternativa A está correta: \"mustn't\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"don't have to\"; C) \"needn't\"; D) \"might not\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "mustn't = proibido; don't have to = não precisa. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 77, "b": "passiva", "p": null, "s": "Students ______ wear a uniform on Fridays. It is optional.", "o": ["mustn't", "don't have to", "must", "can't"], "a": 1, "e": "• Explicação detalhada: \"It is optional\" indica que não há obrigação: don't have to. Mustn't e can't expressariam proibição.\n• Por que a alternativa B está correta: \"don't have to\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"mustn't\"; C) \"must\"; D) \"can't\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "A mesma pegadinha do mustn't/don't have to aparece com frequência em provas. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 78, "b": "passiva", "p": null, "s": "Which sentence is a correct negative imperative?", "o": ["Not open the door.", "Don't to open the door.", "Opens not the door.", "Don't open the door."], "a": 3, "e": "• Explicação detalhada: O imperativo negativo é don't + verbo no infinitivo sem to.\n• Por que a alternativa D está correta: \"Don't open the door.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Not open the door.\"; B) \"Don't to open the door.\"; C) \"Opens not the door.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Em voz passiva, discurso indireto e modais, a CEV/UECE testa a preservação exata do tempo verbal original, a ordem sintática direta nas perguntas indiretas e a diferença semântica fina entre obrigação, ausência de necessidade, proibição e dedução.", "k": "Imperativo: verbo na forma base, sem sujeito; negativo com don't. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 79, "b": "pron", "p": null, "s": "This book is ______; I bought it yesterday.", "o": ["mine", "my", "me", "myself"], "a": 0, "e": "• Explicação detalhada: Depois de is, sem substantivo seguinte, usa-se o pronome possessivo: mine. My é adjetivo possessivo e exige substantivo (my book).\n• Por que a alternativa A está correta: \"mine\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"my\"; C) \"me\"; D) \"myself\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "my + substantivo (adjetivo possessivo); mine sozinho (pronome possessivo). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 80, "b": "pron", "p": null, "s": "Ana and ______ went to the library.", "o": ["me", "my", "myself", "I"], "a": 3, "e": "• Explicação detalhada: Ana and I é o sujeito da oração, então usa-se o pronome sujeito I. Teste: retire Ana e fica \"I went\".\n• Por que a alternativa D está correta: \"I\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"me\"; B) \"my\"; C) \"myself\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "Teste do cortar: retire o outro nome e veja se soa certo (I went / me went). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 81, "b": "pron", "p": null, "s": "This exercise is ______ than the last one.", "o": ["more easy", "easier", "the easiest", "as easy"], "a": 1, "e": "• Explicação detalhada: Adjetivos de duas sílabas terminados em -y formam o comparativo com -ier (easy → easier). More easy está errado.\n• Por que a alternativa B está correta: \"easier\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"more easy\"; C) \"the easiest\"; D) \"as easy\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "-y vira -ier/-iest. Nunca more + -er (double comparative). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 82, "b": "pron", "p": null, "s": "It was ______ film I have ever seen.", "o": ["the worse", "worst", "the worst", "worse"], "a": 2, "e": "• Explicação detalhada: Superlativo de bad é the worst; exige artigo the. Worse é o comparativo.\n• Por que a alternativa C está correta: \"the worst\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"the worse\"; B) \"worst\"; D) \"worse\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "good-better-best; bad-worse-worst; far-farther(further)-farthest(furthest). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 83, "b": "pron", "p": null, "s": "The two teachers share an office. It is the ______ office.", "o": ["teacher's", "teachers", "teachers's", "teachers'"], "a": 3, "e": "• Explicação detalhada: Posse de substantivo plural regular: apenas o apóstrofo depois do s (teachers').\n• Por que a alternativa D está correta: \"teachers'\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"teacher's\"; B) \"teachers\"; C) \"teachers's\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "Singular 's; plural regular s'; plural irregular 's (children's). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 84, "b": "pron", "p": null, "s": "The class starts ______ 7 a.m. ______ Monday.", "o": ["in / at", "at / on", "on / at", "at / in"], "a": 1, "e": "• Explicação detalhada: At com hora, on com dias da semana e datas.\n• Por que a alternativa B está correta: \"at / on\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"in / at\"; C) \"on / at\"; D) \"at / in\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "AT hora; ON dia/data; IN mês/ano/estação/período do dia. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 85, "b": "pron", "p": null, "s": "______ he was tired, he finished the work.", "o": ["Although", "Because", "So", "Unless"], "a": 0, "e": "• Explicação detalhada: Há contraste: estava cansado, mas terminou. Although = embora.\n• Por que a alternativa A está correta: \"Although\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"Because\"; C) \"So\"; D) \"Unless\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "Contraste: although, though, even though, whereas, while, however, but, despite. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 86, "b": "pron", "p": null, "s": "Hurry up, ______ you will miss the bus.", "o": ["and", "but", "or", "so"], "a": 2, "e": "• Explicação detalhada: A ideia é alternativa/ameaça: se não se apressar, perderá o ônibus. Or = ou, caso contrário.\n• Por que a alternativa C está correta: \"or\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"and\"; B) \"but\"; D) \"so\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nas questões de morfossintaxe, a banca explora o contraste entre determinantes e pronomes substantivos, regência preposicional fixa, formação regular/irregular de graus de comparação e restrições sintáticas de conectivos.", "k": "imperativo + or + will: consequência negativa (senão). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 87, "b": "sint", "p": null, "s": "In \"I stayed home because it was raining\", the clause \"because it was raining\" is a(n)", "o": ["main clause.", "adverb clause.", "noun clause.", "adjective clause."], "a": 1, "e": "• Explicação detalhada: A oração dá a causa da ação principal e é introduzida por because; é uma adverb clause, que modifica o verbo.\n• Por que a alternativa B está correta: \"adverb clause.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"main clause.\"; C) \"noun clause.\"; D) \"adjective clause.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "Adverb clauses: tempo, causa, concessão, condição, finalidade. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 88, "b": "sint", "p": null, "s": "In \"I know that she is honest\", the clause \"that she is honest\" is a", "o": ["adverb clause.", "adjective clause.", "noun clause.", "independent clause."], "a": 2, "e": "• Explicação detalhada: A oração é o objeto de know: o que eu sei? Que ela é honesta. Isso é noun clause.\n• Por que a alternativa C está correta: \"noun clause.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"adverb clause.\"; B) \"adjective clause.\"; D) \"independent clause.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "Noun clause pode ser trocada por \"it\" ou \"something\" (I know it). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 89, "b": "sint", "p": null, "s": "In \"The book that I bought is great\", the clause \"that I bought\" is an", "o": ["adjective clause.", "noun clause.", "adverb clause.", "coordinate clause."], "a": 0, "e": "• Explicação detalhada: A oração modifica o substantivo book, como um adjetivo. É oração relativa (adjective clause).\n• Por que a alternativa A está correta: \"adjective clause.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"noun clause.\"; C) \"adverb clause.\"; D) \"coordinate clause.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "Adjective clause = oração relativa: who, whom, whose, which, that, where. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 90, "b": "sint", "p": null, "s": "\"I like tea, but my brother prefers coffee.\" This sentence is", "o": ["simple.", "compound.", "complex.", "compound-complex."], "a": 1, "e": "• Explicação detalhada: Duas orações independentes ligadas por but (coordenação): compound.\n• Por que a alternativa B está correta: \"compound.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"simple.\"; C) \"complex.\"; D) \"compound-complex.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "Coordenadas: and, but, or, so, for, nor, yet (FANBOYS). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 91, "b": "sint", "p": null, "s": "\"Although it was late, we kept studying, and the teacher stayed with us.\" This sentence is", "o": ["simple.", "compound.", "complex.", "compound-complex."], "a": 3, "e": "• Explicação detalhada: Tem duas orações independentes (we kept studying / the teacher stayed with us) e uma dependente (Although it was late): compound-complex.\n• Por que a alternativa D está correta: \"compound-complex.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"simple.\"; B) \"compound.\"; C) \"complex.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "compound-complex = 2+ independentes + 1+ dependente. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 92, "b": "sint", "p": null, "s": "Consider \"The student who studies hard passes the exam\" and the statements.\nI. \"who studies hard\" is an adverb clause.\nII. \"who studies hard\" is an adjective (relative) clause.\nIII. The clause identifies which student we mean.\nIt is correct to say that", "o": ["I and III only are true.", "II and III only are true.", "I and II only are true.", "I, II and III are true."], "a": 1, "e": "• Explicação detalhada: II é verdadeira: who studies hard modifica student. III também: sem vírgula, a oração é restritiva e identifica o estudante. I é falsa: não é adverbial.\n• Por que a alternativa B está correta: \"II and III only are true.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"I and III only are true.\"; C) \"I and II only are true.\"; D) \"I, II and III are true.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: A sintaxe é um dos pilares da CEV/UECE: identifique sempre a função sintática que a oração subordinada exerce no período (substantiva = sujeito/objeto/aposto; adjetiva = adjunto adnominal restritivo ou explicativo; adverbial = circunstância).", "k": "Sem vírgula = restritiva (identifica). Com vírgula = não restritiva (acrescenta informação). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 93, "b": "ensino", "p": null, "s": "In the process approach to writing, the stages listed in the edital follow this sequence:", "o": ["drafting, outlining, editing, revising, rewriting.", "revising, drafting, outlining, rewriting, editing.", "outlining, drafting, revising, editing, rewriting.", "editing, outlining, drafting, rewriting, revising."], "a": 2, "e": "• Explicação detalhada: A ordem do edital é outlining, drafting, revising, editing, rewriting. Na prática o processo é recursivo, mas a sequência é a que a banca usa.\n• Por que a alternativa C está correta: \"outlining, drafting, revising, editing, rewriting.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"drafting, outlining, editing, revising, rewriting.\"; B) \"revising, drafting, outlining, rewriting, editing.\"; D) \"editing, outlining, drafting, rewriting, revising.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Decore: O-D-R-E-R (planejar, escrever, rever, editar, reescrever). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 94, "b": "ensino", "p": null, "s": "Which task belongs to the editing stage of writing?", "o": ["Correcting spelling, punctuation and grammar.", "Reorganizing paragraphs.", "Adding new arguments.", "Choosing the topic."], "a": 0, "e": "• Explicação detalhada: Editing cuida da forma: ortografia, pontuação, gramática. Reorganizar e acrescentar ideias pertence ao revising; escolher o tema, ao outlining/planejamento.\n• Por que a alternativa A está correta: \"Correcting spelling, punctuation and grammar.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"Reorganizing paragraphs.\"; C) \"Adding new arguments.\"; D) \"Choosing the topic.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Revising = conteúdo e organização. Editing = forma e correção. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 95, "b": "ensino", "p": null, "s": "From an interactive and contextual perspective, the best speaking activity is", "o": ["repeating isolated sentences in chorus.", "a role-play of a real situation, such as ordering food or interviewing someone.", "translating lists of words.", "memorizing dialogues with no context."], "a": 1, "e": "• Explicação detalhada: A perspectiva interativa e contextual exige propósito comunicativo real, negociação de sentido e contexto. O role-play atende isso; as demais são mecânicas.\n• Por que a alternativa B está correta: \"a role-play of a real situation, such as ordering food or interviewing someone.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"repeating isolated sentences in chorus.\"; C) \"translating lists of words.\"; D) \"memorizing dialogues with no context.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Oralidade no ensino: uso em contexto, interação, propósito comunicativo. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 96, "b": "ensino", "p": null, "s": "Which task mainly assesses a receptive skill?", "o": ["Writing an email to a friend.", "Giving an oral presentation.", "Answering comprehension questions on a listening text.", "Acting in a role-play."], "a": 2, "e": "• Explicação detalhada: Receptive skills são reading e listening. Responder a perguntas sobre um áudio avalia compreensão; as outras tarefas exigem produção.\n• Por que a alternativa C está correta: \"Answering comprehension questions on a listening text.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Writing an email to a friend.\"; B) \"Giving an oral presentation.\"; D) \"Acting in a role-play.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Receptive = reading + listening. Productive = writing + speaking. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 97, "b": "ensino", "p": null, "s": "To assess productive skills fairly, the teacher should preferably", "o": ["use a rubric with clear criteria shared with the students.", "count only spelling mistakes.", "use only multiple-choice items.", "grade silence as a mistake."], "a": 0, "e": "• Explicação detalhada: Writing e speaking pedem critérios explícitos (cumprimento da tarefa, coerência, vocabulário, correção, fluência), de preferência compartilhados com os alunos e com feedback formativo.\n• Por que a alternativa A está correta: \"use a rubric with clear criteria shared with the students.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"count only spelling mistakes.\"; C) \"use only multiple-choice items.\"; D) \"grade silence as a mistake.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Produção avalia-se com rubrica/critérios; avaliação formativa dá feedback para melhorar. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 98, "b": "ensino", "p": null, "s": "Teaching English as a lingua franca, as proposed by the BNCC, implies", "o": ["adopting exclusively British English as the only model.", "translating every text word by word.", "excluding learners' own languages and varieties.", "valuing communication and intelligibility among speakers of different languages, without taking the native speaker as the only model."], "a": 3, "e": "• Explicação detalhada: Na perspectiva de língua franca, o inglês é meio de interação entre pessoas de diferentes origens. O foco é a comunicação e a inteligibilidade, com respeito às variedades.\n• Por que a alternativa D está correta: \"valuing communication and intelligibility among speakers of different languages, without taking the native speaker as the only model.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"adopting exclusively British English as the only model.\"; B) \"translating every text word by word.\"; C) \"excluding learners' own languages and varieties.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Língua franca: inglês como língua de comunicação global, sem modelo único de falante nativo. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 99, "b": "ensino", "p": null, "s": "In an inductive lesson on the Present Perfect, the most coherent sequence is", "o": ["dictate the rule for students to copy.", "present a table of rules and then examples.", "show a text with examples, have students notice the pattern, formulate the rule together and then practice.", "forbid questions during the explanation."], "a": 2, "e": "• Explicação detalhada: Na abordagem indutiva o aluno observa o uso em contexto, percebe regularidades e só então a regra é formulada. Os itens A, B e D descrevem ensino dedutivo ou expositivo.\n• Por que a alternativa C está correta: \"show a text with examples, have students notice the pattern, formulate the rule together and then practice.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"dictate the rule for students to copy.\"; B) \"present a table of rules and then examples.\"; D) \"forbid questions during the explanation.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Indutiva: exemplos → observação → regra. Dedutiva: regra → exemplos. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 100, "b": "ensino", "p": null, "s": "According to the BNCC for Ensino Médio, the curriculum is organized in", "o": ["isolated subjects only.", "formação geral básica and itinerários formativos.", "itinerários formativos only.", "a single common block with no areas."], "a": 1, "e": "• Explicação detalhada: O currículo do Ensino Médio combina a formação geral básica, organizada por áreas (Linguagens e suas Tecnologias inclui Língua Inglesa), com itinerários formativos.\n• Por que a alternativa B está correta: \"formação geral básica and itinerários formativos.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"isolated subjects only.\"; C) \"itinerários formativos only.\"; D) \"a single common block with no areas.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "EM = formação geral básica (BNCC, por áreas) + itinerários formativos. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 101, "b": "ensino", "p": null, "s": "Which of the following is a multisemiotic text?", "o": ["A list of isolated words.", "A poem presented only in verbal language.", "An infographic combining written text, images and a chart.", "An oral dictation with no visual support."], "a": 2, "e": "• Explicação detalhada: Textos multissemióticos combinam várias linguagens (verbal, visual, sonora, gráfica). O infográfico une texto, imagem e gráfico.\n• Por que a alternativa C está correta: \"An infographic combining written text, images and a chart.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"A list of isolated words.\"; B) \"A poem presented only in verbal language.\"; D) \"An oral dictation with no visual support.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Nos itens de metodologia e legislação curricular (BNCC e DCRC-CE), a banca contrapõe práticas situadas, interativas, multissemióticas e interdisciplinares ao ensino tradicional descontextualizado baseado em tradução literal ou repetição mecânica.", "k": "Multissemiótico: mais de um sistema de signos (meme, infográfico, vídeo, HQ, cartaz). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 102, "b": "leitura", "p": null, "s": "Looking for the date of an event on a poster is an example of", "o": ["scanning.", "skimming.", "predicting.", "inferring."], "a": 0, "e": "• Explicação detalhada: Procurar uma informação específica (data) é scanning. Skimming é ler rápido para pegar a ideia geral.\n• Por que a alternativa A está correta: \"scanning.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"skimming.\"; C) \"predicting.\"; D) \"inferring.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "Skimming = geral; scanning = específico; predicting = antecipar; inferring = entrelinhas; summarizing = síntese. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 103, "b": "p1", "p": null, "s": "[Educação] De acordo com a LDB (Lei 9.394/1996), a educação básica é formada por", "o": ["educação infantil e ensino fundamental, apenas.", "educação infantil, ensino fundamental e ensino médio.", "ensino fundamental, ensino médio e ensino superior.", "ensino médio e educação profissional, apenas."], "a": 1, "e": "• Explicação detalhada: O art. 21 da LDB define a educação básica como educação infantil, ensino fundamental e ensino médio. O ensino superior é outro nível.\n• Por que a alternativa B está correta: \"educação infantil, ensino fundamental e ensino médio.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"educação infantil e ensino fundamental, apenas.\"; C) \"ensino fundamental, ensino médio e ensino superior.\"; D) \"ensino médio e educação profissional, apenas.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Educação básica = EI + EF + EM. Educação superior fica fora. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 104, "b": "p1", "p": null, "s": "[Educação] A LDB estabelece, para o ensino fundamental e médio, carga horária mínima anual de", "o": ["600 horas em 160 dias letivos.", "1.000 horas em 180 dias.", "800 horas distribuídas em, no mínimo, 200 dias de efetivo trabalho escolar.", "400 horas em 100 dias."], "a": 2, "e": "• Explicação detalhada: O art. 24 fixa 800 horas distribuídas em pelo menos 200 dias de efetivo trabalho escolar (o ensino médio tem previsão de ampliação progressiva da carga).\n• Por que a alternativa C está correta: \"800 horas distribuídas em, no mínimo, 200 dias de efetivo trabalho escolar.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"600 horas em 160 dias letivos.\"; B) \"1.000 horas em 180 dias.\"; D) \"400 horas em 100 dias.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "800 horas / 200 dias: números que caem em prova. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 105, "b": "p1", "p": null, "s": "[Educação] A Lei 11.645/2008 ampliou a obrigatoriedade criada pela Lei 10.639/2003 ao incluir também a temática", "o": ["educação ambiental.", "educação financeira.", "educação especial.", "história e cultura indígena."], "a": 3, "e": "• Explicação detalhada: A Lei 10.639/2003 trata da história e cultura afro-brasileira e africana; a Lei 11.645/2008 acrescentou a indígena, no art. 26-A da LDB.\n• Por que a alternativa D está correta: \"história e cultura indígena.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"educação ambiental.\"; B) \"educação financeira.\"; C) \"educação especial.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "10.639 = afro. 11.645 = afro + indígena (o 6 e 45 ‘completam’ o quadro). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 106, "b": "p1", "p": null, "s": "[Educação] O documento que expressa a identidade da escola, seus objetivos e metas, construído de forma coletiva, é o", "o": ["diário de classe.", "censo escolar.", "Projeto Político-Pedagógico.", "boletim."], "a": 2, "e": "• Explicação detalhada: O PPP é a proposta pedagógica da escola, elaborada com participação da comunidade escolar, base da gestão democrática (LDB, arts. 12 e 14).\n• Por que a alternativa C está correta: \"Projeto Político-Pedagógico.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"diário de classe.\"; B) \"censo escolar.\"; D) \"boletim.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "PPP = construção coletiva; gestão democrática = participação da comunidade. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 107, "b": "p1", "p": null, "s": "[Educação] O conceito de zona de desenvolvimento proximal está associado a", "o": ["Vygotsky.", "Skinner.", "Piaget.", "Ausubel."], "a": 0, "e": "• Explicação detalhada: A ZDP é a distância entre o que o aluno faz sozinho e o que faz com ajuda de alguém mais experiente. É conceito de Vygotsky, do interacionismo.\n• Por que a alternativa A está correta: \"Vygotsky.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"Skinner.\"; C) \"Piaget.\"; D) \"Ausubel.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Vygotsky: ZDP e mediação. Piaget: estágios. Ausubel: significativa. Skinner: reforço. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 108, "b": "p1", "p": null, "s": "[Educação] Segundo Ausubel, ocorre aprendizagem significativa quando", "o": ["o conteúdo é memorizado literalmente.", "a aprendizagem acontece apenas por reforço positivo.", "o desenvolvimento depende só da maturação.", "o novo conteúdo se relaciona de modo substantivo e não arbitrário ao conhecimento prévio do aluno."], "a": 3, "e": "• Explicação detalhada: A aprendizagem significativa liga o novo ao que o aluno já sabe (subsunçores). Memorização literal é aprendizagem mecânica; reforço é Skinner.\n• Por que a alternativa D está correta: \"o novo conteúdo se relaciona de modo substantivo e não arbitrário ao conhecimento prévio do aluno.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"o conteúdo é memorizado literalmente.\"; B) \"a aprendizagem acontece apenas por reforço positivo.\"; C) \"o desenvolvimento depende só da maturação.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Significativa = conhecimento prévio + ancoragem. Mecânica = decorar. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 109, "b": "p1", "p": null, "s": "[Administração] São princípios expressos no art. 37, caput, da Constituição Federal:", "o": ["razoabilidade, proporcionalidade, legalidade, moralidade e publicidade.", "legalidade, impessoalidade, moralidade, publicidade e eficiência.", "legalidade, isonomia, moralidade, finalidade e eficiência.", "impessoalidade, motivação, publicidade, hierarquia e eficiência."], "a": 1, "e": "• Explicação detalhada: Os cinco princípios expressos são legalidade, impessoalidade, moralidade, publicidade e eficiência (LIMPE). Razoabilidade e motivação são implícitos ou legais.\n• Por que a alternativa B está correta: \"legalidade, impessoalidade, moralidade, publicidade e eficiência.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"razoabilidade, proporcionalidade, legalidade, moralidade e publicidade.\"; C) \"legalidade, isonomia, moralidade, finalidade e eficiência.\"; D) \"impessoalidade, motivação, publicidade, hierarquia e eficiência.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 110, "b": "p1", "p": null, "s": "[Administração] A reforma gerencial da Administração Pública brasileira foi impulsionada, em 1995, pelo", "o": ["DASP.", "Código Civil.", "Plano Diretor da Reforma do Aparelho do Estado.", "Estatuto da Terra."], "a": 2, "e": "• Explicação detalhada: O Plano Diretor da Reforma do Aparelho do Estado (1995) instituiu a administração gerencial, com foco em resultados e eficiência. O DASP (1936) é marco da fase burocrática.\n• Por que a alternativa C está correta: \"Plano Diretor da Reforma do Aparelho do Estado.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"DASP.\"; B) \"Código Civil.\"; D) \"Estatuto da Terra.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Patrimonialista → burocrática (DASP, 1936) → gerencial (1995). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 111, "b": "p1", "p": null, "s": "[Administração] A aplicação de penalidade a servidor por infração funcional é exercício do poder", "o": ["de polícia.", "normativo.", "vinculado.", "disciplinar."], "a": 3, "e": "• Explicação detalhada: O poder disciplinar permite à Administração punir os agentes ligados a ela por vínculo especial. O poder de polícia atinge particulares em geral.\n• Por que a alternativa D está correta: \"disciplinar.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"de polícia.\"; B) \"normativo.\"; C) \"vinculado.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Disciplinar pune quem tem vínculo com a Administração; de polícia limita liberdade e propriedade de particulares. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 112, "b": "p1", "p": null, "s": "[Português] Assinale a frase em que o emprego do sinal indicativo de crase está correto.", "o": ["Vou à escola de manhã.", "Entreguei o livro à ela.", "Ele começou à falar alto.", "Fui à Fortaleza ontem."], "a": 0, "e": "• Explicação detalhada: Teste: \"volto da escola\" → \"vou à escola\" (a + a). Não há crase antes de pronome pessoal (a ela), de verbo (a falar) nem, em regra, de nome de cidade sem artigo (a Fortaleza).\n• Por que a alternativa A está correta: \"Vou à escola de manhã.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"Entreguei o livro à ela.\"; C) \"Ele começou à falar alto.\"; D) \"Fui à Fortaleza ontem.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Crase = a (preposição) + a (artigo). Nunca antes de verbo ou pronome pessoal. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 113, "b": "p1", "p": null, "s": "[Português] Assinale a alternativa em que a concordância está correta: \"______ dois anos que não o vejo.\"", "o": ["Fazem", "Faz", "Houveram", "Fazem-se"], "a": 1, "e": "• Explicação detalhada: Fazer indicando tempo decorrido é impessoal e fica na 3ª pessoa do singular: Faz dois anos. O mesmo vale para haver com sentido de existir ou tempo.\n• Por que a alternativa B está correta: \"Faz\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"Fazem\"; C) \"Houveram\"; D) \"Fazem-se\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "haver (existir/tempo) e fazer (tempo) são impessoais: Há problemas; Faz dois anos. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 114, "b": "p1", "p": null, "s": "[Dados] O Ideb é calculado a partir de", "o": ["indicadores de fluxo (aprovação) e do desempenho dos estudantes no Saeb, em uma escala de 0 a 10.", "apenas da infraestrutura das escolas.", "somente do desempenho no Enem.", "do número de professores por aluno."], "a": 0, "e": "• Explicação detalhada: O Ideb combina proficiência (N) e rendimento/aprovação (P): Ideb = N × P, em escala de 0 a 10.\n• Por que a alternativa A está correta: \"indicadores de fluxo (aprovação) e do desempenho dos estudantes no Saeb, em uma escala de 0 a 10.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (B) \"apenas da infraestrutura das escolas.\"; C) \"somente do desempenho no Enem.\"; D) \"do número de professores por aluno.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Ideb = N × P. Fluxo + aprendizado. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 115, "b": "p1", "p": null, "s": "[Dados] O Pisa é uma avaliação", "o": ["nacional, aplicada anualmente a estudantes do 3º ano do ensino médio.", "aplicada apenas no Ceará.", "realizada pela OCDE, com estudantes de 15 anos, em ciclos trienais.", "aplicada para certificar a conclusão do ensino médio."], "a": 2, "e": "• Explicação detalhada: O Pisa é internacional, da OCDE, com estudantes de 15 anos, em ciclos de três anos. O Saeb é nacional (bienal) e o Spaece é cearense.\n• Por que a alternativa C está correta: \"realizada pela OCDE, com estudantes de 15 anos, em ciclos trienais.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"nacional, aplicada anualmente a estudantes do 3º ano do ensino médio.\"; B) \"aplicada apenas no Ceará.\"; D) \"aplicada para certificar a conclusão do ensino médio.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Pisa: OCDE, 15 anos, a cada 3 anos. Saeb: nacional, a cada 2. Spaece: Ceará. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 116, "b": "p1", "p": null, "s": "[Dados] Considere as notas 4, 6, 6, 8 e 10. A moda e a média são, respectivamente,", "o": ["moda 10 e média 6.", "moda 8 e média 6,8.", "moda 6 e média 6,8.", "moda 6 e média 7,5."], "a": 2, "e": "• Explicação detalhada: A moda é o valor que mais aparece (6). A média é (4+6+6+8+10)/5 = 34/5 = 6,8. A mediana também é 6.\n• Por que a alternativa C está correta: \"moda 6 e média 6,8.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"moda 10 e média 6.\"; B) \"moda 8 e média 6,8.\"; D) \"moda 6 e média 7,5.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na P1 (Conhecimentos Básicos), a CEV/UECE exige literalidade normativa (LDB, CF/88, Lei 9.784/99) e distinções conceituais precisas entre autores, poderes administrativos, princípios e indicadores educacionais.", "k": "Moda = mais frequente; mediana = valor central (ordene antes); média = soma ÷ quantidade. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 117, "b": "leitura", "p": "T4", "s": "The main idea of Text IV is that", "o": ["technology should replace teachers.", "digital tools help, but should be combined with real interaction.", "teenagers no longer need to speak English.", "online games harm language learning."], "a": 1, "e": "• Explicação detalhada: O texto reconhece o valor das ferramentas digitais (frases [1] e [2]), mas alerta para o lado social da aprendizagem e conclui na frase [5] que o plano deve combinar recursos digitais com interação real.\n• Por que a alternativa B está correta: \"digital tools help, but should be combined with real interaction.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"technology should replace teachers.\"; C) \"teenagers no longer need to speak English.\"; D) \"online games harm language learning.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "A frase com \"That is why\" ou \"Therefore\" costuma trazer a conclusão do autor. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 118, "b": "leitura", "p": "T4", "s": "In sentence [3], \"Nevertheless\" introduces an idea of", "o": ["result.", "example.", "contrast.", "time."], "a": 2, "e": "• Explicação detalhada: A frase [2] elogia as ferramentas; a [3] traz a ressalva. Nevertheless = no entanto, mesmo assim (contraste).\n• Por que a alternativa C está correta: \"contrast.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"result.\"; B) \"example.\"; D) \"time.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "Contraste: however, nevertheless, nonetheless, but, although. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 119, "b": "leitura", "p": "T4", "s": "In sentence [4], the word \"something\" refers to", "o": ["classmates.", "negotiating meaning.", "a program.", "feedback."], "a": 1, "e": "• Explicação detalhada: \"Something a program can hardly reproduce\" retoma a ideia que vem antes, negotiating meaning (negociar sentido). Em questões de referência, volte à expressão imediatamente anterior que faz sentido no lugar do pronome.\n• Por que a alternativa B está correta: \"negotiating meaning.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"classmates.\"; C) \"a program.\"; D) \"feedback.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "Pergunta de referência: substitua o pronome pelo candidato e veja se a frase continua lógica. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 120, "b": "leitura", "p": "T4", "s": "In sentence [4], \"hardly\" is closest in meaning to", "o": ["easily.", "barely.", "quickly.", "always."], "a": 1, "e": "• Explicação detalhada: A program can hardly reproduce = um programa mal consegue reproduzir. Hardly é advérbio de quase negação, não de dificuldade ao fazer algo \"duramente\".\n• Por que a alternativa B está correta: \"barely.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"easily.\"; C) \"quickly.\"; D) \"always.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "hardly ≈ barely ≈ scarcely (quase não). Não confunda com hard (difícil/duro). (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 121, "b": "leitura", "p": "T4", "s": "Mark V for true and F for false according to Text IV.\n( ) Sentence [2] says that digital tools provide immediate feedback.\n( ) Sentence [3] says that technology is useless for learners.\n( ) Sentence [6] contains a conditional sentence.\nThe correct sequence, from top to bottom, is", "o": ["F, V, F.", "V, V, F.", "V, F, V.", "F, F, V."], "a": 2, "e": "• Explicação detalhada: 1) V: frase [2]. 2) F: o texto fala em overlooking the social side se depender só de tecnologia, não que ela seja inútil. 3) V: \"If schools invest in training...\" é primeira condicional.\n• Por que a alternativa C está correta: \"V, F, V.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"F, V, F.\"; B) \"V, V, F.\"; D) \"F, F, V.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "Em V/F de texto, ache a frase correspondente e cuidado com exageros como useless. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 122, "b": "leitura", "p": "T4", "s": "From sentence [6], it can be inferred that", "o": ["teachers already choose tools freely.", "technology should define the lesson goals.", "schools should avoid investing in training.", "teacher training can help teachers adapt tools to their goals."], "a": 3, "e": "• Explicação detalhada: A condição \"If schools invest in training\" leva ao resultado \"teachers will be able to choose tools that serve their goals\". A inferência é que a formação ajuda o professor a usar a tecnologia a serviço dos objetivos.\n• Por que a alternativa D está correta: \"teacher training can help teachers adapt tools to their goals.\" corresponde exatamente à estrutura, interpretação ou norma exigida pelo comando.\n• Análise dos distratores: As demais opções (A) \"teachers already choose tools freely.\"; B) \"technology should define the lesson goals.\"; C) \"schools should avoid investing in training.\") contêm erro de estrutura gramatical, inversão conceitual, extrapolação textual ou troca de sentido típica de pegadinhas da banca.\n• Dica estratégica CEV/UECE: Na prova da CEV/UECE, questões de leitura exigem precisão semântica e atenção rigorosa aos limites do texto: alternativas com generalizações absolutas ('always', 'only', 'never', 'exclusively') ou inversões de causa/efeito são distratores clássicos.", "k": "Inferência = conclusão sustentada pelo texto, sem ele dizer literalmente. (Memorize: associe sempre a regra ao contraste com os distratores acima.)"}, {"id": 123, "b": "tempos", "p": null, "s": "\"L
