tica docente."}, {"id": 246, "b": "ensino", "p": null, "d": "hard", "s": "A perspectiva contemporânea de translinguagem (translanguaging) no ensino de Língua Inglesa, articulada às discussões de multiletramentos e língua franca, sustenta que", "o": ["o repertório linguístico completo do estudante (incluindo sua língua materna e variedades) funciona como recurso cognitivo e comunicativo integrado na construção de sentidos, superando a visão de compartimentos monolíngues estancos.", "o uso de qualquer palavra em português na aula de inglês constitui interferência patológica que deve ser punida.", "a tradução literal palavra por palavra é o único método válido para desenvolver fluência oral.", "o falante bilíngue possui dois sistemas linguísticos absolutamente isolados que nunca devem interagir."], "a": 0, "e": "• Explicação detalhada: Formulada por autores como Ofelia García e Li Wei, a **translinguagem (translanguaging)** concebe que sujeitos bilíngues/multilíngues mobilizam um **repertório linguístico e semiótico único e integrado** para negociar sentidos, aprender e agir no mundo, rompendo com a proibição rígida da língua materna (*English-only*) e valorizando práticas críticas de linguagem.\n• Análise dos distratores: B e D refletem o paradigma monolíngue tradicional; C reduz o conceito ao método gramática-tradução.", "k": "Translanguaging = mobilização estratégica e integrada de todo o repertório linguístico-semiótico do estudante para construir sentidos (supera o 'English-only' punitivo)."}, {"id": 247, "b": "ensino", "p": null, "d": "hard", "s": "De acordo com a Base Nacional Comum Curricular (BNCC) para a área de Linguagens e suas Tecnologias no Ensino Médio e com o Documento Curricular Referencial do Ceará (DCRC), analise as afirmativas sobre o componente Língua Inglesa:\nI. O ensino de Língua Inglesa no Ensino Médio integra a área de Linguagens e suas Tecnologias, articulando-se aos campos de atuação social (vida pessoal, práticas de estudo e pesquisa, jornalístico-midiático, atuação na vida pública e artístico-literário).\nII. A abordagem dos multiletramentos considera a multiplicidade cultural das populações e a multiplicidade semiótica de constituição dos textos por meio dos quais ela se informa e se comunica.\nIII. O DCRC-CE estabelece que o ensino de Língua Inglesa deve restringir-se à norma padrão britânica, desconsiderando variedades africanas, asiáticas ou latino-americanas do inglês.\nEstá correto o que se afirma em", "o": ["I e II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], "a": 0, "e": "• Explicação detalhada:\n- **Item I (Verdadeiro):** Na BNCC do Ensino Médio e no DCRC-CE, a área de Linguagens organiza as práticas em torno dos cinco campos de atuação social.\n- **Item II (Verdadeiro):** Definição exata de **multiletramentos** (Grupo de Nova Londres / Roxane Rojo), incorporada diretamente pela BNCC e pelo DCRC.\n- **Item III (Falso):** Contraria frontalmente a perspectiva de **Inglês como Língua Franca** (habilidade EM13LGG403), que valoriza a pluralidade de usos, usuários e variedades ao redor do mundo.\n• Análise dos distratores: B, C e D validam o item III, que reproduz a visão colonial de norma única nativa.", "k": "BNCC & DCRC-CE: 5 Campos de Atuação Social + Multiletramentos (pluralidade cultural + semiótica) + Inglês como Língua Franca (pluralidade de variedades)."}, {"id": 248, "b": "ensino", "p": null, "d": "hard", "s": "Na metodologia de ensino de leitura em Língua Inglesa, distinguem-se os modelos de processamento cognitivo bottom-up (ascendente), top-down (descendente) e interativo. O processamento top-down caracteriza-se por", "o": ["partir da decodificação isolada de grafemas, fonemas, morfemas e estruturas sintáticas antes de acessar o significado global.", "acionar o conhecimento prévio (esquemas cognitivos/schemata), o contexto situacional e as expectativas do leitor para formular hipóteses e construir sentidos do global para o específico.", "traduzir cada sentença do inglês para o português com auxílio exclusivo de dicionário bilíngue.", "memorizar listas de vocabulário descontextualizadas antes de qualquer contato com o texto."], "a": 1, "e": "• Explicação detalhada: Na psicolinguística da leitura (Goodman; Smith; Carrell):\n- **Bottom-up (ascendente):** parte dos dados linguísticos do texto (letras → palavras → frases → sentido).\n- **Top-down (descendente):** parte da mente do leitor (conhecimento de mundo, *schemata*, gênero textual, predições → confirmação no texto).\n- **Modelo Interativo (Rumelhart):** combina simultaneamente ambos os fluxos.\n• Análise dos distratores: A define o modelo *bottom-up*; C e D referem-se a práticas tradicionais de tradução e memorização.", "k": "Bottom-up = do texto para a mente (letras/palavras → sentido). Top-down = da mente para o texto (conhecimento prévio/schemata/predição → confirmação)."}, {"id": 249, "b": "ensino", "p": null, "d": "hard", "s": "Relacione os conceitos de avaliação da aprendizagem em Língua Inglesa às suas respectivas características:\n1. Validade (Validity)\n2. Confiabilidade (Reliability)\n3. Avaliação Formativa\n4. Avaliação Diagnóstica\n( ) Consistência dos resultados de um instrumento avaliativo quando aplicado em condições semelhantes ou corrigido por diferentes avaliadores mediante rubrica clara.\n( ) Grau em que o instrumento avalia efetivamente a habilidade ou construto que se propõe a medir (por exemplo, não avaliar fala apenas por meio de teste escrito de gramática).\n( ) Realizada ao longo do processo de ensino-aprendizagem para fornecer feedback contínuo e reorientar a prática docente.\n( ) Realizada no início de uma etapa ou unidade para identificar conhecimentos prévios, lacunas e necessidades dos estudantes.\nA sequência correta, de cima para baixo, é", "o": ["2, 1, 3, 4.", "1, 2, 4, 3.", "2, 3, 1, 4.", "4, 1, 3, 2."], "a": 0, "e": "• Explicação detalhada:\n- **2. Confiabilidade (Reliability):** estabilidade e consistência da medida (redução de subjetividade na correção).\n- **1. Validade (Validity):** adequação entre o instrumento e o construto avaliado (medir o que se pretende medir).\n- **3. Avaliação Formativa:** monitoramento contínuo com feedback regulador.\n- **4. Avaliação Diagnóstica:** mapeamento inicial de saberes e necessidades.\n• Análise dos distratores: B, C e D trocam validade por confiabilidade ou diagnóstica por formativa.", "k": "Validity = mede o que diz medir (construto). Reliability = consistência/estabilidade da nota (rubricas aumentam a confiabilidade!)."}, {"id": 250, "b": "ensino", "p": null, "d": "hard", "s": "Na concepção dialógica e sociointeracionista de gêneros discursivos (Bakhtin) adotada pelos documentos curriculares contemporâneos para o ensino de Língua Inglesa, todo gênero discursivo caracteriza-se pela articulação indissociável entre", "o": ["conteúdo temático, estilo e construção composicional, situados em uma esfera de atividade humana.", "listas de verbos irregulares, regras de pontuação e tradução literal.", "memorização de diálogos, repetição coral e ditado ortográfico.", "apenas a estrutura gramatical superficial, independentemente do interlocutor ou propósito comunicativo."], "a": 0, "e": "• Explicação detalhada: Segundo Mikhail Bakhtin (*Estética da Criação Verbal*), os gêneros do discurso são tipos relativamente estáveis de enunciados elaborados por cada esfera de utilização da língua e definidos pela tríade indissociável: **conteúdo temático** (o que pode ser dito), **estilo** (seleção lexical, fraseológica e gramatical) e **construção composicional** (estruturação e acabamento do texto).\n• Análise dos distratores: B, C e D reduzem o ensino da língua a formas descontextualizadas, ignorando a dimensão enunciativa e social.", "k": "Tríade bakhtiniana dos gêneros discursivos: Conteúdo temático + Estilo + Construção composicional (sempre situados em esferas sociais)."}];

 {c:"Prova",t:"Nunca deixe em branco",x:"São 80 questões, 4 alternativas (A–D), 1 ponto cada. O edital não prevê nota negativa. Chutar custa nada; em branco vale zero."},
 {c:"Prova",t:"Rasura e marca dupla zeram a questão",x:"No cartão-resposta, uma única marca por questão, com a caneta exigida no edital. Rasura, mais de uma marca ou branco = zero naquele item. Transcreva do caderno com calma."},
 {c:"Prova",t:"Notas mínimas eliminam",x:"Confira no edital os cortes por disciplina na P1 (3 em Educação, 3 em Administração, 3 em Português, 2 em Dados) e os totais (12 na P1, 20 na P2, 40 no geral). Passar na soma não salva quem zera uma disciplina."},
 {c:"Prova",t:"Prova prática: 25 min, 40 pontos",x:"Mínimo de 20 pontos. Avançam à prática os classificados até 1,7 × o número de vagas. Títulos valem até 20 pontos. A objetiva te coloca na fila; a prática define a posição."},
 {c:"Prova",t:"Confira o número do caderno",x:"A banca costuma aplicar versões com ordem diferente. Antes de transcrever, verifique que o caderno em mãos é o mesmo do seu gabarito rascunho."},
 {c:"Prova",t:"Estilo CEV/UECE",x:"Prova conteudista, enunciado direto. Esperar: afirmativas I, II, III com “é correto o que se afirma em”, V/F com “sequência correta, de cima para baixo”, modais em contexto, lacunas, textos com linhas numeradas."},
 {c:"Prova",t:"I, II, III: caça à afirmativa fácil",x:"Ache a afirmativa que você tem certeza (V ou F) e elimine alternativas. Uma única afirmativa falsa já derruba as opções que a contêm."},
 {c:"Prova",t:"V/F: anote ao lado, depois olhe as alternativas",x:"Marque V ou F em cada item antes de ver as letras. Veja se pedem correta ou incorreta (a pegadinha clássica é inverter)."},
 {c:"Prova",t:"Palavras absolutas acendem o alerta",x:"only, always, never, exclusively, all, nobody, somente, sempre, nunca: costumam indicar alternativa errada. É tendência, não regra; confirme no texto."},
 {c:"Prova",t:"Ordem de ataque",x:"Primeiro passe: o que você sabe em menos de 2 minutos (gramática curta, vocabulário, P1 direta). Textos longos depois. Marque no cartão a cada bloco para não deixar tudo para o fim. Confira o tempo total no cartão/edital."},
 /* ---- Verbos ---- */
 {c:"Tempos",t:"for × since",x:"<code>for</code> + duração (for ten years). <code>since</code> + ponto no tempo (since 2020). Ambos pedem Present Perfect (simple ou continuous)."},
 {c:"Tempos",t:"Present Perfect não aceita tempo terminado",x:"yesterday, last year, in 2010, two days ago → <b>Simple Past</b>. “She has gone there last year” está errada."},
 {c:"Tempos",t:"Stative verbs não vão no -ing",x:"know, like, love, want, need, believe, understand, belong, own: I <b>know</b> (não: I am knowing). Algumas aceitam -ing com outro sentido (I am having lunch)."},
 {c:"Tempos",t:"Past Perfect = passado do passado",x:"<code>had + particípio</code>. “By the time we arrived, the film <b>had started</b>.” Duas ações passadas: a primeira vai no Past Perfect."},
 {c:"Tempos",t:"Futuros: will × going to × continuous × perfect",x:"will = decisão na hora/previsão. going to = plano ou evidência. will be + -ing = em andamento num ponto futuro. will have + particípio = concluído até um ponto futuro. will have been + -ing = duração até esse ponto."},
 {c:"Tempos",t:"Condicionais",x:"1ª: if + present, <b>will</b>. 2ª: if + past, <b>would</b>. 3ª: if + past perfect, <b>would have</b> + particípio. Zero: if + present, present (verdade geral)."},
 {c:"Tempos",t:"Past Continuous × Simple Past",x:"Ação longa em curso = was/were + -ing; ação curta que interrompe = Simple Past. “I <b>was cooking</b> when the phone <b>rang</b>.”"},
 {c:"Tempos",t:"did + infinitivo",x:"Depois de did/didn't/does/doesn't/do/don't, o verbo volta ao infinitivo sem to: didn't <b>go</b>, doesn't <b>like</b>."},
 /* ---- Gramática ---- */
 {c:"Gramática",t:"Modais: escada de certeza",x:"must (dedução forte) > should/ought to > may > might/could (possibilidade fraca). <code>can't</code> = impossibilidade. <b>might</b> expressa possibilidade, nunca obrigação."},
 {c:"Gramática",t:"mustn't × don't have to",x:"<code>mustn't</code> = proibido. <code>don't have to</code> / <code>needn't</code> = não é obrigatório. Passado de must/have to: <b>had to</b>."},
 {c:"Gramática",t:"Modais não conjugam",x:"Sem -s na 3ª pessoa, sem to depois, sem do-support: <b>She can swim</b>, não “she cans to swim”. Negativa: can't, shouldn't, mustn't. Pergunta: inversão (Can she...?)."},
 {c:"Gramática",t:"Passiva em 10 segundos",x:"Objeto vira sujeito + <code>be</code> no mesmo tempo da ativa + particípio. Present perfect: has/have been + pp. Com modal: modal + be + pp (must be done). By + agente é opcional."},
 {c:"Gramática",t:"Discurso indireto: recuo de tempo",x:"present → past; past → past perfect; will → would; can → could; may → might; must → had to. Marcadores: now → then; today → that day; tomorrow → the next day; yesterday → the day before; here → there; this → that."},
 {c:"Gramática",t:"Pergunta indireta",x:"Ordem de afirmação, sem do/did: “She asked where I <b>lived</b>.” Yes/no question: <b>if</b> ou <b>whether</b>."},
 {c:"Gramática",t:"my × mine",x:"<b>my</b> book (adjetivo possessivo, antes do substantivo). The book is <b>mine</b> (pronome possessivo, sozinho). a friend of mine. Sujeito: I/you/he/she/it/we/they. Objeto: me/you/him/her/it/us/them."},
 {c:"Gramática",t:"Comparativo e superlativo",x:"1 sílaba: -er/-est. Termina em -y: -ier/-iest. 2+ sílabas: more/most. Irregulares: good-better-best, bad-worse-worst, far-farther(further)-farthest(furthest). Nunca “more easier”."},
 {c:"Gramática",t:"Genitivo (’s)",x:"Singular: the teacher<b>’s</b>. Plural regular: the teachers<b>’</b>. Plural irregular: the children<b>’s</b>. Coisas: the leg <b>of</b> the table."},
 {c:"Gramática",t:"Conjunções por função",x:"Contraste: but, however, although, though, even though, whereas, while, despite/in spite of. Causa: because, since, as. Consequência: so, therefore, thus. Adição: moreover, besides, furthermore. Condição: if, unless (= if not). Finalidade: so that, in order to."},
 {c:"Gramática",t:"Despite + substantivo/-ing",x:"“Despite the rain” e “Despite raining” estão certas; “Despite it rained” está errada. Para ter oração depois: despite <b>the fact that</b> it rained ou although it rained."},
 {c:"Gramática",t:"Preposições de tempo",x:"<b>at</b> hora (at 7 a.m., at night). <b>on</b> dia/data (on Monday, on May 3rd). <b>in</b> mês/ano/estação/parte do dia (in March, in 2026, in the morning)."},
 /* ---- Sintaxe ---- */
 {c:"Sintaxe",t:"Três tipos de oração dependente",x:"<b>Noun clause</b>: faz papel de substantivo (I know <u>that she is honest</u>; whether, wh-). <b>Adjective clause</b>: relativa (who, which, that, whose). <b>Adverb clause</b>: tempo, causa, concessão, condição, finalidade (because, although, when, if, so that)."},
 {c:"Sintaxe",t:"Restritiva × não restritiva",x:"Sem vírgula = restritiva: identifica (The student who studies hard...). Com vírgula = não restritiva: informação extra (My sister, who lives in Fortaleza,...). Em não restritiva <b>that não entra</b>."},
 {c:"Sintaxe",t:"Quatro tipos de período",x:"<b>Simple</b>: 1 independente. <b>Compound</b>: 2+ independentes (and, but, or, so). <b>Complex</b>: 1 independente + 1+ dependente. <b>Compound-complex</b>: 2+ independentes + 1+ dependente."},
 /* ---- Leitura ---- */
 {c:"Leitura",t:"Cinco estratégias",x:"<b>Skimming</b> ideia geral. <b>Scanning</b> informação específica. <b>Predicting</b> antecipar por título e imagens. <b>Inferring</b> o que está nas entrelinhas. <b>Summarizing</b> síntese."},
 {c:"Leitura",t:"Leia as perguntas antes do texto",x:"Em textos com linhas numeradas, localize a frase citada e leia ao redor. “According to the text” = literal. “It can be inferred” = inferência. “Refers to” = volte à frase anterior."},
 {c:"Leitura",t:"Ideia central",x:"Costuma aparecer no começo e no fim. Alternativa com only, always, exclusively raramente é a ideia principal."},
 {c:"Leitura",t:"Falsos cognatos que caem",x:"actually = na verdade (não: atualmente). pretend = fingir. push = empurrar. library = biblioteca. college = faculdade. parents = pais (não: parentes). realize = perceber. attend = comparecer. resume = retomar. nearly = quase; hardly = quase não."},
 /* ---- Ensino ---- */
 {c:"Ensino",t:"Escrita como processo",x:"Outlining → Drafting → Revising → Editing → Rewriting. <b>Revising</b> = conteúdo e organização. <b>Editing</b> = forma (gramática, ortografia, pontuação). Processo recursivo, com feedback."},
 {c:"Ensino",t:"Oralidade interativa e contextual",x:"Falar para um propósito real, com interlocutor e negociação de sentido (role-play, entrevista, debate). Repetição mecânica e frases soltas não são o foco."},
 {c:"Ensino",t:"Receptive × productive",x:"Receptive: reading e listening. Productive: writing e speaking. Avaliação: critérios claros (rubrica), tarefas contextualizadas, feedback formativo."},
 {c:"Ensino",t:"Língua franca",x:"Inglês como língua de comunicação entre falantes de línguas diferentes. Prioriza inteligibilidade e uso, valoriza variedades, não toma o falante nativo como único modelo. Aparece na BNCC e no DCRC."},
 {c:"Ensino",t:"Abordagem indutiva",x:"Exemplos em contexto → o aluno observa → regra formulada. Dedutiva é o oposto: regra primeiro. Se a alternativa diz “o professor apresenta a regra e o aluno só aplica”, é dedutiva."},
 {c:"Ensino",t:"Multissemiótico e interdisciplinar",x:"Multissemiótico: combina linguagens (verbal, imagem, som, gráfico). Ex.: infográfico, meme, HQ, vídeo. Interdisciplinar: projetos que ligam Inglês a outras áreas e a temas da vida real."},
 {c:"Ensino",t:"BNCC do Ensino Médio",x:"Formação geral básica por áreas (Língua Inglesa em Linguagens e suas Tecnologias) + itinerários formativos. Confira no seu material a numeração exata das competências e habilidades (EM13LGG...)."},
 /* ---- P1 ---- */
 {c:"P1",t:"Leis que sempre caem",x:"LDB 9.394/96. 10.639/2003 = história e cultura afro-brasileira e africana. 11.645/2008 = afro + indígena. Educação básica = infantil + fundamental + médio. 800 h / 200 dias."},
 {c:"P1",t:"PNE: três ciclos",x:"2001–2010 (Lei 10.172/2001); 2014–2025 (Lei 13.005/2014, 20 metas); 2026–2036 (Lei 15.388/2026, decenal). Confirme no seu material os números de objetivos, metas e estratégias do novo plano."},
 {c:"P1",t:"Quem disse o quê",x:"<b>Vygotsky</b>: ZDP, mediação, interação. <b>Piaget</b>: estágios (sensório-motor, pré-operatório, operatório concreto, operatório formal). <b>Ausubel</b>: aprendizagem significativa. <b>Skinner</b>: condicionamento operante e reforço."},
 {c:"P1",t:"Tendências pedagógicas (Libâneo)",x:"Liberais: tradicional, renovada progressivista, renovada não diretiva, tecnicista. Progressistas: libertadora (Freire), libertária, crítico-social dos conteúdos."},
 {c:"P1",t:"LIMPE e modelos de administração",x:"Art. 37 CF: Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência. Patrimonialista → burocrático (DASP, 1936) → gerencial (1995)."},
 {c:"P1",t:"Direta e indireta",x:"Autarquias e fundações públicas: direito público. Empresas públicas e sociedades de economia mista: direito privado. Poderes: vinculado (sem margem), discricionário (conveniência e oportunidade), normativo, hierárquico, disciplinar (pune servidor), de polícia (limita direitos de particulares)."},
 {c:"P1",t:"Lei 9.784/99",x:"Processo administrativo federal. Prazo geral para recurso administrativo: 10 dias, contados da ciência da decisão (art. 59). Confira o restante no seu material."},
 {c:"P1",t:"Crase em 3 testes",x:"1) “Volto <b>da</b>...” → “vou <b>à</b>...”. 2) Troque por palavra masculina: se vier <b>ao</b>, há crase. 3) Não há crase antes de verbo, pronome pessoal, artigo indefinido nem, em regra, cidade sem artigo."},

async function initDb(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return; const id=await user.id(); if(!id)return;
    const ref=db.doc("data/users/"+id+"/progress");
    const snap=await ref.get(); const r=snap.exists?snap.data():null;
    if(r){
      S.hist=Object.assign({},r.hist||{},S.hist); S.checks=Object.assign({},r.checks||{},S.checks); S.fc=Object.assign({},r.fc||{},S.fc);
      if(r.cfg)S.cfg=Object.assign(S.cfg,r.cfg);
    }
    dbDoc=ref; try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
    await flush();
    if(!run)render();
  }catch(e){}
}

const $=s=>document.querySelector(s); const app=$("#app");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const Q = QUESTIONS; const byId={}; Q.forEach(q=>byId[q.id]=q);
let run=null; // {ids, i, sess:{}, done:bool}
let macCat="Todas", macQ="", confirmReset=false;

function daysLeft(){const t=new Date();t.setHours(0,0,0,0);return Math.round((EXAM-t)/86400000)}
function setCount(){const d=daysLeft();$("#count").textContent=d>1?`Prova em ${d} dias`:d===1?"Prova amanhã":d===0?"Prova hoje":"Prova realizada"}

function scopeIds(){
  const c=S.cfg; let ids=Q.filter(q=>{
    if(c.scope==="hard")return q.d==="hard";
    if(c.scope==="p2_hard")return q.d==="hard"&&BLOCKS[q.b][1]==="P2";
    if(c.scope==="adm")return q.s.includes("[Administração]");
    if(c.scope==="orig")return q.id<=60; if(c.scope==="new")return q.id>60&&q.id<=116; if(c.scope==="r3")return q.id>116&&q.id<=158;
    if(c.scope==="P2")return BLOCKS[q.b][1]==="P2"; if(c.scope==="P1")return q.b==="p1";
    if(BLOCKS[c.scope])return q.b===c.scope; return true;
  });
  if(c.status==="un")ids=ids.filter(q=>!S.hist[q.id]);
  if(c.status==="wrong")ids=ids.filter(q=>S.hist[q.id]&&!S.hist[q.id].ok);
  return ids.map(q=>q.id);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRun(){
  let ids=scopeIds(); if(S.cfg.shuffle==="1")ids=shuffle(ids);
  const n=+S.cfg.qty; if(n>0)ids=ids.slice(0,n);
  if(!ids.length)return; run={ids,i:0,sess:{},done:false}; render();window.scrollTo(0,0);
}

/* ---- views ---- */
function statsAll(){
  const ans=Object.values(S.hist); const ok=ans.filter(a=>a.ok).length;
  return {n:ans.length,ok,pct:ans.length?Math.round(100*ok/ans.length):0};
}
function viewHome(){
  const st=statsAll(), c=S.cfg, avail=scopeIds().length, qn=+c.qty, total=qn>0?Math.min(qn,avail):avail;
  const opt=(v,l,cur)=>`<option value="${v}"${String(cur)===String(v)?" selected":""}>${l}</option>`;
  const blk=Object.keys(BLOCKS).map(k=>opt(k,BLOCKS[k][0],c.scope)).join("");
  return `<section class="card"><h2>Seu progresso</h2>
   <div class="stats"><div class="stat"><b>${st.n}/${Q.length}</b><span>respondidas</span></div><div class="stat"><b>${st.pct}%</b><span>de acerto</span></div><div class="stat"><b>${Object.values(S.hist).filter(a=>!a.ok).length}</b><span>para revisar</span></div></div></section>
  <section class="card"><h2>Montar sessão</h2>
   <div class="grid2">
    <label class="f">Conteúdo<select id="f-scope">${opt("all",`Todas (${Q.length})`,c.scope)}${opt("hard","🔥 Nível Difícil · Estilo CEV/UECE (159–250)",c.scope)}${opt("p2_hard","🔥 Inglês Difícil · P2 CEV/UECE (62 questões)",c.scope)}${opt("adm","🏛️ Administração Pública (35 questões)",c.scope)}${opt("sint","🧩 Sintaxe e Orações (47 questões)",c.scope)}${opt("P2","Só Inglês (P2 completo)",c.scope)}${opt("P1","Só Conhecimentos Básicos (P1)",c.scope)}${opt("r3","Rodada 3, estilo banca (117–158)",c.scope)}${opt("new","Questões 61–116",c.scope)}${opt("orig","Simulado original (1–60)",c.scope)}${blk}</select></label>
    <label class="f">Situação<select id="f-status">${opt("all","Todas",c.status)}${opt("un","Ainda não respondidas",c.status)}${opt("wrong","Que errei",c.status)}</select></label>
    <label class="f">Quantidade<select id="f-qty">${opt("0","Todas as disponíveis",c.qty)}${opt("10","10 questões",c.qty)}${opt("20","20 questões",c.qty)}${opt("30","30 questões",c.qty)}</select></label>
    <label class="f">Ordem<select id="f-shuffle">${opt("1","Embaralhada",c.shuffle)}${opt("0","Ordem do caderno",c.shuffle)}</select></label>
   </div>
   <div class="row" style="margin-top:14px"><button class="btn" id="go"${total?"":" disabled"}>Começar (${total} questões)</button>${total?"":'<span class="muted small">Nenhuma questão com esse filtro.</span>'}</div>
   <p class="muted small" style="margin:12px 0 0">Depois de cada resposta aparecem a explicação e o ponto-chave. Dicas: teclas A–D marcam, Enter avança.</p></section>`;
}
function passageHtml(q){
  if(!q.p)return ""; const [t,ps]=PASSAGES[q.p];
  return `<details class="passage" open><summary>${esc(t)}</summary>${ps.map(p=>`<p>${esc(p)}</p>`).join("")}</details>`;
}
function viewQuiz(){
  const id=run.ids[run.i], q=byId[id], ch=run.sess[id]; const answered=ch!==undefined;
  const okN=Object.keys(run.sess).filter(k=>run.sess[k]===byId[k].a).length;
  const letters="ABCD";
  const opts=q.o.map((t,k)=>{
    let cl="opt"; if(answered){ if(k===q.a)cl+=" ok"; else if(k===ch)cl+=" no"; }
    return `<button class="${cl}" data-k="${k}"${answered?" disabled":""}><span class="l">${letters[k]}</span><span>${esc(t)}</span></button>`;
  }).join("");
  let fb="";
  if(answered){
    const good=ch===q.a; const last=run.i===run.ids.length-1;
    const expHtml=esc(q.e).split("\n").filter(Boolean).map(line=>{
      let cls="exp-item";
      if(line.includes("Análise dos distratores")||line.includes("Por que descartar"))cls+=" warn";
      else if(line.includes("Por que a alternativa"))cls+=" ok";
      const formatted=line.replace(/^•\s*([^:]+):/,'<b>$1:</b>');
      return `<div class="${cls}">${formatted}</div>`;
    }).join("");
    fb=`<div class="fb ${good?"ok":"no"}" role="status"><h3>${good?"Correto":"Errado"}. Gabarito: ${letters[q.a]}</h3><div class="exp-body">${expHtml}</div><div class="key"><b>Para não esquecer (Ponto-chave):</b> ${esc(q.k)}</div>
     <div class="row" style="margin-top:14px"><button class="btn" id="next">${last?"Ver resultado":"Próxima questão"}</button><button class="btn ghost" id="tomac">Macetes desse tema</button></div></div>`;
  }
  const diffBadge=q.d==="hard"?'<span class="tag hard">Nível Difícil · CEV/UECE</span>':"";
  return `<div class="qhead"><span>${run.i+1} de ${run.ids.length} · ${okN} certas</span><button class="chip" id="quit">Encerrar</button></div>
   <div class="bar"><i style="width:${Math.round(100*run.i/run.ids.length)}%"></i></div>
   <section class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="row" style="justify-content:space-between"><span class="qnum">Questão ${q.id}</span><div class="row" style="gap:6px">${diffBadge}<span class="tag">${BLOCKS[q.b][0]}</span></div></div>
    ${passageHtml(q)}<div class="stem">${esc(q.s)}</div><div class="opts">${opts}</div></section>${fb}`;
}
function blockStats(){
  const r={}; Object.keys(BLOCKS).forEach(k=>r[k]={n:0,ok:0,t:0});
  Q.forEach(q=>{r[q.b].t++; const h=S.hist[q.id]; if(h){r[q.b].n++; if(h.ok)r[q.b].ok++}}); return r;
}
function barRows(map){
  return Object.keys(map).map(k=>{const b=map[k];const p=b.n?Math.round(100*b.ok/b.n):0;
   return `<div class="rowline"><span>${BLOCKS[k][0]} <span class="muted small">(${b.ok}/${b.n} de ${b.t})</span></span><b>${b.n?p+"%":"–"}</b><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("");
}
function viewResult(){
  const ids=run.ids; const ok=ids.filter(i=>run.sess[i]===byId[i].a).length; const pct=Math.round(100*ok/ids.length);
  const per={}; ids.forEach(i=>{const b=byId[i].b; per[b]=per[b]||{n:0,ok:0,t:0}; per[b].n++; per[b].t++; if(run.sess[i]===byId[i].a)per[b].ok++});
  const wrong=ids.filter(i=>run.sess[i]!==byId[i].a);
  return `<section class="card"><h2>Resultado da sessão</h2>
   <div class="stats"><div class="stat"><b>${ok}/${ids.length}</b><span>acertos</span></div><div class="stat"><b>${pct}%</b><span>aproveitamento</span></div></div></section>
   <section class="card"><h2>Por assunto</h2><div class="rows">${barRows(per)}</div></section>
   <div class="row">${wrong.length?`<button class="btn" id="redo">Refazer as ${wrong.length} erradas</button>`:""}<button class="btn ghost" id="home">Nova sessão</button></div>`;
}
function viewDesemp(){
  const bs=blockStats(); const st=statsAll();
  const p2=Object.keys(BLOCKS).filter(k=>BLOCKS[k][1]==="P2"); let n=0,ok=0; p2.forEach(k=>{n+=bs[k].n;ok+=bs[k].ok});
  const est=n?Math.round(50*ok/n):null;
  let proj=`<p class="muted">Responda ao menos algumas questões de Inglês para ver a projeção.</p>`;
  if(n>=10){ const good=est>=20; proj=`<div class="stats"><div class="stat"><b>${est}/50</b><span>projeção P2</span></div><div class="stat"><b>20</b><span>mínimo na P2</span></div></div><p class="small" style="margin:10px 0 0;color:${good?"var(--good)":"var(--bad)"}">${good?"Acima":"Abaixo"} do corte de 20 pontos na P2, com base nos seus acertos nestas ${n} questões. É só uma estimativa; o banco aqui não tem o peso real da prova.</p>`; }
  const wrongBy=Object.keys(bs).filter(k=>bs[k].n>=3).sort((a,b)=>bs[a].ok/bs[a].n-bs[b].ok/bs[b].n)[0];
  const hint=wrongBy?`<p class="small">Seu assunto mais fraco até agora: <b>${BLOCKS[wrongBy][0]}</b> (${Math.round(100*bs[wrongBy].ok/bs[wrongBy].n)}%).</p>`:"";
  return `<section class="card"><h2>Visão geral</h2><div class="stats"><div class="stat"><b>${st.n}</b><span>respondidas</span></div><div class="stat"><b>${st.pct}%</b><span>acertos</span></div></div></section>
   <section class="card"><h2>Projeção no corte</h2>${proj}</section>
   <section class="card"><h2>Por assunto</h2><div class="rows">${barRows(bs)}</div>${hint}</section>
   <section class="card"><h2>Zerar progresso</h2>${confirmReset?`<p class="small">Isso apaga suas respostas e o checklist neste navegador.</p><div class="row"><button class="btn warn" id="reset-yes">Apagar tudo</button><button class="btn ghost" id="reset-no">Cancelar</button></div>`:`<button class="btn ghost" id="reset">Zerar progresso</button>`}</section>`;
}
let fc={cat:"Todas",status:"all",deck:null,i:0,flip:false};
function fcBuild(shuf){
  let ids=FC.map((_,i)=>i).filter(i=>(fc.cat==="Todas"||FC[i][0]===fc.cat)&&(fc.status==="all"||(fc.status==="rev"&&S.fc[i]===0)||(fc.status==="new"&&S.fc[i]===undefined)));
  fc.deck=shuf?shuffle(ids):ids; fc.i=0; fc.flip=false;
}
function viewFc(){
  if(!fc.deck)fcBuild(true);
  const known=Object.values(S.fc).filter(v=>v===1).length, rev=Object.values(S.fc).filter(v=>v===0).length;
  const sel=(id,opts,cur)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${v}"${v===cur?" selected":""}>${l}</option>`).join("")}</select>`;
  const head=`<section class="card"><div class="stats"><div class="stat"><b>${known}</b><span>já sei</span></div><div class="stat"><b>${rev}</b><span>para revisar</span></div><div class="stat"><b>${FC.length}</b><span>cartões</span></div></div>
   <div class="grid2" style="margin-top:12px"><label class="f">Assunto${sel("fc-cat",FCC.map(c=>[c,c]),fc.cat)}</label><label class="f">Situação${sel("fc-status",[["all","Todos"],["new","Ainda não vistos"],["rev","Para revisar"]],fc.status)}</label></div></section>`;
  if(!fc.deck.length)return head+`<div class="empty">Nenhum cartão com esse filtro.</div>`;
  if(fc.i>=fc.deck.length)return head+`<section class="card" style="text-align:center"><h2>Fim do baralho</h2><p class="muted">Você passou por ${fc.deck.length} cartões.</p><div class="row" style="justify-content:center"><button class="btn" id="fc-again">Embaralhar de novo</button></div></section>`;
  const c=FC[fc.deck[fc.i]];
  const st=S.fc[fc.deck[fc.i]]; const mark=st===1?" · marcado: já sei":st===0?" · marcado: revisar":"";
  return head+`<div class="qhead"><span>${fc.i+1} de ${fc.deck.length}${mark}</span><span class="tag">${c[0]}</span></div>
   <button class="flash${fc.flip?" back":""}" id="fc-card" aria-label="Virar cartão"><small>${fc.flip?"Resposta":"Pergunta"}</small><span>${esc(fc.flip?c[2]:c[1])}</span></button>
   <div class="row">${fc.flip?`<button class="btn warn" id="fc-rev">Revisar</button><button class="btn" id="fc-know">Já sei</button>`:`<button class="btn" id="fc-flip">Virar</button>`}<button class="btn ghost" id="fc-skip">Pular</button><button class="btn ghost" id="fc-shuf">Embaralhar</button></div>
   <p class="muted small" style="margin:0">Dica: espaço vira o cartão.</p>`;
}
function viewMac(){
  const cats=["Todas",...CAT_ORDER]; const q=macQ.trim().toLowerCase();
  const list=MAC.filter(m=>(macCat==="Todas"||m.c===macCat)&&(!q||(m.t+" "+m.x).toLowerCase().includes(q)));
  const names={Prova:"Prova e edital",Tempos:"Tempos verbais",Gramática:"Gramática",Sintaxe:"Sintaxe",Leitura:"Leitura",Ensino:"Ensino de inglês",P1:"Conhecimentos básicos"};
  const chips=cats.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${c===macCat}">${c==="Todas"?"Todas":names[c]}</button>`).join("");
  const cards=list.length?list.map(m=>`<article class="mac"><span class="tag">${names[m.c]}</span><h3>${m.t}</h3><p>${m.x}</p></article>`).join(""):`<div class="empty">Nenhum macete com essa busca.</div>`;
  const chk=CHECK.map((t,i)=>`<label class="check"><input type="checkbox" data-chk="${i}"${S.checks[i]?" checked":""}><span>${esc(t)}</span></label>`).join("");
  return `<section class="card"><label class="f" for="mq">Buscar macete<input id="mq" type="search" value="${esc(macQ)}" placeholder="ex.: crase, since, mustn't, Ideb"></label>
   <div class="chips" style="margin-top:12px">${chips}</div></section>
   <div class="mgrid">${cards}</div>
   <section class="card"><h2>Checklist do dia da prova</h2><div>${chk}</div></section>`;
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  let h;
  if(S.tab==="macetes")h=viewMac(); else if(S.tab==="cartoes")h=viewFc(); else if(S.tab==="desempenho")h=viewDesemp();
  else h=!run?viewHome():run.done?viewResult():viewQuiz();
  const mq=document.activeElement&&document.activeElement.id==="mq";
  app.innerHTML=h; bind();
  if(mq){const el=$("#mq");el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}
function answer(k){
  const id=run.ids[run.i]; if(run.sess[id]!==undefined)return;
  run.sess[id]=k; S.hist[id]={ok:k===byId[id].a}; save(); render();
  const f=document.querySelector(".fb"); if(f)f.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function nextQ(){ if(run.i<run.ids.length-1){run.i++;}else{run.done=true} render(); window.scrollTo(0,0); }
function bind(){
  const on=(s,f)=>{const e=$(s); if(e)e.addEventListener("click",f)};
  ["scope","status","qty","shuffle"].forEach(k=>{const e=$("#f-"+k); if(e)e.addEventListener("change",()=>{S.cfg[k]=e.value;save();render()})});
  on("#go",startRun);
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  on("#next",nextQ); on("#quit",()=>{run=null;render()});
  on("#tomac",()=>{const b=byId[run.ids[run.i]].b; macCat={leitura:"Leitura",tempos:"Tempos",passiva:"Gramática",pron:"Gramática",sint:"Sintaxe",ensino:"Ensino",p1:"P1"}[b]; S.tab="macetes"; save(); render(); window.scrollTo(0,0)});
  on("#redo",()=>{const ids=run.ids.filter(i=>run.sess[i]!==byId[i].a); run={ids:shuffle(ids),i:0,sess:{},done:false}; render(); window.scrollTo(0,0)});
  on("#home",()=>{run=null;render()});
  on("#reset",()=>{confirmReset=true;render()}); on("#reset-no",()=>{confirmReset=false;render()});
  on("#reset-yes",()=>{S.hist={};S.checks={};S.fc={};fc.deck=null;confirmReset=false;run=null;save();render()});
  const fcs=(id,f)=>{const e=$("#"+id); if(e)e.addEventListener("change",()=>{f(e.value);fcBuild(true);render()})};
  fcs("fc-cat",v=>fc.cat=v); fcs("fc-status",v=>fc.status=v);
  const fcm=v=>{S.fc[fc.deck[fc.i]]=v;save();fc.i++;fc.flip=false;render()};
  on("#fc-card",()=>{fc.flip=!fc.flip;render()}); on("#fc-flip",()=>{fc.flip=true;render()});
  on("#fc-know",()=>fcm(1)); on("#fc-rev",()=>fcm(0));
  on("#fc-skip",()=>{fc.i++;fc.flip=false;render()}); on("#fc-shuf",()=>{fcBuild(true);render()}); on("#fc-again",()=>{fcBuild(true);render()});
  document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{macCat=b.dataset.cat;render()}));
  const mq=$("#mq"); if(mq)mq.addEventListener("input",()=>{macQ=mq.value;render()});
  document.querySelectorAll("[data-chk]").forEach(c=>c.addEventListener("change",()=>{S.checks[c.dataset.chk]=c.checked;save()}));
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;save();render();window.scrollTo(0,0)}));
document.addEventListener("keydown",e=>{
  if(S.tab==="cartoes"&&e.key===" "&&fc.deck&&fc.i<fc.deck.length){const t0=e.target.tagName; if(t0!=="INPUT"&&t0!=="SELECT"&&t0!=="BUTTON"){e.preventDefault();fc.flip=!fc.flip;render();return}}
  if(S.tab!=="treinar"||!run||run.done)return; const t=e.target.tagName; if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA")return;
  const id=run.ids[run.i]; const k="abcd".indexOf(e.key.toLowerCase());
  if(k>=0&&e.key.length===1&&run.sess[id]===undefined){answer(k)}
  else if(e.key==="Enter"&&run.sess[id]!==undefined&&t!=="BUTTON"){nextQ()}
});
setCount(); render(); initDb();
</script>

</body></html>
